[package]
name = "ppvpn-core"
version = "0.0.0"
description = "PeakPass VPN core: profile, routing, DNS policy, failover and local proxy on sail"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ppvpn_core"

[dependencies]
base64.workspace = true
chrono.workspace = true
idna.workspace = true
sail.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# The versions sail resolves (Cargo.lock), so nothing is built twice.
async-trait = "0.1"
futures-util = "0.3"
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }
