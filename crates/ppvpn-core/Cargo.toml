[package]
name = "ppvpn-core"
version = "0.0.0"
description = "PeakPass VPN core: profile, routing, DNS policy, failover and local proxy on sail"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ppvpn_core"

[dependencies]
base64.workspace = true
chrono.workspace = true
idna.workspace = true
sail.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# The versions sail resolves (Cargo.lock), so nothing is built twice.
async-trait = "0.1"
futures-util = "0.3"
getrandom = "0.4"
hickory-proto = { version = "0.26.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"

# Unprivileged ICMP for entrance probes (src/probe/icmp.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }
