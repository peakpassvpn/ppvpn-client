[package]
name = "ppvpn-engine-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Core API v1 served from an in-process ppvpn-core Engine, for the PPVPN desktop client and its privileged service"

[dependencies]
ppvpn-core-wire = { path = "../core-wire", features = ["driver"] }
ppvpn-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"

[dev-dependencies]
ppvpn-core = { path = "../core", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
