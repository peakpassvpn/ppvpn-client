[package]
name = "ppvpn-cli"
version = "0.0.0"
description = "PeakPass VPN command-line client: a local HTTP/SOCKS5 proxy driven by ppvpn-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ppvpn_cli"

[[bin]]
name = "ppvpn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
clap_complete = "4"
libc = "0.2"
ppvpn-account = { path = "../account" }
ppvpn-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The version ppvpn-core and sail resolve (Cargo.lock).
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# musl's allocator costs about 2.5x the CPU of glibc's under high throughput
# (sail's measurement), so static Linux builds use mimalloc.
# Device credentials live only in the platform secret store, never in a
# plain file: Keychain on macOS, Secret Service on Linux (pure-Rust D-Bus and
# crypto on tokio, so static musl builds need no libdbus or OpenSSL).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", default-features = false, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[features]
# Test support for tests/ (a daemon on ppvpn-core's in-memory runtime):
# turned on by the dev-dependency on this crate below, so never in the
# `ppvpn` binary that ships.
testing = ["ppvpn-core/testing"]

[dev-dependencies]
base64.workspace = true
ppvpn-cli = { path = ".", features = ["testing"] }
tempfile = "3"
