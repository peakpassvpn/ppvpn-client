[package]
name = "ppvpn-account"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "PPVPN backend account client: device-code login, credential rotation and the account API"

[dependencies]
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# The OS proxy for API calls (src/sysproxy.rs, #476): environment, macOS
# SystemConfiguration, Windows WinINet.
hyper-util = { version = "0.1.20", features = ["client-proxy", "client-proxy-system"] }
http = "1"
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
base64.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
