# The Rust ppvpn-core (#214): a library linking sail directly, hosted in
# process by Desktop and the CLI. The Go core it replaces is gone from main;
# v0.5.21, its last release, keeps its tag and release files.
[workspace]
members = ["crates/core", "crates/cli", "crates/account", "crates/core-lab", "crates/engine-host", "crates/desktop", "crates/service", "crates/tunnel-host", "apps/flutter/rust", "apps/flutter/push-agent"]
# What a bare cargo command at the root builds, and so what ci.yml's
# required jobs cover; the desktop crates and the service have their own
# jobs there (desktop-*).
default-members = ["crates/core", "crates/cli", "crates/account", "crates/core-lab"]
resolver = "2"

[workspace.package]
# One version for every crate the project ships (engine, account, CLI,
# desktop, service): it goes on from the Go core's last, v0.5.21.
version = "0.7.3"
edition = "2021"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/peakpassvpn/ppvpn-client"

[workspace.dependencies]
# sail by release: only a tagged release is taken. Cargo.lock holds the
# commit the tag named when it was locked, so --locked builds stay on it.
# Fixes are tried on sail's master first; the tag moves when a release
# carries them. Moving it is a commit of its own that also takes sail's
# [patch.crates-io] below as of that release (CI runs sail's
# tools/embed-patch-check.py).
# auto-reload is not among sail's defaults and must stay on: without it the
# runtime does not follow certificate files that change on disk.
sail = { git = "https://github.com/peakpassvpn/sail.git", tag = "v0.22.0", features = ["auto-reload"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
idna = "1"
# JNI for the Android libraries (the tunnel host, the Flutter bridge).
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Copied from sail's Cargo.toml at the commit above: sail builds against its
# forks, so a crate that links sail must patch the same. Keep in step with
# the sail rev (CI compares them).
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
# One revision for both; FORK.md there says what each carries.
quinn = { git = "https://github.com/peakpassvpn/quinn.git", rev = "f814623b47c3435cf71b7570780c1dcf136a9b5c" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "f814623b47c3435cf71b7570780c1dcf136a9b5c" }
# tun-rs's netlink graph without paste (RUSTSEC-2024-0436), on one
# netlink-sys (0.9); see sail's tools/security/policy.toml for when these go.
netconfig-rs = { git = "https://github.com/peakpassvpn/netconfig-rs.git", rev = "c4186a6416cce1b66ca65200b7a23b5e859181d7" }
route_manager = { git = "https://github.com/tun-rs/route_manager.git", rev = "d0a6c5e3fbea1b4fba74bd2ad9739bc670936aaf" }

# The mobile tunnel host as the iOS extension links it
# (crates/tunnel-host/scripts/build-xcframework.sh): sail's dist-mobile, thin
# LTO in one codegen unit (smaller and quicker to link than fat LTO,
# measured by sail). Panics unwind: the C functions catch them.
[profile.mobile]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = false

# The privileged service as it ships (tools/desktop/build-service.sh and the
# Windows package.ps1): small and stripped. Panics unwind, the default: sail
# contains a task's panic only then, once the service hosts the engine.
[profile.service]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
