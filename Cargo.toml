# The Rust ppvpn-core (#45): a library linking sail directly, hosted in
# process by Desktop and the CLI. The Go core (cmd/, internal/, ...) stays
# frozen at v0.5.21 beside it until the hosts switch over.
[workspace]
members = ["crates/ppvpn-core", "crates/ppvpn-cli", "crates/ppvpn-account", "crates/ppvpn-core-lab", "desktop/crates/ppvpn-client"]
# What a bare cargo command at the root builds, and so what rust.yml's
# required jobs cover; the desktop client has its own jobs (desktop.yml).
default-members = ["crates/ppvpn-core", "crates/ppvpn-cli", "crates/ppvpn-account", "crates/ppvpn-core-lab"]
# The privileged service keeps its own Cargo.lock and release profile (its
# build id hashes that lock) until it links ppvpn-core.
exclude = ["desktop/service"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/peakpassvpn/ppvpn-core"

[workspace.dependencies]
# sail by commit (#45: regressions run on named commits, no release needed).
# Moving it is a commit of its own that also takes sail's [patch.crates-io]
# below as of that commit (CI runs sail's tools/embed-patch-check.py).
# auto-reload is not among sail's defaults and must stay on: without it the
# runtime does not follow certificate files that change on disk.
sail = { git = "https://github.com/peakpassvpn/sail.git", rev = "2eb3fe471796f77219428b2624d7dd1fe88891ac", features = ["auto-reload"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
idna = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Copied from sail's Cargo.toml at the commit above: sail builds against its
# forks, so a crate that links sail must patch the same. Keep in step with
# the sail rev (CI compares them).
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "ac0737da7704788407daab3c5e6abd3dca7ae55e" }
# tun-rs's netlink graph without paste (RUSTSEC-2024-0436); see
# sail's tools/security/policy.toml for when these go.
netconfig-rs = { git = "https://github.com/peakpassvpn/netconfig-rs.git", rev = "a5caf848a0e0f18bc9810c1fa854f3ac6a903443" }
route_manager = { git = "https://github.com/peakpassvpn/route_manager.git", rev = "5703367f56a7b4fed9fd02e216f2f110b4186eda" }
