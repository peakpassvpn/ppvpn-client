[package]
name = "ppvpn-flutter"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false
description = "The Flutter desktop prototype's bridge to the PPVPN client (#387)"

[lib]
name = "ppvpn_flutter"
# Loaded by the Flutter app at run time (ExternalLibrary.open).
crate-type = ["cdylib", "lib"]

[dependencies]
ppvpn-desktop = { path = "../../../crates/desktop" }
# The Dart package and the codegen in ci.yml are the same version: the
# generated glue checks it at start.
flutter_rust_bridge = "=2.13.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# The shell link's property store, for the installer's
# `--set-shortcut-aumid` (aumid.rs), as the push agent's WinRT toasts use
# the same crate.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
# The privileged service hooks: the SCM query and the UAC launch of the
# install helpers (hooks.rs), as the native Windows app does them. The
# single instance's pipe, the toast's click activator and the installer's
# quit event (instance.rs). The native app's sign-in in the Credential
# Manager (credentials.rs). The AppUserModelID and its registration
# (aumid.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The native app's sign-in in the Secret Service (credentials.rs), on the
# zbus the CLI and the push agent already lock.
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

# flutter_rust_bridge's #[frb] expands to code under `cfg(frb_expand)`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
