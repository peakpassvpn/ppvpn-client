[package]
name = "ppvpn-flutter"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false
description = "The Flutter desktop prototype's bridge to the PPVPN client (#387)"

[lib]
name = "ppvpn_flutter"
# Loaded by the Flutter app at run time (ExternalLibrary.open).
crate-type = ["cdylib", "lib"]

[dependencies]
ppvpn-desktop = { path = "../../../crates/desktop" }
# The Dart package and the codegen in ci.yml are the same version: the
# generated glue checks it at start.
flutter_rust_bridge = "=2.13.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# The privileged service hooks: the SCM query and the UAC launch of the
# install helpers (hooks.rs), as the native Windows app does them.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# flutter_rust_bridge's #[frb] expands to code under `cfg(frb_expand)`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
