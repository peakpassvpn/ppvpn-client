name: ppvpn_flutter
description: The PPVPN Flutter desktop prototype (#387).
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Exact versions: forui is before 1.0, and flutter_rust_bridge must match
# the Rust crate and the codegen (2.13.0 in all three).
dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_svg: 2.3.0
  forui: 0.27.6
  tray_manager: 0.8.0
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  assets:
    - assets/tray/
    # flag-icons 7.6.0 (MIT, assets/flags/LICENSE), 4:3, the exit countries
    # we expect; others get a lettered tile.
    - assets/flags/
  # Numbers and addresses (theme.dart `Tokens.mono`); Inter comes with forui.
  # OFL: assets/fonts/JetBrainsMono-OFL.txt.
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
