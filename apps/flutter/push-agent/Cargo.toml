[package]
name = "ppvpn-push-agent"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false
description = "Shows backend pushes as notifications while the Flutter desktop app is closed (#401)"

# macOS keeps its Swift agent: there the binary is a stub (main.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
ppvpn-desktop = { path = "../../../crates/desktop" }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
chrono = { workspace = true }
# Toasts through WinRT (as the .NET agent's Toasts.cs does by hand).
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_System_WinRT",
] }
# The instance mutex, the quit event, the Run value and the toast
# registration.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# org.freedesktop.Notifications, on the zbus the CLI already locks.
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
