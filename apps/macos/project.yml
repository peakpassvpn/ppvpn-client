name: PPVPN
options:
  bundleIdPrefix: com.peakpassvpn.ppvpn
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.7.4"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing would add get-task-allow (debugger attach) to Release too.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS[config=Release]: NO
    DEAD_CODE_STRIPPING: YES
packages:
  PPVPNClient:
    path: PPVPNClient
  PPVPNAppLogic:
    path: AppLogic
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0
targets:
  # Push agent: UI-less helper started by launchd at login (SMAppService.agent),
  # embedded in the Flutter app at Contents/Library/LoginItems/PPVPN Agent.app
  # by apps/flutter/scripts/package-macos.sh, which also takes the Sparkle
  # framework and its sign_update from this build's resolved packages: the
  # agent depends on Sparkle without linking it, so that it is resolved.
  PPVPNAgent:
    type: application
    platform: macOS
    sources:
      - path: PPVPNAgent
    dependencies:
      - package: PPVPNClient
      - package: PPVPNAppLogic
      - package: Sparkle
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peakpassvpn.ppvpn.desktop.agent
        PRODUCT_NAME: PPVPN Agent
        CODE_SIGN_ENTITLEMENTS: PPVPNAgent/PPVPNAgent.entitlements
        # PPVPNClientFFI.framework is shared with the app, in
        # PPVPN.app/Contents/Frameworks (Contents/Library/LoginItems/
        # PPVPN Agent.app/Contents/MacOS is five levels below Contents).
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        # Notifications show under this name.
        INFOPLIST_KEY_CFBundleDisplayName: PPVPN
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 PeakPass Labs LLC"
        SKIP_INSTALL: YES
