[package]
name = "ppvpn-client"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "PPVPN desktop client logic shared by the native macOS and Windows apps"

[lib]
name = "ppvpn_client"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[features]
# Link the Rust ppvpn-core (in process) instead of driving the Go core over
# IPC. Off by default; CI checks it on Linux.
rust-core = ["dep:ppvpn-core", "dep:sail"]

[build-dependencies]
sha2 = "0.10"

[dependencies]
ppvpn-account = { path = "../../../crates/ppvpn-account" }
# The Rust core (ppvpn-core#45), behind `rust-core` until the hosts switch.
ppvpn-core = { path = "../../../crates/ppvpn-core", optional = true }
# sail's tracing layer, installed next to ours (host-integration.md section 10).
sail = { workspace = true, optional = true }
uniffi = { version = "=0.31.0", features = ["cli", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
tracing-appender = "0.2.5"
iana-time-zone = "0.1.65"
sys-locale = "0.3.2"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# Conflict detection reads adapters, routes and DNS through IP Helper
# (milliseconds; PowerShell took 13-16 s).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # PeekNamedPipe: the service watch polls its pipe instead of blocking.
    "Win32_System_Pipes",
] }

