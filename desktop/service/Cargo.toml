[package]
name = "ppvpn-service"
version = "0.4.0"
edition = "2021"
authors = ["PeakPass VPN LLC"]
description = "Privileged helper service for PPVPN transparent routing"
license = "GPL-3.0-only"

[[bin]]
name = "ppvpn-service"
path = "src/main.rs"

[[bin]]
name = "ppvpn-service-install"
path = "src/install.rs"

[[bin]]
name = "ppvpn-service-uninstall"
path = "src/uninstall.rs"

[dependencies]
anyhow = "1"
log = "0.4"
log4rs = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
sysinfo = "0.32"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
sha2 = "0.10"

# Windows version resource on the three exes (build.rs; Windows hosts only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winapi = { version = "0.3", features = [
    "namedpipeapi",
    "ioapiset",
    "handleapi",
    "jobapi2",
    "winbase",
    "winnt",
    "winerror",
    "errhandlingapi",
    "accctrl",
    "aclapi",
    "securitybaseapi",
    "minwinbase",
    "processthreadsapi",
    "guiddef",
    "softpub",
    "wincrypt",
    "windef",
    "wintrust",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
