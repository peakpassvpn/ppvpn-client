name: Bounded macOS APNs OS registration probe
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft holding the reviewed signed diagnostic app
        required: true
      zip_sha256:
        required: true
      executable_sha256:
        required: true
      profile_sha256:
        required: true
      verifier_sha256:
        required: true
permissions:
  contents: read
concurrency:
  group: macos-apns-os-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    # Draft asset retrieval needs this scope (same as native acceptance).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ZIP_SHA256: ${{ inputs.zip_sha256 }}
      EXECUTABLE_SHA256: ${{ inputs.executable_sha256 }}
      PROFILE_SHA256: ${{ inputs.profile_sha256 }}
      VERIFIER_SHA256: ${{ inputs.verifier_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Stage the reviewed signed diagnostic
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          mkdir -p "$RUNNER_TEMP/probe-download" "$RUNNER_TEMP/native-apns-probe"
          gh release download "$RELEASE_TAG" --pattern ppvpn-macos-apns-capability-arm64-344.zip --dir "$RUNNER_TEMP/probe-download"
          python3 - <<'PY'
          import hashlib,json,os,stat,subprocess,zipfile
          from pathlib import Path,PurePosixPath
          work=Path(os.environ['RUNNER_TEMP'])
          archive=work/'probe-download/ppvpn-macos-apns-capability-arm64-344.zip'
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==os.environ['ZIP_SHA256']
          with zipfile.ZipFile(archive) as source:
              names=set()
              for item in source.infolist():
                  path=PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and item.filename not in names
                  assert not stat.S_ISLNK(item.external_attr >> 16)
                  names.add(item.filename)
          arch=subprocess.check_output(['uname','-m'],text=True).strip()
          record={'scope':'OS registration feasibility only; no login, proof store, worker, send or delivery',
                  'controller_source':os.environ['GITHUB_SHA'],'runner_architecture':arch,
                  'runner_image':os.environ.get('ImageVersion'),
                  'macos':subprocess.check_output(['sw_vers','-productVersion'],text=True).strip(),
                  'xcode':subprocess.check_output(['xcodebuild','-version'],text=True).strip(),
                  'signed_zip_sha256_verified':True,'private_key_transferred':False,'raw_logs_retained':False}
          (work/'probe-infrastructure.json').write_text(json.dumps(record,indent=2)+'\n')
          assert arch=='arm64','Reviewed diagnostic requires an arm64 hosted Mac'
          PY
          ditto -x -k "$RUNNER_TEMP/probe-download/ppvpn-macos-apns-capability-arm64-344.zip" "$RUNNER_TEMP/native-apns-probe"
      - name: Observe actual OS callbacks for at most 120 seconds
        shell: bash
        run: |
          python3 tools/apple/macos_apns_runner_probe.py \
            --app "$RUNNER_TEMP/native-apns-probe/PPVPN APNs Capability Probe.app" \
            --executable-sha256 "$EXECUTABLE_SHA256" --profile-sha256 "$PROFILE_SHA256" \
            --verifier tools/apple/push_config.py --verifier-sha256 "$VERIFIER_SHA256" \
            --timeout 120 --output "$RUNNER_TEMP/native-apns-os-result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-apns-os-probe-redacted-receipts
          path: |
            ${{ runner.temp }}/native-apns-os-result.json
            ${{ runner.temp }}/probe-infrastructure.json
          if-no-files-found: warn
          retention-days: 3
