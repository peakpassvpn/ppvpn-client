name: lab

# The engine lab (test/lab/engine, gate G2 of #45) on a GitHub-hosted
# runner: a Docker lab on internal networks (TEST-NET addresses, nodes in
# containers, a privileged client), nothing outside the runner.
#   cases   the lab's case groups on the Go core (its baseline) and on the
#           Rust core, both strict (udp.3 expects per engine: D4).
#           Each group first checks the core runs and answers get-status,
#           and fails as a whole when it does not;
#   repro   the Sail regression: every repro on the pinned sail and on
#           sing-box 1.13.12, and the comparisons (main pushes, nightly,
#           by hand); its logs are kept as an artifact.
# A failed nightly run opens, or comments on, an issue. Not a required
# check yet.

on:
  pull_request:
    paths:
      - "crates/**"
      - "cmd/**"
      - "internal/**"
      - "test/lab/engine/**"
      - "Cargo.lock"
      - "go.sum"
      - ".github/workflows/lab.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LAB_WORK: ${{ github.workspace }}/lab-work
  LAB_BIN: ${{ github.workspace }}/lab-bin

jobs:
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lab
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: sail commit
        id: sail
        run: echo "rev=$(awk '/^name = "sail"$/ {f=1; next} f && /^source = / {sub(/.*#/, ""); sub(/"$/, ""); print; exit}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      # sail-cli by its commit: built once per sail commit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LAB_BIN }}/sail-${{ steps.sail.outputs.rev }}
          key: lab-sail-cli-${{ steps.sail.outputs.rev }}-x86_64-unknown-linux-musl
      # BoringSSL as btls publishes it (verified), as in rust.yml; the musl
      # one for sail-cli.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock $target | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
          done
      - name: build the lab's binaries
        run: test/lab/engine/ci-build.sh "$LAB_BIN"
      - name: up
        run: sh test/lab/engine/lab.sh up "$LAB_BIN/sail" "$LAB_BIN/ppvpn-core" "$LAB_BIN/sing-box" "$LAB_BIN/ppvpn-core-lab"
      - name: cases on the Go core
        run: |
          status=0
          for group in udp dns-hijack reverse-map; do
            echo "::group::$group"
            sh test/lab/engine/lab.sh case $group sing || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: cases on the Rust core
        run: |
          status=0
          for group in udp dns-hijack reverse-map; do
            echo "::group::$group"
            sh test/lab/engine/lab.sh case $group rust || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: down
        if: always()
        run: sh test/lab/engine/lab.sh down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: lab-cases-logs
          path: ${{ env.LAB_WORK }}/repro-logs
          retention-days: 7

  # The Sail regression: not on pull requests (sail moves by its own commits).
  repro:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lab
          save-if: false
      - name: sail commit
        id: sail
        run: echo "rev=$(awk '/^name = "sail"$/ {f=1; next} f && /^source = / {sub(/.*#/, ""); sub(/"$/, ""); print; exit}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LAB_BIN }}/sail-${{ steps.sail.outputs.rev }}
          key: lab-sail-cli-${{ steps.sail.outputs.rev }}-x86_64-unknown-linux-musl
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock $target | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
          done
      - name: build the lab's binaries
        run: test/lab/engine/ci-build.sh "$LAB_BIN"
      - name: up
        run: sh test/lab/engine/lab.sh up "$LAB_BIN/sail" "$LAB_BIN/ppvpn-core" "$LAB_BIN/sing-box" "$LAB_BIN/ppvpn-core-lab"
      - name: every repro, sail and sing-box
        run: sh test/lab/engine/lab.sh run-all ci "$LAB_BIN/sail"
      - name: comparisons with sing-box
        run: sh test/lab/engine/lab.sh compare ci="$LAB_BIN/sail"
      - name: down
        if: always()
        run: sh test/lab/engine/lab.sh down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lab-repro-logs
          path: ${{ env.LAB_WORK }}/repro-logs
          retention-days: 14

  # A failed nightly run is told in an issue, one kept open while it fails.
  report:
    needs: [cases, repro]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="lab: the nightly run fails"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Failed again: $RUN"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "The nightly engine lab run failed: $RUN (logs in its artifacts). Close this once a nightly run passes."
          fi
