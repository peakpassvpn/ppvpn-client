name: desktop-release

# The only workflow that publishes the desktop client. By hand only; it
# gives the three platforms one version and one build number and builds
# them (desktop-package.yml, in the channel's environment, which holds the
# signing secrets and, for dev, the backend address).
#
#   stable: run on the tag desktop-vX.Y.Z. The installers are published as
#           a GitHub Release with SHA256SUMS and build provenance.
#   dev:    run on the branch main. Never published: no release, no tag.
#           The installers stay the package jobs' workflow artifacts (a dev
#           build carries the dev backend's address).
#
# A stable release is refused unless the repository variable
# DESKTOP_STABLE_RELEASES is "enabled": the desktop is not released before
# its engine is switched. Until then, and to try a change of this workflow,
# there is the rehearsal: a stable run on main that does everything a
# release does except what the public can see. It builds, signs and checks
# the files, makes a draft release (no tag; only the repository's members
# see a draft), and builds the update site as a workflow artifact instead
# of deploying it. Build provenance is left out of a rehearsal: an
# attestation is an entry in a public log.
#
# A desktop release is never the repository's "latest" release: that is
# the core's (release.yml, tags vX.Y.Z, which the desktop tags do not match).
#
# After a stable release the update site (channel pointer, feeds, apt/dnf
# repositories) is rebuilt from the releases and deployed
# (desktop-pages.yml). The dev channel is not on the site.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [dev, stable]
        required: true
      version:
        description: Version x.y.z (stable runs must be on the tag desktop-v<version>)
        required: true
      allow_downgrade:
        description: stable only - publish even if not newer than the published release (a deliberate rollback)
        type: boolean
        default: false
      rehearsal:
        description: stable only - run the whole release without publishing anything (a draft release, no tag, no provenance, no deployment); on main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - id: resolve
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          REHEARSAL: ${{ inputs.rehearsal }}
          STABLE_RELEASES: ${{ vars.DESKTOP_STABLE_RELEASES }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          # The last build number published before this workflow existed,
          # so that the counter never goes back (it is the fourth field of
          # the Windows file version, which updates compare).
          BUILD_OFFSET: ${{ vars.DESKTOP_BUILD_OFFSET || '0' }}
        run: |
          set -eu
          version=${VERSION#v}
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must be x.y.z, got '$VERSION'" >&2
            exit 1
          fi
          if ! printf '%s' "$BUILD_OFFSET" | grep -Eq '^[0-9]+$'; then
            echo "the variable DESKTOP_BUILD_OFFSET must be a number" >&2
            exit 1
          fi
          # One counter for every platform and channel: this workflow's run
          # number over the offset. It must only ever grow, so no other
          # workflow may publish.
          build=$((BUILD_OFFSET + RUN_NUMBER))
          if [ "$build" -gt 65535 ]; then
            echo "build number $build exceeds 65535" >&2
            exit 1
          fi
          case "$CHANNEL" in
            stable)
              tag="desktop-v$version"
              publish=true
              if [ "$REHEARSAL" = true ]; then
                # Nothing public comes of it, so no tag: the name is only
                # what the draft release and the site's files carry.
                if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" != main ]; then
                  echo "a rehearsal must run on the branch main (got $REF_TYPE $REF_NAME)" >&2
                  exit 1
                fi
              else
                if [ "$STABLE_RELEASES" != enabled ]; then
                  echo "stable releases are not enabled: the desktop is not released before the engine switch (variable DESKTOP_STABLE_RELEASES). Use the rehearsal to try the release." >&2
                  exit 1
                fi
                if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "$tag" ]; then
                  echo "stable releases must run on the tag $tag (got $REF_TYPE $REF_NAME)" >&2
                  exit 1
                fi
              fi
              ;;
            dev)
              if [ "$REHEARSAL" = true ]; then
                echo "a rehearsal is of the stable release; a dev run publishes nothing anyway" >&2
                exit 1
              fi
              # No tag and no release: tags are public too.
              tag=""
              publish=false
              # A second guard beside the environment's own branch rule.
              if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" != main ]; then
                echo "dev releases must run on the branch main (got $REF_TYPE $REF_NAME)" >&2
                exit 1
              fi
              ;;
            *) echo "unknown channel $CHANNEL" >&2; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "build_number=$build"
            echo "tag=$tag"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "$CHANNEL $version build $build, tag ${tag:-none}, publish: $publish" >>"$GITHUB_STEP_SUMMARY"
          if [ "$REHEARSAL" = true ]; then
            echo "**Rehearsal**: nothing is published. No tag, no provenance, a draft release, the site as an artifact." >>"$GITHUB_STEP_SUMMARY"
          fi

  # The one approval of a stable run, rehearsals included: the environment
  # has the reviewers and no secret. Every job after it that reads the
  # stable environment's secrets needs this one, so none of them runs
  # unapproved. A dev run needs no approval.
  approve:
    if: inputs.channel == 'stable'
    needs: prepare
    runs-on: ubuntu-latest
    environment: desktop-release-approval
    steps:
      - run: echo "approved"

  package:
    # After the approval for stable; for dev, where it is skipped, without.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.approve.result == 'success' || (inputs.channel == 'dev' && needs.approve.result == 'skipped')) }}
    needs: [prepare, approve]
    uses: ./.github/workflows/desktop-package.yml
    with:
      channel: ${{ inputs.channel }}
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      environment: desktop-release-${{ inputs.channel }}
    # The package jobs run in the environment and use its secrets. A called
    # workflow sees an environment's secrets only when the caller hands its
    # secrets on: with none passed, they were empty there (first dev run).
    # The repository itself holds no secret, only the environments do, so
    # nothing else is handed on. Keep it so: a repository-level secret
    # added later would reach the package workflow through this line.
    secrets: inherit

  # Stable only (a dev build ends with the package jobs' artifacts). The
  # release's files: the rpms signed, then everything
  # checked as a whole before anything is published:
  # all five platforms, each installer against its metadata, the update
  # signatures, the tag, and that the channel does not go back.
  release-files:
    if: inputs.channel == 'stable' && needs.prepare.outputs.publish == 'true'
    needs: [prepare, approve, package]
    runs-on: ubuntu-latest
    # For the package repositories' signing key, which signs the rpms here.
    environment: desktop-release-stable
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL: stable
      SITE_BASE: ${{ vars.DESKTOP_SITE_BASE }}
      ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            desktop/scripts/ci
            desktop/apps/linux/packaging
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: artifacts
      - name: Collect
        run: |
          set -eu
          mkdir release
          find artifacts -type f | while read -r file; do
            name=$(basename "$file")
            [ ! -e "release/$name" ] || { echo "two artifacts carry $name" >&2; exit 1; }
            mv "$file" "release/$name"
          done
          ls -l release
      # The rpm becomes a release asset signed: the dnf repository points at
      # the asset. Signing changes the file, so its metadata is rewritten
      # here, before the checks, the checksums and the provenance below.
      # The key must be the one whose public half the packages ship
      # (packaging/ppvpn.asc), which clients already trust.
      - name: Sign the rpms
        env:
          PKG_GPG_PRIVATE_KEY: ${{ secrets.PPVPN_PKG_GPG_PRIVATE_KEY }}
          PKG_GPG_PASSPHRASE: ${{ secrets.PPVPN_PKG_GPG_PASSPHRASE }}
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm gnupg jq
          PKG_GPG_FINGERPRINT=$(gpg --show-keys --with-colons desktop/apps/linux/packaging/ppvpn.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          [ -n "$PKG_GPG_FINGERPRINT" ] || { echo "no fingerprint in packaging/ppvpn.asc" >&2; exit 1; }
          export PKG_GPG_FINGERPRINT
          desktop/scripts/ci/sign-linux-rpms.sh release
      - name: The channel's published pointer
        id: current
        run: |
          set -eu
          if [ -z "$SITE_BASE" ]; then
            echo "the variable DESKTOP_SITE_BASE (the update site's https address) is not set" >&2
            exit 1
          fi
          # 200: compare against it. 404: the channel has no release yet.
          # Anything else is an error, not "no release".
          status=$(curl -sS -o current.json -w '%{http_code}' "${SITE_BASE%/}/desktop/channels/$CHANNEL.json")
          case "$status" in
            200) echo "args=--current current.json" >>"$GITHUB_OUTPUT" ;;
            404) echo "args=" >>"$GITHUB_OUTPUT" ;;
            *) echo "the update site answered $status for the channel pointer" >&2; exit 1 ;;
          esac
      - name: Check the release; generate its pointer and feeds
        env:
          CURRENT: ${{ steps.current.outputs.args }}
        run: |
          set -eu
          downgrade=""
          [ "$ALLOW_DOWNGRADE" != true ] || downgrade=--allow-downgrade
          # shellcheck disable=SC2086
          python3 desktop/scripts/ci/update_site.py build --assets release --tag "$TAG" --channel "$CHANNEL" \
            --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --site-base "$SITE_BASE" --out site $CURRENT $downgrade
      - name: SHA256SUMS
        run: cd release && sha256sum -- * >../SHA256SUMS && mv ../SHA256SUMS . && cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-preview
          path: site/
          if-no-files-found: error

  publish:
    # Attest that this workflow built the files, then publish them. A file
    # uploaded to the release by hand fails `gh attestation verify`.
    # A rehearsal attests nothing (the log of attestations is public) and
    # leaves a draft release, which has no tag and which only the
    # repository's members can see.
    needs: [prepare, approve, release-files]
    runs-on: ubuntu-latest
    environment: desktop-release-stable
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build_number }}
      REHEARSAL: ${{ inputs.rehearsal }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.rehearsal }}
        with:
          subject-path: release/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Releases are immutable: a tag is published once.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "the release $TAG already exists" >&2
            exit 1
          fi
          notes="PPVPN desktop $VERSION (build $BUILD), stable channel. Commit \`$GITHUB_SHA\`. Verify a file with \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/desktop-release.yml\`."
          if [ "$REHEARSAL" = true ]; then
            # A draft: no tag is created, and it is not public. To be deleted
            # after the rehearsal (gh release delete "$TAG").
            # No --target: naming a commit made the API refuse the workflow's
            # token (403), as it does for a tag on a commit that changes
            # workflow files; a draft makes no tag, so it needs none.
            url=$(gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
              --draft --latest=false --title "PPVPN desktop $VERSION (rehearsal, build $BUILD)" \
              --notes "Rehearsal of the release workflow at commit $GITHUB_SHA. Not a release. $notes")
            echo "Draft release (delete it after the rehearsal): $url" >>"$GITHUB_STEP_SUMMARY"
          else
            # On the tag it runs on. Never the repository's latest release.
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --latest=false --title "PPVPN desktop $VERSION" --notes "$notes"
          fi

  # The update site follows a stable release.
  site:
    if: inputs.channel == 'stable'
    needs: [prepare, approve, publish]
    uses: ./.github/workflows/desktop-pages.yml
    with:
      # This run was approved above.
      approved: true
      rehearsal: ${{ inputs.rehearsal }}
      tag: ${{ needs.prepare.outputs.tag }}
    # As for package: the called site job runs in the release environment
    # and reads its signing key only if the caller hands its secrets on
    # (the repository holds none itself; see package).
    secrets: inherit
    permissions:
      contents: read
      attestations: read
      pages: write
      id-token: write
