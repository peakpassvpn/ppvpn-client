name: desktop-package

# The desktop installers: Windows (NSIS), macOS (one DMG per architecture)
# and Linux (deb and rpm), each with its release metadata, uploaded as
# workflow artifacts. Builds only: nothing is published from here.
#
# - A pull request that touches the packaging (this workflow, the packaging
#   scripts and files) builds all three without any secret: unsigned on
#   Windows, ad-hoc signed on macOS, no update signature.
# - By hand, for a test build of any ref: as a pull request's, without
#   secrets, against the production backend.
# - Called by the release workflow with an environment: the jobs then run
#   in it and read the signing secrets and the backend address from it.
#
# None of these jobs is a required check, and none may share a name with
# one (rust.yml's `macos`): a required check is matched by job name.

on:
  pull_request:
    paths:
      - .github/workflows/desktop-package.yml
      - tools/release-features-check.sh
      - desktop/scripts/**
      - desktop/apps/*/scripts/**
      - desktop/apps/linux/packaging/**
      - desktop/apps/windows/installer/**
      - desktop/crates/ppvpn-client/scripts/**
      - desktop/vendor/**
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel recorded in release-meta (none = test build)
        type: choice
        options: [none, dev, stable]
        default: none
      version:
        description: x.y.z overriding the projects' version
        type: string
        required: false
      build_number:
        description: Build counter, 0-65535 (empty = run number)
        type: string
        required: false
  workflow_call:
    inputs:
      channel:
        description: dev or stable
        type: string
        required: true
      environment:
        description: >-
          Environment holding the signing secrets and the backend address;
          the jobs that use them run in it, under its branch rules and
          reviewers. Empty: no secret is read.
        type: string
        required: false
      version:
        description: x.y.z from the release tag
        type: string
        required: true
      build_number:
        description: Release-wide build counter shared by all platforms (0-65535)
        type: string
        required: true
    # Secrets of the environment above. A job reads them only when an
    # environment is given: never for a pull request or a run by hand.
    secrets:
      PPVPN_API_BASE:
        description: Backend base URL baked into the apps (default production). A secret, because inputs show on the run's page.
        required: false
      SPARKLE_PRIVATE_KEY:
        description: EdDSA (ed25519) private key of the update feeds (macOS and Windows)
        required: false
      MACOS_SIGNING_P12_BASE64:
        required: false
      MACOS_SIGNING_P12_PASSWORD:
        required: false
      WINDOWS_CERTIFICATE:
        description: Optional base64 PFX for Authenticode
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml's version; keep them in step.
  RUST_TOOLCHAIN: 1.98.1
  UNIFFI_BINDGEN_CS_TAG: v0.11.0+v0.31.0
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # 'none' (a test build) and pull requests record no channel.
  PPVPN_RELEASE_CHANNEL: ${{ inputs.channel != 'none' && inputs.channel || '' }}
  PPVPN_VERSION: ${{ inputs.version || '' }}
  PPVPN_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
  # The update site (feeds, apt/dnf repositories). A build for a channel
  # updates from <site>/desktop/<channel>/appcast-<platform>.xml (macOS,
  # Windows) and <site>/linux/<channel>/latest.json (Linux; builds without
  # a channel poll stable's); the macOS and Windows builds without a
  # channel have no feed.
  PPVPN_UPDATE_SITE: ${{ vars.DESKTOP_SITE_BASE }}
  # Public half of the update feeds' key; empty disables in-app updates.
  PPVPN_SPARKLE_PUBLIC_KEY: ${{ vars.PPVPN_SPARKLE_PUBLIC_KEY }}

jobs:
  package-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        run: |
          case "$PPVPN_RELEASE_CHANNEL" in ''|dev|stable) ;; *) echo "channel must be dev or stable" >&2; exit 2 ;; esac
          if [ -n "$PPVPN_VERSION" ] && ! [[ "$PPVPN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be x.y.z" >&2; exit 2
          fi
          if ! [[ "$PPVPN_BUILD_NUMBER" =~ ^[0-9]+$ ]] || [ "$PPVPN_BUILD_NUMBER" -gt 65535 ]; then
            echo "build number must be an integer between 0 and 65535" >&2; exit 2
          fi

  # deb and rpm, x86_64, everything native linked against glibc 2.35
  # (cargo-zigbuild). See desktop/apps/linux/scripts/build-package.sh.
  package-linux:
    needs: package-inputs
    runs-on: ubuntu-22.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    env:
      ZIG_VERSION: '0.13.0'
      NFPM_VERSION: '2.47.0'
      PPVPN_API_BASE: ${{ inputs.environment && secrets.PPVPN_API_BASE || 'https://www.peakpassvpn.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Install packaging tools
        run: |
          # NativeAOT (the push agent) links with clang against zlib.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
          curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-linux-x86_64-$ZIG_VERSION.tar.xz" | sudo tar -xJ -C /opt
          sudo ln -sf "/opt/zig-linux-x86_64-$ZIG_VERSION/zig" /usr/local/bin/zig
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          cargo install --locked cargo-zigbuild
          cargo install --locked --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG" uniffi-bindgen-cs
      - name: Fetch the vendored core
        run: desktop/scripts/fetch-vendored-core.sh linux-x86_64
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        run: |
          tools/release-features-check.sh -p ppvpn-client
          tools/release-features-check.sh --manifest-path desktop/service/Cargo.toml
      - name: Build packages
        run: desktop/apps/linux/scripts/build-package.sh
      # ppvpn-archive-keyring (deb) and ppvpn-release (rpm), which set the
      # package repository up on a user's machine.
      - name: Build repository setup packages
        run: desktop/apps/linux/scripts/build-repo-packages.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux
          if-no-files-found: error
          # A release run's packages are not kept long: a stable build's are in the
          # release, a dev build's are for testing. Other builds: the default.
          retention-days: ${{ inputs.environment && 3 || 0 }}
          path: |
            desktop/dist/linux/*.deb
            desktop/dist/linux/*.rpm
            desktop/dist/linux/release-meta-linux-*.json

  # Install and start the rpm under dnf (the deb is built, and so checked,
  # on Ubuntu 22.04).
  package-linux-smoke-rpm:
    needs: package-linux
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: desktop/apps/linux/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux
          path: dist
      - name: Install the x64 rpm
        run: |
          # The app only: ppvpn-release would enable the (production) repository.
          dnf install -y ./dist/PPVPN-*-linux-x64.rpm xorg-x11-server-Xvfb dbus-daemon
          rpm -q --scripts ppvpn
      - name: Start it once
        run: desktop/apps/linux/scripts/smoke-test.sh rpm
      - name: Remove it
        run: dnf remove -y ppvpn && test ! -e /usr/lib/ppvpn/ppvpn

  # The apt and dnf repositories the site serves, built from these packages
  # as from release assets and installed from with real apt and dnf. No
  # secret: a key made here signs them. The site and the release downloads
  # are served from the runner (desktop/scripts/ci/repo-selftest-server.py);
  # a download answers 302, as a GitHub Release's does, and the rpm is only
  # reachable that way.
  package-linux-repo:
    needs: package-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      REPO_PORT: '18080'
      REPO_URL: http://127.0.0.1:18080
      # build-linux-repo.sh refuses bases that are not https, except for this test.
      PKG_ALLOW_HTTP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            desktop/scripts/ci
            desktop/apps/linux/packaging
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux
          path: dist
      - name: Install repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gpgv jq
      - name: Make a throwaway signing key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/selftest-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          cat >"$GNUPGHOME/key.conf" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: PPVPN repository self-test
          Name-Email: selftest@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --quiet --generate-key "$GNUPGHOME/key.conf"
          fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')"
          [[ "$fingerprint" =~ ^[0-9A-F]{40}$ ]]
          gpg --batch --armor --export-secret-keys "$fingerprint" >"$GNUPGHOME/secret.asc"
          # Worth nothing, but every later step would print it with its environment.
          while IFS= read -r line; do
            if [ "${#line}" -ge 16 ] && [[ "$line" != -----* ]]; then echo "::add-mask::$line"; fi
          done <"$GNUPGHOME/secret.asc"
          {
            echo "PKG_GPG_FINGERPRINT=$fingerprint"
            echo "PKG_GPG_PRIVATE_KEY<<PPVPN_SELFTEST_KEY_END"
            cat "$GNUPGHOME/secret.asc"
            echo "PPVPN_SELFTEST_KEY_END"
          } >>"$GITHUB_ENV"
          gpgconf --kill all
          rm -rf "$GNUPGHOME"
      - name: Lay the packages out as releases and sign the rpms
        run: |
          T="$RUNNER_TEMP/linux-repo"
          deb_meta=dist/release-meta-linux-x64-deb.json
          rpm_meta=dist/release-meta-linux-x64-rpm.json
          version="$(jq -er .version "$deb_meta")"
          build="$(jq -er .build "$deb_meta")"
          stable_tag="desktop-v$version"
          dev_tag="desktop-v$version-dev.${build##*.}"
          stable="$T/releases/stable/$stable_tag"
          dev="$T/releases/dev/$dev_tag"
          mkdir -p "$stable" "$T/releases/dev" "$T/assets" "$T/site/desktop"
          cp dist/*.deb dist/*.rpm dist/release-meta-linux-*.json "$stable/"
          # A pull request's build records no channel, and a release's records
          # its own: in this copy only, the packages are called a stable
          # release, and below a dev one.
          channel() {
            for meta in "$2"/release-meta-linux-x64-deb.json "$2"/release-meta-linux-x64-rpm.json; do
              jq --arg channel "$1" '.channel = $channel' "$meta" >"$meta.part"
              mv "$meta.part" "$meta"
            done
          }
          channel stable "$stable"

          rpm_file="$(jq -er .file "$rpm_meta")"
          unsigned="$(sha256sum "$stable/$rpm_file" | cut -d' ' -f1)"
          desktop/scripts/ci/sign-linux-rpms.sh "$stable"
          signed="$(sha256sum "$stable/$rpm_file" | cut -d' ' -f1)"
          test "$signed" != "$unsigned"
          test "$(jq -er .sha256 "$stable/release-meta-linux-x64-rpm.json")" = "$signed"
          test "$(jq -er .length "$stable/release-meta-linux-x64-rpm.json")" = "$(wc -c <"$stable/$rpm_file" | tr -d ' ')"
          test "$(jq -er .channel "$stable/release-meta-linux-x64-rpm.json")" = stable
          # A second run leaves a signed release as it is.
          desktop/scripts/ci/sign-linux-rpms.sh "$stable"
          test "$(sha256sum "$stable/$rpm_file" | cut -d' ' -f1)" = "$signed"
          # Another key is refused an rpm that is already signed, and leaves it as it is.
          (
            export GNUPGHOME="$RUNNER_TEMP/other-gnupg"
            mkdir -m 700 "$GNUPGHOME"
            gpg --batch --quiet --passphrase '' --quick-generate-key \
              'PPVPN repository self-test (another key) <other@example.com>' rsa2048 sign never
            other="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')"
            PKG_GPG_PRIVATE_KEY="$(gpg --batch --armor --export-secret-keys "$other")"
            gpgconf --kill all
            rm -rf "$GNUPGHOME"
            unset GNUPGHOME
            export PKG_GPG_PRIVATE_KEY PKG_GPG_FINGERPRINT="$other"
            if desktop/scripts/ci/sign-linux-rpms.sh "$stable" 2>"$T/refusal"; then
              echo "an rpm signed by another key was signed again" >&2; exit 1
            fi
            cat "$T/refusal"
            grep -q 'already signed by another key' "$T/refusal"
          )
          test "$(sha256sum "$stable/$rpm_file" | cut -d' ' -f1)" = "$signed"

          # The same packages as a dev release.
          cp -R "$stable" "$dev"
          channel dev "$dev"
          ln -s "$stable" "$T/assets/$stable_tag"
          ln -s "$dev" "$T/assets/$dev_tag"
          # Another part of the site, which the repositories' build must leave alone.
          echo other >"$T/site/desktop/other"
          {
            echo "T=$T"
            echo "STABLE_TAG=$stable_tag"
            echo "DEV_TAG=$dev_tag"
            echo "RPM_FILE=$rpm_file"
          } >>"$GITHUB_ENV"
      - name: Build both channels into one site
        run: |
          build() {   # channel, releases, out
            desktop/scripts/ci/build-linux-repo.sh --channel "$1" --releases "$2" \
              --download-base "$REPO_URL/download" --site-base "$REPO_URL" --out "$3" --keep 5
          }
          # Refusals write nothing: an http base without the test switch, and
          # releases of another channel.
          if env -u PKG_ALLOW_HTTP desktop/scripts/ci/build-linux-repo.sh --channel stable \
               --releases "$T/releases/stable" --download-base "$REPO_URL/download" \
               --site-base "$REPO_URL" --out "$T/refused"; then
            echo "an http base was accepted" >&2; exit 1
          fi
          if build dev "$T/releases/stable" "$T/refused"; then
            echo "stable releases were accepted as dev" >&2; exit 1
          fi
          test ! -e "$T/refused"

          stable_files() {
            (cd "$T/site" && find linux/apt/dists/stable linux/apt/pool linux/rpm/stable linux/stable \
              -type f -exec sha256sum {} + | sort -k2)
          }
          build stable "$T/releases/stable" "$T/site"
          stable_files >"$T/stable.before"
          test -s "$T/stable.before"
          build dev "$T/releases/dev" "$T/site"
          stable_files >"$T/stable.after"
          diff -u "$T/stable.before" "$T/stable.after"

          cd "$T/site"
          test "$(cat desktop/other)" = other
          deb="$(ls linux/apt/pool/main/p/ppvpn/)"
          test "$(echo "$deb" | wc -l)" = 1    # the two channels share one pool file
          for channel in stable dev; do
            for file in InRelease Release Release.gpg main/binary-amd64/Packages \
                        main/binary-amd64/Packages.gz main/binary-amd64/Packages.xz; do
              test -s "linux/apt/dists/$channel/$file"
            done
            test -d "linux/apt/dists/$channel/main/binary-amd64/by-hash/SHA256"
            test -d "linux/apt/dists/$channel/main/binary-amd64/by-hash/SHA512"
            grep -qxF "Filename: pool/main/p/ppvpn/$deb" "linux/apt/dists/$channel/main/binary-amd64/Packages"
            test -s "linux/rpm/$channel/x86_64/repodata/repomd.xml"
            test -s "linux/rpm/$channel/x86_64/repodata/repomd.xml.asc"
            test -z "$(find "linux/rpm/$channel" -name '*.rpm')"    # referenced, not hosted
            jq -e --arg channel "$channel" '.schema == 1 and .channel == $channel' "linux/$channel/latest.json"
          done
          for file in ppvpn.asc ppvpn-archive-keyring.deb ppvpn-archive-keyring.deb.asc \
                      ppvpn-release.rpm ppvpn-release.rpm.asc; do
            test -s "linux/$file"
          done
          test "$(ls linux/setup | wc -l)" = 4
          cat linux/stable/latest.json
          jq -e --arg build "$(jq -er .build "$GITHUB_WORKSPACE/dist/release-meta-linux-x64-deb.json")" \
            --arg deb_url "$REPO_URL/linux/apt/pool/main/p/ppvpn/$deb" \
            --arg deb_sha "$(sha256sum "linux/apt/pool/main/p/ppvpn/$deb" | cut -d' ' -f1)" \
            --arg rpm_url "$REPO_URL/download/$STABLE_TAG/$RPM_FILE" \
            --arg rpm_sha "$(sha256sum "$T/releases/stable/$STABLE_TAG/$RPM_FILE" | cut -d' ' -f1)" \
            --argjson rpm_size "$(wc -c <"$T/releases/stable/$STABLE_TAG/$RPM_FILE" | tr -d ' ')" \
            '.build == $build and .deb.url == $deb_url and .deb.sha256 == $deb_sha
              and .rpm.file == env.RPM_FILE and .rpm.url == $rpm_url and .rpm.sha256 == $rpm_sha
              and .rpm.size == $rpm_size' linux/stable/latest.json
          jq -e --arg rpm_url "$REPO_URL/download/$DEV_TAG/$RPM_FILE" '.rpm.url == $rpm_url' linux/dev/latest.json
      # What a release does: the production key has a passphrase, handed to
      # gpg and to rpmsign through a loopback pinentry. A second key made
      # here, with a random passphrase, signs a fresh copy of the unsigned
      # packages and a site of its own. Without the passphrase, or with a
      # wrong one, the scripts must refuse before touching anything, and at
      # once: a script that waited to be given one would hang a release.
      - name: Sign and build with a passphrase-protected key
        run: |
          P="$T/passphrase"
          release="$P/releases/$STABLE_TAG"
          mkdir -p "$release"
          # dist/ still holds the packages as built: unsigned.
          cp dist/*.deb dist/*.rpm dist/release-meta-linux-*.json "$release/"
          for meta in "$release"/release-meta-linux-x64-deb.json "$release"/release-meta-linux-x64-rpm.json; do
            jq '.channel = "stable"' "$meta" >"$meta.part"
            mv "$meta.part" "$meta"
          done
          rpm_meta="$release/release-meta-linux-x64-rpm.json"
          digest() { sha256sum "$1" | cut -d' ' -f1; }
          unsigned="$(digest "$release/$RPM_FILE")"
          test "$unsigned" = "$(jq -er .sha256 dist/release-meta-linux-x64-rpm.json)"

          passphrase="$(openssl rand -hex 24)"
          echo "::add-mask::$passphrase"
          wrong="$(openssl rand -hex 24)"
          echo "::add-mask::$wrong"
          test "${#passphrase}" = 48
          test "$passphrase" != "$wrong"

          export GNUPGHOME="$RUNNER_TEMP/passphrase-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$passphrase" >"$GNUPGHOME/passphrase"
          cat >"$GNUPGHOME/key.conf" <<EOF
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: PPVPN repository passphrase self-test
          Name-Email: passphrase@example.com
          Expire-Date: 0
          Passphrase: $passphrase
          %commit
          EOF
          gpg --batch --quiet --generate-key "$GNUPGHOME/key.conf"
          fingerprints="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10}')"
          fingerprint="$(head -n 1 <<<"$fingerprints")"
          [[ "$fingerprint" =~ ^[0-9A-F]{40}$ ]]
          test "$fingerprint" != "$PKG_GPG_FINGERPRINT"
          # Kept in this step's shell only: never in the environment file, so never printed.
          key="$(gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
            --armor --export-secret-keys "$fingerprint")"
          [[ "$key" == *"PRIVATE KEY BLOCK"* ]]
          gpg --batch --armor --export "$fingerprint" >"$P/key.asc"
          gpg --batch --export "$fingerprint" >"$P/keyring.gpg"
          test -s "$P/key.asc"
          test -s "$P/keyring.gpg"
          gpgconf --kill all
          rm -rf "$GNUPGHOME"
          unset GNUPGHOME

          with_key() {   # passphrase, command...
            PKG_GPG_PRIVATE_KEY="$key" PKG_GPG_FINGERPRINT="$fingerprint" PKG_GPG_PASSPHRASE="$1" "${@:2}"
          }
          build() {   # passphrase, out
            with_key "$1" desktop/scripts/ci/build-linux-repo.sh --channel stable --releases "$P/releases" \
              --download-base "$REPO_URL/download" --site-base "$REPO_URL" --out "$2"
          }

          # A refusal: not a success, not the timeout (124, or 137 once killed), and
          # the script's own message about the passphrase.
          refused() {   # exit status, what the message says about the passphrase
            cat "$P/refusal" >&2
            case "$1" in
              0|124|137) echo "expected a prompt refusal, got exit status $1" >&2; exit 1 ;;
            esac
            if ! grep -q "the signing key cannot be used: PKG_GPG_PASSPHRASE is $2" "$P/refusal"; then
              echo "the refusal does not say the passphrase is $2" >&2; exit 1
            fi
          }
          as_built() {
            test "$(digest "$release/$RPM_FILE")" = "$unsigned"
            test "$(jq -er .sha256 "$rpm_meta")" = "$unsigned"
            test "$(jq -er .length "$rpm_meta")" = "$(jq -er .length dist/release-meta-linux-x64-rpm.json)"
          }

          # No passphrase, unset and then empty: nothing is signed, the rpm and its
          # metadata stay as built.
          status=0
          PKG_GPG_PRIVATE_KEY="$key" PKG_GPG_FINGERPRINT="$fingerprint" timeout -k 5 60 \
            env -u PKG_GPG_PASSPHRASE desktop/scripts/ci/sign-linux-rpms.sh "$release" 2>"$P/refusal" || status=$?
          refused "$status" missing
          as_built
          status=0
          PKG_GPG_PRIVATE_KEY="$key" PKG_GPG_FINGERPRINT="$fingerprint" PKG_GPG_PASSPHRASE='' timeout -k 5 60 \
            desktop/scripts/ci/sign-linux-rpms.sh "$release" 2>"$P/refusal" || status=$?
          refused "$status" missing
          as_built

          # The wrong passphrase: the same.
          status=0
          with_key "$wrong" timeout -k 5 60 desktop/scripts/ci/sign-linux-rpms.sh "$release" 2>"$P/refusal" || status=$?
          refused "$status" wrong
          as_built

          # The right one: signed, verifiable with the key's public half, metadata rewritten.
          with_key "$passphrase" desktop/scripts/ci/sign-linux-rpms.sh "$release"
          signed="$(digest "$release/$RPM_FILE")"
          test "$signed" != "$unsigned"
          test "$(jq -er .sha256 "$rpm_meta")" = "$signed"
          test "$(jq -er .length "$rpm_meta")" = "$(wc -c <"$release/$RPM_FILE" | tr -d ' ')"
          mkdir "$P/rpmdb"
          rpm --dbpath "$P/rpmdb" --import "$P/key.asc"
          for rpm in "$release/$RPM_FILE" "$release"/ppvpn-release-*.noarch.rpm; do
            verdict="$(rpm --dbpath "$P/rpmdb" -K "$rpm")"
            echo "$verdict"
            grep -q 'digests signatures OK' <<<"$verdict"
          done

          # The repositories: no passphrase, or the wrong one, leaves no output directory.
          status=0
          PKG_GPG_PRIVATE_KEY="$key" PKG_GPG_FINGERPRINT="$fingerprint" timeout -k 5 60 \
            env -u PKG_GPG_PASSPHRASE desktop/scripts/ci/build-linux-repo.sh --channel stable \
            --releases "$P/releases" --download-base "$REPO_URL/download" --site-base "$REPO_URL" \
            --out "$P/refused" 2>"$P/refusal" || status=$?
          refused "$status" missing
          test ! -e "$P/refused"
          status=0
          build "$wrong" "$P/refused" 2>"$P/refusal" || status=$?
          refused "$status" wrong
          test ! -e "$P/refused"
          build "$passphrase" "$P/site"
          dist_dir="$P/site/linux/apt/dists/stable"
          repodata="$P/site/linux/rpm/stable/x86_64/repodata"
          gpgv --keyring "$P/keyring.gpg" "$dist_dir/InRelease"
          gpgv --keyring "$P/keyring.gpg" "$dist_dir/Release.gpg" "$dist_dir/Release"
          gpgv --keyring "$P/keyring.gpg" "$repodata/repomd.xml.asc" "$repodata/repomd.xml"
          published="$(gpg --batch --show-keys --with-colons "$P/site/linux/ppvpn.asc" | awk -F: '$1=="fpr"{print $10}')"
          test "$(head -n 1 <<<"$published")" = "$fingerprint"
          jq -e --arg sha "$signed" '.rpm.sha256 == $sha' "$P/site/linux/stable/latest.json"
      - name: Serve the site and the downloads
        run: |
          nohup python3 desktop/scripts/ci/repo-selftest-server.py --port "$REPO_PORT" \
            --site "$T/site" --assets "$T/assets" >"$T/server.out" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$REPO_URL/linux/ppvpn.asc"; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null "$REPO_URL/linux/ppvpn.asc"
          # A download is a redirect, and the signed rpm is at its end.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$REPO_URL/download/$STABLE_TAG/$RPM_FILE")" = 302
          test "$(curl -fsSL "$REPO_URL/download/$STABLE_TAG/$RPM_FILE" | sha256sum | cut -d' ' -f1)" \
            = "$(jq -er .sha256 "$T/releases/stable/$STABLE_TAG/release-meta-linux-x64-rpm.json")"
          # packaging/ppvpn.list and ppvpn.repo, as the setup packages install
          # them, with the site's address replaced by this server's.
          sed "s#https://pkg.peakpassvpn.com#$REPO_URL#g" desktop/apps/linux/packaging/ppvpn.list >"$T/ppvpn.list"
          sed "s#https://pkg.peakpassvpn.com#$REPO_URL#g" desktop/apps/linux/packaging/ppvpn.repo >"$T/ppvpn.repo"
          grep -qxF "deb [signed-by=/usr/share/keyrings/ppvpn-archive-keyring.gpg] $REPO_URL/linux/apt stable main" "$T/ppvpn.list"
          grep -qxF "baseurl=$REPO_URL/linux/rpm/stable/\$basearch" "$T/ppvpn.repo"
          grep -qx 'gpgcheck=1' "$T/ppvpn.repo"
          grep -qx 'repo_gpgcheck=1' "$T/ppvpn.repo"
          gpg --batch --dearmor <"$T/site/linux/ppvpn.asc" >"$T/ppvpn-archive-keyring.gpg"
          chmod 644 "$T/ppvpn-archive-keyring.gpg" "$T/ppvpn.list" "$T/ppvpn.repo" "$T/site/linux/ppvpn.asc"
      - name: Install with apt (Ubuntu 22.04)
        run: |
          deb="$(ls "$T/site/linux/apt/pool/main/p/ppvpn/"*.deb)"
          expected="$(dpkg-deb -f "$deb" Version)"
          seen="$(wc -l <"$T/server.out")"
          docker run --rm --network host \
            -v "$T/ppvpn-archive-keyring.gpg:/usr/share/keyrings/ppvpn-archive-keyring.gpg:ro" \
            -v "$T/ppvpn.list:/etc/apt/sources.list.d/ppvpn.list:ro" \
            -e DEBIAN_FRONTEND=noninteractive -e EXPECTED="$expected" \
            ubuntu:22.04 bash -euxc '
              apt-get update
              apt-cache policy ppvpn
              apt-get install -y --no-install-recommends ppvpn
              test "$(dpkg-query -W -f "\${Version}" ppvpn)" = "$EXPECTED"
              test -x /usr/lib/ppvpn/ppvpn
            '
          # What apt asked this server for.
          tail -n "+$((seen + 1))" "$T/server.out" >"$T/apt.requests"
          grep -E '"GET /linux/apt/dists/stable/InRelease HTTP/[0-9.]+" 200 ' "$T/apt.requests"
          grep -E '"GET /linux/apt/pool/main/p/ppvpn/[^ ]+\.deb HTTP/[0-9.]+" 200 ' "$T/apt.requests"
      - name: Install with dnf (Fedora)
        run: |
          rpm="$T/releases/stable/$STABLE_TAG/$RPM_FILE"
          expected="$(rpm -qp --nosignature --qf '%{VERSION}-%{RELEASE}' "$rpm")"
          test "${expected%%-*}" = "$(jq -er .version dist/release-meta-linux-x64-rpm.json)"
          seen="$(wc -l <"$T/server.out")"
          docker run --rm --network host \
            -v "$T/site/linux/ppvpn.asc:/etc/pki/rpm-gpg/RPM-GPG-KEY-ppvpn:ro" \
            -v "$T/ppvpn.repo:/etc/yum.repos.d/ppvpn.repo:ro" \
            -e EXPECTED="$expected" \
            fedora:latest bash -euxc '
              rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-ppvpn
              dnf -y --repo ppvpn makecache
              dnf install -y ppvpn
              test "$(rpm -q --qf "%{VERSION}-%{RELEASE}" ppvpn)" = "$EXPECTED"
              test -x /usr/lib/ppvpn/ppvpn
            '
          # dnf fetched the rpm where the metadata's xml:base sent it, through the redirect.
          tail -n "+$((seen + 1))" "$T/server.out" >"$T/dnf.requests"
          grep -E '"GET /linux/rpm/stable/x86_64/repodata/repomd\.xml\.asc HTTP/[0-9.]+" 200 ' "$T/dnf.requests"
          grep -E "\"GET /download/$STABLE_TAG/[^ ]+\.rpm HTTP/[0-9.]+\" 302 " "$T/dnf.requests"
          grep -E "\"GET /assets/$STABLE_TAG/[^ ]+\.rpm HTTP/[0-9.]+\" 200 " "$T/dnf.requests"
      - name: Requests served
        if: always()
        run: cat "$RUNNER_TEMP/linux-repo/server.out" 2>/dev/null || true

  # The NSIS installer. See desktop/apps/windows/README.md ("Packaging").
  package-windows:
    needs: package-inputs
    runs-on: windows-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 90
    env:
      PPVPN_API_BASE: ${{ inputs.environment && secrets.PPVPN_API_BASE || 'https://www.peakpassvpn.com' }}
      SPARKLE_PRIVATE_KEY: ${{ inputs.environment && secrets.SPARKLE_PRIVATE_KEY || '' }}
      # Optional Authenticode through desktop/scripts/sign-windows.ps1; off
      # unless these are configured.
      WINDOWS_CERTIFICATE: ${{ inputs.environment && secrets.WINDOWS_CERTIFICATE || '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.environment && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      PPVPN_WINDOWS_PUBLISHER_SHA256: ${{ vars.PPVPN_WINDOWS_PUBLISHER_SHA256 }}
      PPVPN_WINDOWS_NEXT_PUBLISHER_SHA256: ${{ vars.PPVPN_WINDOWS_NEXT_PUBLISHER_SHA256 }}
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Ensure NSIS
        shell: powershell
        run: |
          $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed" }
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          & $makensis /VERSION
      - name: Cache uniffi-bindgen-cs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}
      # build-dotnet.ps1 refuses any other version of the generator.
      - name: Install uniffi-bindgen-cs
        shell: bash
        run: |
          if ! uniffi-bindgen-cs --version 2>/dev/null | grep -qF "${UNIFFI_BINDGEN_CS_TAG#v}"; then
            cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG" uniffi-bindgen-cs --force
          fi
      - name: Fetch the vendored core
        shell: bash
        run: desktop/scripts/fetch-vendored-core.sh windows-x86_64
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        shell: bash
        run: |
          tools/release-features-check.sh -p ppvpn-client
          tools/release-features-check.sh --manifest-path desktop/service/Cargo.toml
      - name: Build installer and release metadata
        shell: powershell
        run: desktop/apps/windows/scripts/ci-build.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-x64
          if-no-files-found: error
          # A release run's packages are not kept long: a stable build's are in the
          # release, a dev build's are for testing. Other builds: the default.
          retention-days: ${{ inputs.environment && 3 || 0 }}
          path: |
            desktop/dist/windows/*-setup.exe
            desktop/dist/windows/release-meta-windows-x64.json

  # Both DMGs, built on an Apple silicon runner. See
  # desktop/scripts/ci/build-macos-native.sh.
  package-macos:
    needs: package-inputs
    runs-on: macos-15
    environment: ${{ inputs.environment }}
    timeout-minutes: 90
    env:
      CI_PROJECT_DIR: ${{ github.workspace }}/desktop
      MACOS_ARCHS: arm64 x86_64
      PPVPN_API_BASE_DEFAULT: ${{ inputs.environment && secrets.PPVPN_API_BASE || 'https://www.peakpassvpn.com' }}
      SPARKLE_PRIVATE_KEY: ${{ inputs.environment && secrets.SPARKLE_PRIVATE_KEY || '' }}
      # The release signing certificate; without it the build is ad-hoc signed.
      MACOS_SIGNING_P12_BASE64: ${{ inputs.environment && secrets.MACOS_SIGNING_P12_BASE64 || '' }}
      MACOS_SIGNING_P12_PASSWORD: ${{ inputs.environment && secrets.MACOS_SIGNING_P12_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the vendored core
        run: desktop/scripts/fetch-vendored-core.sh macos-cli-arm64 macos-cli-x86_64
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        run: |
          tools/release-features-check.sh -p ppvpn-client
          tools/release-features-check.sh --manifest-path desktop/service/Cargo.toml
      - name: Build DMGs and release metadata
        run: bash desktop/scripts/ci/build-macos-native.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos
          if-no-files-found: error
          # A release run's packages are not kept long: a stable build's are in the
          # release, a dev build's are for testing. Other builds: the default.
          retention-days: ${{ inputs.environment && 3 || 0 }}
          path: desktop/staging/macos-native
