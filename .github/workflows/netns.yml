name: netns

# Tests that need a real TUN, each in a network namespace of its own on the
# runner (test/netns/run.sh), with a check that the runner's own routes,
# rules, links, nftables and DNS are as they were afterwards (gates G3 and
# G7 of #214). Engine-independent by design: the same scripts run the Go
# core's tests, the Rust crate's (run.sh --libtest), and the Rust engine
# through ppvpn-core-lab (network-change-rust). No internet:
# documentation addresses and local fake nodes only.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push cancels its older run; other runs (main's
# pushes, the schedule) each get a group of their own, so none is
# cancelled, pending or running.
concurrency:
  group: netns-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tun:
    runs-on: ubuntu-latest
    # The Rust test binary builds sail and BoringSSL from source until this
    # job's cache (saved from main) has them.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Runner
        run: |
          uname -r; ls -l /dev/net/tun
          ip -V; nft --version || true
          systemctl is-active systemd-resolved || true
          sudo -n true && echo "passwordless sudo"
      - name: Build the test binary (as the runner user)
        # With the desktop tags: the TUN's default stack (mixed) needs gVisor.
        run: go test -c -tags "$(make -s print-desktop-tags)" -o "$RUNNER_TEMP/runtime.test" ./internal/runtime
      - name: Leftover check catches a change to the host
        run: |
          # A fake test that adds a rule in the host's namespace: run.sh must fail.
          printf '#!/bin/sh\nnsenter -t 1 -n ip rule add priority 31999 lookup main\necho "--- PASS: TestLeak"\n' > "$RUNNER_TEMP/leak.test"
          chmod +x "$RUNNER_TEMP/leak.test"
          if sudo test/netns/run.sh "$RUNNER_TEMP/leak.test"; then
            echo "run.sh did not notice the host change" >&2; sudo ip rule del priority 31999 || true; exit 1
          fi
          sudo ip rule del priority 31999
      - name: TUN rules are put back after deletion
        run: sudo NETNS_TIMEOUT=240 test/netns/run.sh "$RUNNER_TEMP/runtime.test" -test.run 'TestTUNRulesRestoredAfterDeletion' -test.timeout 230s
      - name: TUN rules broken is reported (restoring off)
        run: sudo NETNS_TIMEOUT=240 NETNS_ENV=PPVPN_TEST_TUN_RULES_NO_RESTORE=1 test/netns/run.sh "$RUNNER_TEMP/runtime.test" -test.run 'TestTUNRulesBrokenIsReported' -test.timeout 230s
      # The Rust crate's guard (crates/ppvpn-core/src/tunrules) against a
      # real sail TUN: the same two cases, restoring off in-process.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Rust test binary (as the runner user)
        run: |
          set -euo pipefail
          bin=$(cargo test -p ppvpn-core --lib --no-run --locked --features fault-injection --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "ppvpn_core") | .executable')
          test -x "$bin"
          cp "$bin" "$RUNNER_TEMP/ppvpn_core.test"
      - name: TUN rules put back and broken reported (Rust)
        run: sudo NETNS_TIMEOUT=240 test/netns/run.sh --libtest "$RUNNER_TEMP/ppvpn_core.test" 'tunrules::linux_tests::'
      # sail's route.default_interface changed by a reload: new direct
      # connections leave by the new link, one already open stays on its own
      # (a second veth to ppvpn-w, the link told by its sent bytes).
      # With the test build's fault-injection: an instance that fails,
      # a start that fails once routed and a teardown step that panics
      # leave the namespace as it was (the step reported with its kind and
      # the command that clears it).
      # Five runs, each in fresh namespaces: the failure tests compare the
      # namespace before and after, and a run takes seconds, so a timing
      # flake shows here rather than in someone else's pull request.
      - name: the runtime's reload and failures (Rust)
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::run $i"
            sudo NETNS_TIMEOUT=120 test/netns/run.sh --libtest "$RUNNER_TEMP/ppvpn_core.test" 'runtime::netns_tests::'
            echo "::endgroup::"
          done

  network-change:
    # dns-local and the host-IPv6 re-probe across network changes (#61, #69):
    # scripts that build namespaces of their own, run through run.sh --host
    # for the timeout and the host check.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the lab core and helper (as the runner user)
        run: |
          GOARCH=amd64 make build-lab-linux
          go build -o "$RUNNER_TEMP/ldnslab" ./test/lab/localdns/ldnslab
          command -v tcpdump || { sudo apt-get update -qq && sudo apt-get install -y -qq tcpdump; }
      - name: dns-local follows network changes (#61)
        # SWITCH_GRACE_MS: Go 0.5.21's dns-local follows the kernel's own
        # interface monitor, which lags the logged change by seconds while
        # network events keep coming (#214, docs/rust-parity.md): mostly tens
        # of ms on runners, at times 1-3 s, once 6183 ms (a 6 s grace failed
        # on an unrelated PR), hence 10 s. With a grace
        # the reported change itself may take up to 10 s too (the front's
        # monitor is held back the same way); the Rust core must pass with 0:
        # the change reported within 2 s, the first query after it on the new
        # network.
        run: sudo NETNS_TIMEOUT=180 NETNS_ENV=SWITCH_GRACE_MS=10000 test/netns/run.sh --host test/lab/localdns/run.sh build/ppvpn-core-lab-linux "$RUNNER_TEMP/ldnslab" testdata/profiles/multi-ingress.json "$RUNNER_TEMP/localdns"
      - name: link down/up, no kernel switch while offline (#69), modes 0-4
        # SWITCH_GRACE_MS: the Go baseline's limits (recovery within 15 s, not
        # 2.5 s: Go 0.5.21 started offline once took 11 s to see the link,
        # updown.sh); the Rust core keeps the strict ones.
        run: |
          status=0
          for mode in 0 1 2 3 4; do
            echo "::group::mode $mode"
            sudo NETNS_TIMEOUT=90 NETNS_ENV=SWITCH_GRACE_MS=6000 test/netns/run.sh --host test/lab/localdns/updown.sh build/ppvpn-core-lab-linux "$RUNNER_TEMP/ldnslab" testdata/profiles/multi-ingress.json $mode "$RUNNER_TEMP/updown-$mode" || status=1
            echo "::endgroup::"
          done
          exit $status

  network-change-rust:
    # The same scripts on the Rust engine (ppvpn-core-lab), strictly:
    # SWITCH_GRACE_MS=0, the change reported within 2 s and the first query
    # after it on the new network (docs/rust-parity.md, "Go 0.5.21 的已知
    # 滞后"). Resolvers come from the namespace's resolv.conf (no test
    # source), interface changes and kernel switches from watch-events.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The version is rust-toolchain.toml's; keep it in step with rust.yml.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build ppvpn-core-lab and the helper (as the runner user)
        run: |
          cargo build -p ppvpn-core-lab --locked
          go build -o "$RUNNER_TEMP/ldnslab" ./test/lab/localdns/ldnslab
          command -v tcpdump || { sudo apt-get update -qq && sudo apt-get install -y -qq tcpdump; }
      - name: dns-local follows network changes (#61), strict
        run: sudo NETNS_TIMEOUT=180 NETNS_ENV="CORE_ENGINE=rust SWITCH_GRACE_MS=0" test/netns/run.sh --host test/lab/localdns/run.sh target/debug/ppvpn-core-lab "$RUNNER_TEMP/ldnslab" testdata/profiles/multi-ingress.json "$RUNNER_TEMP/localdns"
      - name: link down/up, no kernel switch while offline (#69), modes 0-4
        run: |
          status=0
          for mode in 0 1 2 3 4; do
            echo "::group::mode $mode"
            sudo NETNS_TIMEOUT=90 NETNS_ENV="CORE_ENGINE=rust" test/netns/run.sh --host test/lab/localdns/updown.sh target/debug/ppvpn-core-lab "$RUNNER_TEMP/ldnslab" testdata/profiles/multi-ingress.json $mode "$RUNNER_TEMP/updown-$mode" || status=1
            echo "::endgroup::"
          done
          exit $status
