name: Sensitive check

# Every push and pull request: the whole tree, then the commits it adds
# (lines, file paths, messages, authors), with the generic rules only: the
# local patterns file never exists here. Findings print as path:line.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  sensitive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tree
        run: tools/sensitive-check.sh tree
      - name: Added commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE head=$PR_HEAD
          else
            base=$PUSH_BEFORE head=$PUSH_AFTER
            # A new branch has no "before": check what it adds over main.
            if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git merge-base origin/main "$head")
            fi
          fi
          if [ "$(git rev-parse "$base")" = "$(git rev-parse "$head")" ]; then
            echo "sensitive-check: no new commits"
            exit 0
          fi
          tools/sensitive-check.sh range "$base" "$head"
