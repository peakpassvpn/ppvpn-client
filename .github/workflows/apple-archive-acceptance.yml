name: AB actual native contracts
run-name: cf2 actual Rust C ABI Swift A8 and history B; accepted C reused
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-ab-native-cf2
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Authenticate exact three source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/apple/preload_abc.py
      - name: Select existing managed Xcode and record resources
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version > "$RUNNER_TEMP/abc-output/xcode.original.txt"
          sysctl hw.ncpu hw.memsize > "$RUNNER_TEMP/abc-output/resources.original.txt"
          swiftc --version > "$RUNNER_TEMP/abc-output/swift.original.txt" 2>&1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        continue-on-error: true
        timeout-minutes: 5
        with:
          prefix-key: v1-rust
          shared-key: macos
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          lockfile: ${{ env.ABC_SOURCE }}/Cargo.lock
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - name: Exact failed A and B native commands
        run: python3 tools/apple/run_abc.py
      - name: Preserve complete available original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ab-cf2-native-originals
          path: |
            ${{ runner.temp }}/abc-output
            !${{ runner.temp }}/abc-output/A/*/cargo-target/**
            !${{ runner.temp }}/abc-output/A/*/repo/**
            !${{ runner.temp }}/abc-output/A/*/swift-modules/**
            !${{ runner.temp }}/abc-output/B/modules/**
            !${{ runner.temp }}/abc-output/C/modules/**
            !${{ runner.temp }}/abc-output/C/ios-modules/**
          if-no-files-found: warn
          retention-days: 7
