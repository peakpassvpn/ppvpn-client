name: PacketBridge actual native comparison
run-name: F997 old and bounded-batch real Tokio bridge and SingleShard UDP
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: packetbridge-native-f997
  cancel-in-progress: false
jobs:
  build:
    name: Compile exact old and new native test binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_sha256: ${{ steps.artifact.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
    steps:
      - name: Start bounded job budget
        run: |
          python3 - <<'PYCODE'
          import os,time
          assert len(os.sched_getaffinity(0))>=4
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PERF_JOB_START_MONOTONIC='+str(time.monotonic())+'\n')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: peakpassvpn/sail
          ref: f99761138b23f267ebc7621057afe02018ab7c18
          path: sail-source
          persist-credentials: false
      - name: Verify unchanged proven resource infrastructure and frozen bridge inputs
        run: python3 tools/perf/packetbridge/verify.py
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        continue-on-error: true
        timeout-minutes: 5
        with:
          prefix-key: v1-rust
          shared-key: f997-linux-cli
          workspaces: sail-source -> target
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          lockfile: sail-source/Cargo.lock
          targets: x86_64-unknown-linux-gnu
      - name: Actual two-arm build under original bounded Lease
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB,PATH,GOCACHE,GOMODCACHE,GOTMPDIR,GOBIN,CARGO_HOME,RUSTUP_HOME,BORING_BSSL_PATH_x86_64_unknown_linux_gnu,BORING_BSSL_INCLUDE_PATH_x86_64_unknown_linux_gnu,BORING_BSSL_ASSUME_PATCHED_x86_64_unknown_linux_gnu env PATH="$PATH" python3 tools/perf/packetbridge/manager.py build --source "$GITHUB_WORKSPACE/sail-source" --output "$RUNNER_TEMP/packetbridge-build-output" --resource "$RUNNER_TEMP/f997-build-resource" --job-start "$PERF_JOB_START_MONOTONIC"
      - name: Independent fresh cleanup recheck
        if: always()
        run: |
          sudo python3 tools/perf/f997-baseline/cleanup_stage.py --temp-root "$RUNNER_TEMP" --state-root "$RUNNER_TEMP/f997-build-resource" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Collect only owned original build resource evidence
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/f997-build-resource"; then
            sudo python3 tools/perf/f997-baseline/collect_owned.py --temp-root "$RUNNER_TEMP" --source-root "$RUNNER_TEMP/f997-build-resource" --destination-root "$RUNNER_TEMP/f997-collected-build" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          fi
      - name: Export exact compiled binary manifest
        id: manifest
        run: python3 tools/perf/packetbridge/artifact.py export
      - name: Stage original build evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/packetbridge-front-artifact"
          for name in packetbridge-build-output f997-collected-build; do
            if test -d "$RUNNER_TEMP/$name"; then cp -R "$RUNNER_TEMP/$name" "$RUNNER_TEMP/packetbridge-front-artifact/"; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        id: artifact
        with:
          name: packetbridge-exact-native-binaries
          path: ${{ runner.temp }}/packetbridge-front-artifact
          if-no-files-found: warn
          retention-days: 7
  measure:
    name: Actual compiler-free native bridge measurements
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FRONT_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      FRONT_ARTIFACT_SHA256: ${{ needs.build.outputs.artifact_sha256 }}
      FRONT_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
    steps:
      - name: Start independent measurement job budget
        run: |
          python3 - <<'PYCODE'
          import os,time
          assert len(os.sched_getaffinity(0))>=4
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PERF_JOB_START_MONOTONIC='+str(time.monotonic())+'\n')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify unchanged proven resource infrastructure and frozen bridge inputs
        run: python3 tools/perf/packetbridge/verify.py
      - name: Authenticate exact same-run old and new binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/perf/packetbridge/artifact.py fetch
      - name: Actual eleven ordinary tests, two focused regressions and four native benches
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB,PATH env PATH="$PATH" python3 tools/perf/packetbridge/manager.py measure --source "$PB_BINARY_BUNDLE" --output "$RUNNER_TEMP/packetbridge-measure-output" --resource "$RUNNER_TEMP/f997-runtime-output" --job-start "$PERF_JOB_START_MONOTONIC"
      - name: Independent fresh cleanup recheck
        if: always()
        run: |
          sudo python3 tools/perf/f997-baseline/cleanup_stage.py --temp-root "$RUNNER_TEMP" --state-root "$RUNNER_TEMP/f997-runtime-output" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Collect only owned original runtime resource evidence
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/f997-runtime-output"; then
            sudo python3 tools/perf/f997-baseline/collect_owned.py --temp-root "$RUNNER_TEMP" --source-root "$RUNNER_TEMP/f997-runtime-output" --destination-root "$RUNNER_TEMP/f997-collected-runtime" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          fi
      - name: Preserve all original measurements and resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packetbridge-native-measurements
          path: |
            ${{ runner.temp }}/packetbridge-measure-output
            ${{ runner.temp }}/f997-collected-runtime
            ${{ runner.temp }}/packetbridge-front-authentication.json
          if-no-files-found: warn
          retention-days: 7
