name: Apple archive acceptance
run-name: iOS unsigned archives for frozen product source

on:
  workflow_dispatch:
    inputs:
      candidate_only:
        description: iOS isolated acceptance archive only; skips the size baseline and never signs or uploads
        type: boolean
        default: false
      api_origin:
        description: Explicit authorized HTTPS origin; empty uses repository configuration
        required: false
      platform:
        description: Apple platform to build serially
        type: choice
        options: [ios, macos]
        default: ios
      source_ref:
        description: Exact product source commit
        required: true
      reuse_baseline_run:
        description: Optional successful iOS archive run with matching immutable baseline
        required: false
      baseline_ref:
        description: Exact functional baseline commit
        default: 1ddf0a168610172773fe3f479133ecbe5acf932f
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: apple-archive-comparison-${{ github.ref }}-${{ inputs.platform || 'ios' }}
  cancel-in-progress: false

jobs:
  archives:
    if: inputs.platform != 'macos'
    runs-on: macos-15
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SOURCE_REF: ${{ inputs.source_ref }}
      CANDIDATE_ONLY: ${{ inputs.candidate_only && '1' || '0' }}
      REUSE_BASELINE_RUN: ${{ inputs.reuse_baseline_run }}
      BASELINE_REF: ${{ inputs.baseline_ref || '1ddf0a168610172773fe3f479133ecbe5acf932f' }}
      PPVPN_BUILD_NUMBER: '344'
      PPVPN_API_BASE_DEFAULT: ${{ inputs.api_origin || vars.PPVPN_API_BASE }}
      PPVPN_APPLE_PUSH_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate archive mode
        run: |
          if [[ "$CANDIDATE_ONLY" == 1 && -n "$REUSE_BASELINE_RUN" ]]; then
            echo 'Candidate-only mode cannot claim a reused comparison baseline' >&2
            exit 2
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.reuse_baseline_run != ''
        with:
          name: ios-unsigned-archive-comparison
          run-id: ${{ inputs.reuse_baseline_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apple-baseline-reuse
      - name: Xcode 26
        run: |
          if [[ -n "$REUSE_BASELINE_RUN" ]]; then
            expected=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/apple-baseline-reuse/baseline/build-provenance.json"))["xcode"])')
            xcode=
            for candidate in /Applications/Xcode_26*.app; do
              if [[ "$(DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version)" == "$expected" ]]; then xcode="$candidate"; break; fi
            done
            [[ -n "$xcode" ]] || { echo 'Exact baseline Xcode is unavailable; reuse refused'; exit 1; }
          else
            xcode=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)
          fi
          [[ -d "$xcode" ]] || { echo 'Xcode 26 is unavailable'; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h /
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        timeout-minutes: 10
        continue-on-error: true
        with:
          prefix-key: v1-rust
          shared-key: macos
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: ${{ runner.arch == 'ARM64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
      - uses: ./.github/actions/flutter-toolchain
      - name: Serial Release archives on one compiler and SDK
        env:
          PPVPN_SKIP_ANALYZE: '1'
        run: |
          set -euo pipefail
          unset IOS_TEAM_ID IOS_APP_PROFILE IOS_TUNNEL_PROFILE IOS_EXPORT_OPTIONS
          unset PPVPN_API_BASE PPVPN_FLUTTER_HOME PPVPN_FLUTTER_SAMPLE PPVPN_FLUTTER_SYNTHETIC_TRAFFIC
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/apple-candidate"
          git -C "$RUNNER_TEMP/apple-candidate" checkout --detach "$SOURCE_REF"
          sides=(candidate)
          if [[ "$CANDIDATE_ONLY" != 1 ]]; then
            sides+=(baseline)
            git clone --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/apple-baseline"
            git -C "$RUNNER_TEMP/apple-baseline" checkout --detach "$BASELINE_REF"
          fi
          mkdir -p "$CARGO_TARGET_DIR" "$RUNNER_TEMP/apple-output"
          for side in "${sides[@]}"; do
            if [[ "$side" == baseline && -n "$REUSE_BASELINE_RUN" ]]; then
              origin_hash=$(python3 -c 'import os,hashlib; print(hashlib.sha256(os.environ["PPVPN_API_BASE_DEFAULT"].encode()).hexdigest())')
              python3 "$GITHUB_WORKSPACE/tools/apple/reuse_ios_baseline.py" \
                --download "$RUNNER_TEMP/apple-baseline-reuse" --output "$RUNNER_TEMP/apple-output/baseline" \
                --repo "$GITHUB_WORKSPACE" --source "$BASELINE_REF" --build "$PPVPN_BUILD_NUMBER" \
                --origin-hash "$origin_hash" --run "$REUSE_BASELINE_RUN"
              continue
            fi
            checkout="$RUNNER_TEMP/apple-$side"
            output="$RUNNER_TEMP/apple-output/$side"
            mkdir -p "$output"
            ln -s "$CARGO_TARGET_DIR" "$checkout/target"
            (cd "$checkout" && tools/release-features-check.sh --target aarch64-apple-ios -p ppvpn-flutter)
            (cd "$checkout" && FLUTTER_TARGET=ios IOS_SDK=device bash apps/flutter/scripts/ci-build.sh) >"$output/build.log" 2>&1
            archive="$checkout/apps/flutter/build/ios/archive/Runner.xcarchive"
            (cd "$checkout/apps/flutter" && xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
              -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
              -archivePath "$archive" -derivedDataPath "$RUNNER_TEMP/apple-derived-$side" archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
              LD_GENERATE_MAP_FILE=YES COMPILER_INDEX_STORE_ENABLE=NO) >"$output/archive.log" 2>&1
            contract_status=0
            python3 "$checkout/apps/flutter/scripts/check-ios-exports.py" \
              "$archive/Products/Applications/Runner.app/Runner" \
              "$archive/Products/Applications/Runner.app/PlugIns/PacketTunnel.appex/PacketTunnel" || contract_status=$?
            tar -czf "$output/Runner.xcarchive.tar.gz" -C "$(dirname "$archive")" Runner.xcarchive
            CHECKOUT="$checkout" OUTPUT="$output" SIDE="$side" CONTRACT_STATUS="$contract_status" python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json, os, subprocess
          checkout, output = Path(os.environ['CHECKOUT']), Path(os.environ['OUTPUT'])
          archive = output / 'Runner.xcarchive.tar.gz'
          for src in Path(os.environ['RUNNER_TEMP']).joinpath('apple-derived-' + os.environ['SIDE']).rglob('*LinkMap*.txt'):
              with gzip.open(output / (src.name + '.gz'), 'wb') as f:
                  f.write(src.read_bytes())
          data = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=checkout, text=True).strip(),
                  'cargo_lock_sha256': hashlib.sha256((checkout / 'Cargo.lock').read_bytes()).hexdigest(),
                  'backend_origin_sha256': hashlib.sha256(os.environ['PPVPN_API_BASE_DEFAULT'].encode()).hexdigest(),
                  'build_number': os.environ['PPVPN_BUILD_NUMBER'], 'architecture': 'arm64',
                  'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
                  'iphoneos_sdk': subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], text=True).strip(),
                  'rust': subprocess.check_output(['rustc', '--version'], text=True).strip(),
                  'flutter': json.loads(subprocess.check_output(['flutter', '--version', '--machine'], text=True)),
                  'archive_tar_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
                  'export_contract_check_exit': int(os.environ['CONTRACT_STATUS']),
                  'signing': 'unsigned; local provisioning/signing/export verification follows',
                  'apns_enabled': False, 'device_install_or_upload': False,
                  'build_purpose': 'isolated-candidate-only' if os.environ['CANDIDATE_ONLY'] == '1' else 'same-conditions-size-comparison'}
          (output / 'build-provenance.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
            [[ "$contract_status" == 0 ]] || exit "$contract_status"
          done
      # No signing environment, credentials, TestFlight or publication step.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ inputs.candidate_only && 'ios-unsigned-candidate-archive' || 'ios-unsigned-archive-comparison' }}
          path: ${{ runner.temp }}/apple-output
          if-no-files-found: warn
          retention-days: 3

  macos:
    if: inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PPVPN_API_BASE_DEFAULT: ${{ inputs.api_origin || vars.PPVPN_API_BASE }}
      PPVPN_BUILD_NUMBER: '344'
      PPVPN_APPLE_PUSH_ENABLED: '0'
      PPVPN_APPLE_TARGETS: aarch64-apple-darwin
      SOURCE_REF: ${{ inputs.source_ref }}
      BASELINE_REF: ${{ inputs.baseline_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Xcode and generator
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        timeout-minutes: 10
        continue-on-error: true
        with:
          prefix-key: v1-rust
          shared-key: macos
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/flutter-toolchain
      - name: Serial full macOS packages
        env:
          PPVPN_SKIP_ANALYZE: '1'
        run: |
          set -euo pipefail
          unset PPVPN_API_BASE PPVPN_FLUTTER_HOME PPVPN_FLUTTER_SAMPLE PPVPN_FLUTTER_SYNTHETIC_TRAFFIC
          mkdir -p "$CARGO_TARGET_DIR" "$RUNNER_TEMP/macos-output"
          for side in candidate baseline; do
            checkout="$RUNNER_TEMP/macos-$side"
            output="$RUNNER_TEMP/macos-output/$side"
            mkdir -p "$output"
            git clone --no-hardlinks "$GITHUB_WORKSPACE" "$checkout"
            if [[ "$side" == baseline ]]; then git -C "$checkout" checkout --detach "$BASELINE_REF"; fi
            ln -s "$CARGO_TARGET_DIR" "$checkout/target"
            echo /target >> "$checkout/.git/info/exclude"
            export PPVPN_MACOS_SINGLE_RUNTIME=0
            [[ "$side" != candidate ]] || export PPVPN_MACOS_SINGLE_RUNTIME=1
            (cd "$checkout" && env -u FLUTTER_TARGET MACOS_ARCHS=arm64 bash apps/flutter/scripts/ci-build.sh) >"$output/flutter-build.log" 2>&1
            (cd "$checkout" && bash tools/desktop/build-service.sh macos-arm64) >"$output/helper-build.log" 2>&1
            (cd "$checkout" && bash apps/macos/scripts/bootstrap.sh --release) >"$output/ffi-build.log" 2>&1
            app="$checkout/apps/flutter/build/macos/Build/Products/Release/PPVPN.app"
            (cd "$checkout" && SKIP_BOOTSTRAP=1 bash apps/flutter/scripts/package-macos.sh "$app" arm64) >"$output/package.log" 2>&1
            cp "$checkout"/dist/macos/* "$output/"
            CHECKOUT="$checkout" OUTPUT="$output" python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root,out=Path(os.environ['CHECKOUT']),Path(os.environ['OUTPUT'])
          app=root/'apps/flutter/build/macos-package-arm64/PPVPN.app'
          rows={str(p.relative_to(app)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in app.rglob('*') if p.is_file() and not p.is_symlink()}
          data={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip(),
                'layout':os.environ['PPVPN_MACOS_SINGLE_RUNTIME'],'signing':'ad-hoc measurement only; no production peer acceptance',
                'api_origin_sha256':hashlib.sha256(os.environ['PPVPN_API_BASE_DEFAULT'].encode()).hexdigest(),
                'xcode':subprocess.check_output(['xcodebuild','-version'],text=True).strip(),
                'rust':subprocess.check_output(['rustc','--version'],text=True).strip(),
                'logical_bundle_bytes':sum(v['bytes'] for v in rows.values()),'files':rows,
                'installed':False,'real_vpn_acceptance':False}
          (out/'build-provenance.json').write_text(json.dumps(data,indent=2)+'\n')
          PYCODE
            tar -czf "$output/PPVPN.app.tar.gz" -C "$checkout/apps/flutter/build/macos-package-arm64" PPVPN.app
          done
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'macos-output'
          a,b=[json.loads((out/side/'build-provenance.json').read_text()) for side in ('candidate','baseline')]
          for field in ('api_origin_sha256','xcode','rust','signing'): assert a[field]==b[field],field
          result={'candidate_bytes':a['logical_bundle_bytes'],'baseline_bytes':b['logical_bundle_bytes'],
                  'saved_bytes':b['logical_bundle_bytes']-a['logical_bundle_bytes'],
                  'saved_percent':100*(1-a['logical_bundle_bytes']/b['logical_bundle_bytes']),
                  'scope':'arm64 Release fully packaged app; ad-hoc measurement signatures; same compiler/SDK/API; no runtime acceptance'}
          (out/'comparison.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: macos-package-comparison
          path: ${{ runner.temp }}/macos-output
          if-no-files-found: warn
          retention-days: 3
