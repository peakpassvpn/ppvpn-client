name: Apple archive acceptance
run-name: iOS post-speed export R2 contract exact833
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post_speed_export_contract_r2:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select existing Xcode 26 Swift compiler
        shell: bash
        run: |
          set -euo pipefail
          xcode=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -d "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swiftc --version
      - name: Verify frozen R2 and execute exact contract commands
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/apple/run_export_only_contract_r2.py
      - name: Preserve original preparation compiler and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-post-speed-export-r2-contract
          path: ${{ runner.temp }}/post-speed-export-r2-evidence
          if-no-files-found: error
          retention-days: 7
