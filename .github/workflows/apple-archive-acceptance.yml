name: Apple archive acceptance
run-name: iOS packet provider A/B aca7d482
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packet_provider_bench:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select existing Xcode 26 Swift compiler
        shell: bash
        run: |
          set -euo pipefail
          xcode=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -d "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swiftc --version
      - name: Exact source controlled provider A/B
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/apple/run_ios_packet_bench.py
      - name: Preserve original benchmark and compiler evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-packet-provider-ab-aca7d482
          path: ${{ runner.temp }}/packet-bench-output
          if-no-files-found: error
          retention-days: 7
