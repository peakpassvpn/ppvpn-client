name: PacketBridge public-host actual TCP comparison
run-name: Authenticated exact original host binaries; corrected managed env; two64MiB TCP downloads
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: packetbridge-public-host-tcp-f997
  cancel-in-progress: false
jobs:
  measure:
    name: Public PacketBridge single-stream kernel TCP downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Start independent measurement job budget
        run: |
          python3 - <<'PYCODE'
          import os,time
          assert len(os.sched_getaffinity(0))>=4
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PERF_JOB_START_MONOTONIC='+str(time.monotonic())+'\n')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify unchanged proven resource infrastructure and frozen bridge inputs
        run: python3 tools/perf/packetbridge-tcp/verify.py
      - name: Authenticate exact successful original build and every binary input
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/perf/packetbridge-tcp/reuse_original.py
      - name: Actual owner canary then only OLD and NEW single-stream TCP cases
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_JOB,PATH env PATH="$PATH" python3 tools/perf/packetbridge-tcp/runtime_manager.py --bundle "$PB_TCP_BUNDLE" --manifest-sha256 "$FRONT_MANIFEST_SHA256" --out "$RUNNER_TEMP/f997-runtime-output" --job-start "$PERF_JOB_START_MONOTONIC"
      - name: Independent fresh cleanup recheck
        if: always()
        run: |
          sudo python3 tools/perf/f997-baseline/cleanup_stage.py --temp-root "$RUNNER_TEMP" --state-root "$RUNNER_TEMP/f997-runtime-output" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Collect only owned original runtime resource evidence
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/f997-runtime-output"; then
            sudo python3 tools/perf/f997-baseline/collect_owned.py --temp-root "$RUNNER_TEMP" --source-root "$RUNNER_TEMP/f997-runtime-output" --destination-root "$RUNNER_TEMP/f997-collected-runtime" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          fi
      - name: Preserve all original measurements and resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packetbridge-public-host-tcp-originals
          path: |
            ${{ runner.temp }}/f997-collected-runtime
            ${{ runner.temp }}/tcp-front-authentication.json
          if-no-files-found: warn
          retention-days: 7
