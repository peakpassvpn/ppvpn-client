name: desktop

# The desktop client (desktop/): its Rust crates on every pull request and
# push to main that touches desktop/ or what it builds from (the workspace
# crates it links by path, the lock, the toolchain). None of these jobs is a
# required check, so a pull request the filter skips is not held up; one
# that runs them is merged only when they pass, like any other check.
# rust.yml covers crates/ (the workspace's default members) and the
# [patch.crates-io] and Cargo.lock checks against sail.

on:
  pull_request:
    paths:
      - desktop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - test/netns/run.sh
      - test/fakenode/**
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - test/netns/run.sh
      - test/fakenode/**
      - .github/workflows/desktop.yml

permissions:
  contents: read

# A new push to a pull request cancels its runs still going (the macOS and
# Windows runners queue); runs on main are never cancelled.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The privileged service (its own Cargo.lock, outside the workspace), the
  # vendored Go core and the scripts.
  desktop-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version is rust-toolchain.toml's; keep them in step.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/service
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Go core's binaries are not in git: download them from the release
      # the manifest names and check each against the manifest.
      - name: Fetch and verify the vendored core
        run: desktop/scripts/fetch-vendored-core.sh
      - name: Test the privileged service
        working-directory: desktop/service
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Check scripts
        run: |
          bash -n desktop/scripts/*.sh desktop/scripts/ci/*.sh
          python3 -m unittest discover -s desktop/scripts/ci -p '*_test.py' -v

  # The shared layers every app depends on: the client crate as the apps link
  # it (the Go core over IPC), the C# view models (App.Core) used by Windows
  # and Linux, and the Linux app's own unit tests (no GTK runtime needed).
  desktop-client:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      UNIFFI_BINDGEN_CS_TAG: v0.11.0+v0.31.0
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-client
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the client crate
        working-directory: desktop/crates/ppvpn-client
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Cache uniffi-bindgen-cs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}
      # Either cache (this one or rust-cache, which keeps ~/.cargo/bin) may
      # have restored the binary: install only when it is missing or of
      # another version, and then over whatever is there.
      - name: Install uniffi-bindgen-cs
        run: |
          if ! uniffi-bindgen-cs --version 2>/dev/null | grep -qF "${UNIFFI_BINDGEN_CS_TAG#v}"; then
            cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG" uniffi-bindgen-cs --force
          fi
      - name: Generate C# bindings
        run: desktop/crates/ppvpn-client/scripts/build-dotnet.sh x86_64-unknown-linux-gnu
      - name: Test App.Core
        run: dotnet test desktop/apps/shared/PPVPN.App.Core.Tests
      - name: Test the Linux app
        run: dotnet test desktop/apps/linux/PPVPN.Linux.Tests

  # The client with the Rust ppvpn-core linked in (feature `rust-core`, off
  # in releases until the switch): clippy and tests on Linux. The macOS and
  # Windows builds of it are the two jobs below. sail builds from source;
  # its BoringSSL comes prebuilt, as in rust.yml.
  desktop-rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-rust-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # BoringSSL as btls publishes it for the btls-sys Cargo.lock pins
      # (checked against the release's SHA256SUMS and build attestation),
      # instead of compiling it; the script at a fixed commit of btls.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock x86_64-unknown-linux-gnu | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
      - name: Clippy and test with the Rust core
        working-directory: desktop/crates/ppvpn-client
        run: |
          cargo clippy --locked --features rust-core --all-targets -- -D warnings
          cargo test --locked --features rust-core --lib rust_core

  # The client library the apps link, with the Rust engine (feature
  # rust-core), built for every target the apps ship: both macOS
  # architectures (the app's universal library) and Windows x64 (MSVC).
  # Compile and link only; the engine's own tests run in rust.yml on these
  # platforms. BoringSSL comes prebuilt per target, as there.
  desktop-rust-core-macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-rust-core-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock "$target" | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
          done
      - name: Build the client library with the Rust core
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked -p ppvpn-client --features rust-core --lib --target "$target"
          done

  desktop-rust-core-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # bindgen's libclang (btls-sys), from the runner's LLVM: still needed
      # with the prebuilt BoringSSL (NASM and CMake are not).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-rust-core-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: prebuilt BoringSSL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock x86_64-pc-windows-msvc | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
      - name: Build the client library with the Rust core
        shell: bash
        run: cargo build --locked -p ppvpn-client --features rust-core --lib --target x86_64-pc-windows-msvc

  # Linux enhanced mode end to end, as root on the runner: the privileged
  # service with the vendored Go core, the client crate connecting and
  # disconnecting through it (src/e2e_linux.rs, feature linux-e2e), a mock
  # backend and a local Shadowsocks node (test/fakenode). Checks the TUN, the
  # core's policy rules and routing table, traffic through the node, and the
  # cleanup after a disconnect and after kill -9 of the core (with and
  # without the service). Inside run.sh's namespaces, which also checks that
  # the runner's own network state is unchanged. No backend, no internet.
  desktop-linux-enhanced:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-linux-enhanced
          workspaces: |
            desktop/crates/ppvpn-client
            desktop/service
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch and verify the vendored core
        run: desktop/scripts/fetch-vendored-core.sh linux-x86_64
      - name: Build the service, the test client and the fake node
        run: |
          (cd desktop/service && cargo build --locked --bin ppvpn-service)
          (cd desktop/crates/ppvpn-client && cargo clippy --locked --features linux-e2e --all-targets -- -D warnings)
          client=$(cd desktop/crates/ppvpn-client && cargo test --locked --features linux-e2e --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and (.target.kind | index("lib"))) | .executable' | tail -n 1)
          test -x "$client"
          echo "CLIENT_TEST=$client" >> "$GITHUB_ENV"
          go build -tags "$(make -s print-desktop-tags)" -o "$RUNNER_TEMP/fakenode" ./test/fakenode
      - name: Install the packages' layout
        # Where the deb puts them: the service accepts only /usr/lib/ppvpn/ppvpn
        # as a client, and runs the ppvpn-core next to itself.
        run: |
          core="desktop/vendor/ppvpn-core/$(cat desktop/vendor/ppvpn-core/CURRENT)/build/ppvpn-core-linux-amd64"
          sudo install -D -o root -g root -m 0755 "$CLIENT_TEST" /usr/lib/ppvpn/ppvpn
          sudo install -D -o root -g root -m 0755 "$core" /usr/lib/ppvpn/ppvpn-core
          sudo install -D -o root -g root -m 0755 desktop/service/target/debug/ppvpn-service /usr/lib/ppvpn-service/ppvpn-service
          sudo install -D -o root -g root -m 0755 "$core" /usr/lib/ppvpn-service/ppvpn-core
      - name: Enhanced mode end to end
        run: |
          sudo NETNS_TIMEOUT=600 NETNS_ENV="PPVPN_E2E_FAKENODE=$RUNNER_TEMP/fakenode" \
            test/netns/run.sh --libtest /usr/lib/ppvpn/ppvpn e2e_linux::enhanced_mode_routes_and_cleanup
      - name: Service log
        if: always()
        run: sudo tail -n 200 /var/log/ppvpn/ppvpn-service.log || true

  # The macOS app's logic (desktop/apps/macos/AppLogic: no AppKit/SwiftUI),
  # tested on Linux against the Linux build of the client crate. Pinned to
  # the Swift the macOS app is developed with.
  desktop-swift:
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 gcc libc6-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-swift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the client crate and its Swift bindings
        run: desktop/apps/macos/scripts/build-swift-linux.sh
      - name: Test AppLogic
        run: swift test --package-path desktop/apps/macos/AppLogic

  # The client crate's tests on macOS and a Debug build of the app against
  # it (ad-hoc signed; without the staged core and service, which a Debug
  # build does not need).
  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the client crate
        working-directory: desktop/crates/ppvpn-client
        run: cargo test --locked
      - name: Build the Debug app against the client
        run: |
          brew install xcodegen
          desktop/apps/macos/scripts/bootstrap.sh
          xcodebuild -project desktop/apps/macos/PPVPN.xcodeproj -scheme PPVPN -configuration Debug \
            -derivedDataPath desktop/apps/macos/build -destination 'platform=macOS' build

  # The Windows app (desktop/apps/windows): the client crate's tests with
  # MSVC, its C# bindings, the shared view models, then warning-free builds
  # of the WinUI app and of the push agent (NativeAOT). No installer and no
  # signing here. The default client build does not link the Rust engine, so
  # this needs neither libclang nor NASM.
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      UNIFFI_BINDGEN_CS_TAG: v0.11.0+v0.31.0
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      # The runner's git checks text out with CRLF; keep files as committed.
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the client crate
        working-directory: desktop/crates/ppvpn-client
        run: cargo test --locked
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Cache uniffi-bindgen-cs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}
      # build-dotnet.ps1 refuses any other version of the generator.
      - name: Install uniffi-bindgen-cs
        shell: bash
        run: |
          if ! uniffi-bindgen-cs --version 2>/dev/null | grep -qF "${UNIFFI_BINDGEN_CS_TAG#v}"; then
            cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG" uniffi-bindgen-cs --force
          fi
      - name: Generate C# bindings
        shell: powershell
        run: desktop/crates/ppvpn-client/scripts/build-dotnet.ps1 -Release
      - name: Test App.Core
        shell: powershell
        run: |
          dotnet test desktop/apps/shared/PPVPN.App.Core.Tests
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed" }
      - name: Build the app
        shell: powershell
        run: |
          dotnet build desktop/apps/windows/PPVPN.Windows/PPVPN.Windows.csproj -c Release -p:Platform=x64 -warnaserror
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed" }
      - name: Build the push agent (NativeAOT)
        shell: powershell
        run: |
          dotnet publish desktop/apps/windows/PPVPN.PushAgent/PPVPN.PushAgent.csproj -c Release -r win-x64 -warnaserror -o "$env:RUNNER_TEMP\push-agent"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
