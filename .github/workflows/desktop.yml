name: desktop

# The desktop client (desktop/): its Rust crates on every pull request and
# push to main that touches desktop/ or what it builds from (the workspace
# crates it links by path, the lock, the toolchain). None of these jobs is a
# required check, so a pull request the filter skips is not held up; one
# that runs them is merged only when they pass, like any other check.
# rust.yml covers crates/ (the workspace's default members) and the
# [patch.crates-io] and Cargo.lock checks against sail.

on:
  pull_request:
    paths:
      - desktop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/desktop.yml

permissions:
  contents: read

# A new push to a pull request cancels its runs still going (the macOS and
# Windows runners queue); runs on main are never cancelled.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The privileged service (its own Cargo.lock, outside the workspace), the
  # vendored Go core and the scripts.
  desktop-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version is rust-toolchain.toml's; keep them in step.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/service
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Go core's binaries are not in git: download them from the release
      # the manifest names and check each against the manifest.
      - name: Fetch and verify the vendored core
        run: desktop/scripts/fetch-vendored-core.sh
      - name: Test the privileged service
        working-directory: desktop/service
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Check scripts
        run: bash -n desktop/scripts/*.sh

  # The shared layers every app depends on: the client crate as the apps link
  # it (the Go core over IPC), the C# view models (App.Core) used by Windows
  # and Linux, and the Linux app's own unit tests (no GTK runtime needed).
  desktop-client:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      UNIFFI_BINDGEN_CS_TAG: v0.11.0+v0.31.0
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-client
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the client crate
        working-directory: desktop/crates/ppvpn-client
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Cache uniffi-bindgen-cs
        id: bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}
      - name: Install uniffi-bindgen-cs
        if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG" uniffi-bindgen-cs
      - name: Generate C# bindings
        run: desktop/crates/ppvpn-client/scripts/build-dotnet.sh x86_64-unknown-linux-gnu
      - name: Test App.Core
        run: dotnet test desktop/apps/shared/PPVPN.App.Core.Tests
      - name: Test the Linux app
        run: dotnet test desktop/apps/linux/PPVPN.Linux.Tests

  # The client with the Rust ppvpn-core linked in (feature `rust-core`, off
  # in releases until the switch). Linux only here; rust.yml builds the
  # engine on Windows (MSVC) and macOS. sail and its BoringSSL build from
  # source, so this job is slow on a cold cache.
  desktop-rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-rust-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy and test with the Rust core
        working-directory: desktop/crates/ppvpn-client
        run: |
          cargo clippy --locked --features rust-core --all-targets -- -D warnings
          cargo test --locked --features rust-core --lib rust_core

  # The macOS app's logic (desktop/apps/macos/AppLogic: no AppKit/SwiftUI),
  # tested on Linux against the Linux build of the client crate. Pinned to
  # the Swift the macOS app is developed with.
  desktop-swift:
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 gcc libc6-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-swift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the client crate and its Swift bindings
        run: desktop/apps/macos/scripts/build-swift-linux.sh
      - name: Test AppLogic
        run: swift test --package-path desktop/apps/macos/AppLogic

  # The client crate's tests on macOS and a Debug build of the app against
  # it (ad-hoc signed; without the staged core and service, which a Debug
  # build does not need).
  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the client crate
        working-directory: desktop/crates/ppvpn-client
        run: cargo test --locked
      - name: Build the Debug app against the client
        run: |
          brew install xcodegen
          desktop/apps/macos/scripts/bootstrap.sh
          xcodebuild -project desktop/apps/macos/PPVPN.xcodeproj -scheme PPVPN -configuration Debug \
            -derivedDataPath desktop/apps/macos/build -destination 'platform=macOS' build
