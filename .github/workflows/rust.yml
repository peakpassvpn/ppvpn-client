name: rust

# The Rust ppvpn-core (crates/): format, clippy and tests on every pull
# request and push to main, modelled on sail's lint and test jobs. sail and
# its BoringSSL are built from source (no prebuilt BoringSSL yet); the cache
# makes that a one-off, and is saved from main only, so that pull requests
# restore main's and do not push it out of the repository's cache quota.
# The Go core keeps its own workflows (ci.yml, release.yml, netns.yml).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version is rust-toolchain.toml's (sail's); keep them in step.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fetch
        run: cargo fetch --locked
      # sail's own check, from the checkout of the sail commit Cargo.lock pins.
      - name: sail's [patch.crates-io], as of the pinned sail commit
        run: |
          manifest=$(cargo metadata --format-version 1 --locked --offline |
            python3 -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "sail"))')
          python3 "$(dirname "$(dirname "$manifest")")/tools/embed-patch-check.py"
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Line numbers in a failing test's backtrace without full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        run: cargo test --workspace --locked
