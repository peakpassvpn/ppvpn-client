name: rust

# The Rust ppvpn-core (crates/): format, clippy and tests on every pull
# request and push to main, modelled on sail's lint and test jobs; tests on
# Linux, Windows (MSVC) and macOS (arm64). sail is built from source, with
# the BoringSSL btls publishes for its pinned commit (prebuilt, verified) on
# every job; the cache is saved from main only, so that pull requests
# restore main's and do not push it out of the repository's cache quota.
# The Go core keeps its own workflows (ci.yml, release.yml, netns.yml).
# Clippy and the tests cover the workspace's default members (crates/); the
# desktop client crate, a member too, is checked by desktop.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version is rust-toolchain.toml's (sail's); keep them in step.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # BoringSSL as btls publishes it for the btls-sys Cargo.lock pins
      # (checked against the release's SHA256SUMS and build attestation),
      # instead of compiling it; the script at a fixed commit of btls.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock x86_64-unknown-linux-gnu | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
      - name: fetch
        run: cargo fetch --locked
      # sail's own check, from the checkout of the sail commit Cargo.lock pins.
      - name: sail's [patch.crates-io], as of the pinned sail commit
        run: |
          manifest=$(cargo metadata --format-version 1 --locked --offline |
            python3 -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "sail"))')
          python3 "$(dirname "$(dirname "$manifest")")/tools/embed-patch-check.py"
      # Reports (never fails) shared packages our lock resolves otherwise
      # than sail's: a lock regenerated for a new crate can drift.
      - name: Cargo.lock against sail's
        run: tools/sail-lock-compare.py
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Line numbers in a failing test's backtrace without full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # BoringSSL as btls publishes it for the btls-sys Cargo.lock pins
      # (checked against the release's SHA256SUMS and build attestation),
      # instead of compiling it; the script at a fixed commit of btls.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock x86_64-unknown-linux-gnu | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
      - name: test
        run: cargo test --locked
      # The Secret Service store against a real keyring, in a D-Bus session
      # of its own with an unlocked login keyring (no desktop session).
      # tests/keystore.rs is built above and does nothing without the
      # variable.
      - name: secret store (Secret Service)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring
          bin="$(ls -t target/debug/deps/keystore-* | grep -v '\.d$' | head -n 1)"
          dbus-run-session -- bash -c '
            set -euo pipefail
            printf "%s" "ci-$RANDOM-$RANDOM" | gnome-keyring-daemon --unlock --components=secrets --daemonize >/dev/null
            PPVPN_TEST_KEYSTORE=1 "$0" --nocapture
          ' "$bin"

  # Windows with the MSVC toolchain, natively: what the desktop links (the
  # Windows service and client are MSVC builds). As sail's windows-msvc job,
  # on every pull request here. The crates the desktop links only:
  # ppvpn-cli does not support Windows (it ships for Linux and macOS).
  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      # bindgen's libclang (btls-sys), from the runner's LLVM: still needed
      # with the prebuilt BoringSSL (NASM and CMake are not).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git checks text out with CRLF; fixtures compared byte
      # for byte (localdns/testdata) must stay as committed.
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # BoringSSL as btls publishes it for the btls-sys Cargo.lock pins
      # (checked against the release's SHA256SUMS and build attestation),
      # instead of compiling it; the script at a fixed commit of btls.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock x86_64-pc-windows-msvc | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
      - name: build
        run: cargo build -p ppvpn-core -p ppvpn-account --all-targets --locked --target x86_64-pc-windows-msvc
      # Tests that cannot pass on Windows, each skipped by name with why; a
      # new failure fails the job.
      - name: test
        run: |
          skip=(
          )
          args=()
          for test in "${skip[@]}"; do args+=(--skip "$test"); done
          cargo test -p ppvpn-core -p ppvpn-account --locked --target x86_64-pc-windows-msvc -- --exact "${args[@]}"
      # A failing instance leaves the system as it was while the host lives
      # on (runtime::windows_tests): our MSVC build of sail, with a TUN,
      # auto_route and strict_route (198.18.0.0/16 alone, the runner's own
      # traffic stays out), failed by a fault the test arms (the test
      # build's fault-injection feature, never a release's). The runner is
      # administrator; wintun.dll, sail's pinned one, goes beside the test.
      # Run whatever the step before did; five runs, the system compared
      # before and after each (twenty on the pull request that added it).
      - name: the runtime's failures (Windows, administrator)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          WINTUN_VERSION: 0.14.1
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:WINTUN_SHA256) { throw "wintun zip: not the pinned hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\wintun"
          $deps = "target\x86_64-pc-windows-msvc\debug\deps"
          New-Item -ItemType Directory -Force $deps | Out-Null
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" $deps
          foreach ($i in 1..5) {
            Write-Output "::group::run $i"
            cargo test -p ppvpn-core --lib --features fault-injection --locked --target x86_64-pc-windows-msvc -- --ignored --test-threads 1 --nocapture runtime::windows_tests:: | Tee-Object -Variable out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # None skipped quietly: both tests ran.
            if (-not ($out -match "test result: ok\. 2 passed")) { throw "runtime::windows_tests: not both tests ran" }
            Write-Output "::endgroup::"
          }

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # BoringSSL as btls publishes it for the btls-sys Cargo.lock pins
      # (checked against the release's SHA256SUMS and build attestation),
      # instead of compiling it; the script at a fixed commit of btls.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock aarch64-apple-darwin | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
      - name: test
        run: cargo test --locked
      # The Keychain store against the runner's login keychain. The step has
      # its own timeout: a keychain prompt would wait for a person.
      - name: secret store (Keychain)
        timeout-minutes: 5
        run: |
          bin="$(ls -t target/debug/deps/keystore-* | grep -v '\.d$' | head -n 1)"
          PPVPN_TEST_KEYSTORE=1 "$bin" --nocapture

  # Intel Macs: Desktop ships a macOS x64 package, which links btls's
  # prebuilt BoringSSL for x86_64-apple-darwin, the one target btls's own
  # CI does not use (its macOS runners are Apple Silicon). Built here on an
  # Apple Silicon runner and run under Rosetta when the runner has it. Not
  # a required check.
  macos-x86_64:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/prebuilt-boringssl.sh" \
            https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh
          bash "$RUNNER_TEMP/prebuilt-boringssl.sh" Cargo.lock "$TARGET" | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
      - name: build the tests
        run: cargo test --locked --target "$TARGET" -p ppvpn-core -p ppvpn-account --no-run
      # btls-sys linked the downloaded library, not one it compiled: its
      # build script points the linker at BORING_BSSL_PATH_<target>/lib, and
      # no BoringSSL build tree exists.
      - name: the prebuilt library is the one linked
        run: |
          prebuilt="$BORING_BSSL_PATH_x86_64_apple_darwin"
          test -n "$prebuilt" && test -f "$prebuilt/lib/libssl.a"
          out=$(ls target/$TARGET/debug/build/btls-sys-*/output)
          grep -H "rustc-link-search=native=$prebuilt/lib" $out
          if find target/$TARGET/debug/build -path '*btls-sys-*/out/build' -maxdepth 4 | grep -q .; then
            echo "::error::btls-sys compiled BoringSSL instead of linking the prebuilt one"; exit 1
          fi
          bin=$(ls -t target/$TARGET/debug/deps/ppvpn_core-* | grep -v '\.d$' | head -n 1)
          for f in "$prebuilt/lib/libssl.a" "$prebuilt/lib/libcrypto.a" "$bin"; do
            echo "$f: $(lipo -archs "$f")"
            lipo "$f" -verify_arch x86_64
          done
      - name: Rosetta
        id: rosetta
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Rosetta is not available on this runner: the x86_64 tests were built and linked, not run"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: test under Rosetta
        if: steps.rosetta.outputs.available == 'true'
        run: cargo test --locked --target "$TARGET" -p ppvpn-core -p ppvpn-account
