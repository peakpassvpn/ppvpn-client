name: ci

# Every test of the repository, by tier (docs/testing.md):
#   L1 unit         no external dependency (make test-unit)
#   L2 integration  a real dependency outside the process, no privileges
#                   (make test-integration)
#   L3 system       a real TUN, routes, rules and DNS, privileged
#                   (make test-system), and the other platforms
# When each runs:
#   pull request    Linux only: lint, test (L1 and L2), sensitive, and the
#                   desktop's Linux jobs when desktop/ changed
#   merge queue     everything a change touches, on every platform (L1-L3);
#   by hand         also a pull request labelled ci:full (read at its next
#                   push)
#   main push       nothing but the cache: test, and the other jobs only when
#                   Cargo.toml, Cargo.lock or the toolchain changed (main
#                   arrives through the merge queue, already tested)
# No schedule: pinned dependencies do not change overnight.
#
# A job skipped by its `if` counts as passed for a required check, so the
# required checks (test, lint, windows-msvc, macos, tun, network-change,
# sensitive) keep their names and are simply skipped where they do not run.
#
# sail is built from source, with the BoringSSL btls publishes for its
# pinned commit (prebuilt, verified) on every job. Caches are saved from
# main only, so that pull requests and merge queue entries restore main's
# and do not push it out of the repository's cache quota.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run; other runs (merge queue
# entries, main's pushes, runs by hand) each get a group of their own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # What this change touches (tools/ci-changes.sh): engine, desktop,
  # packaging, deps. Runs by hand count as touching everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
      desktop: ${{ steps.diff.outputs.desktop }}
      packaging: ${{ steps.diff.outputs.packaging }}
      deps: ${{ steps.diff.outputs.deps }}
      # L3 and the other platforms: merge queue, by hand, or ci:full.
      full: ${{ steps.full.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - id: full
        env:
          FULL: >-
            ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' ||
                contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          WARM: ${{ github.event_name == 'push' && steps.diff.outputs.deps == 'true' }}
        # A main push whose dependencies changed runs the other jobs too, to
        # save their caches; it is otherwise a full run's job set.
        run: |
          if [ "$FULL" = true ] || [ "$WARM" = true ]; then echo full=true; else echo full=false; fi >> "$GITHUB_OUTPUT"

  # The tree, then the commits the change adds (lines, file paths, messages,
  # authors), with the generic rules only: the local patterns file never
  # exists here. Findings print as path:line.
  sensitive:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tree
        run: tools/sensitive-check.sh tree
      - name: Added commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          case $EVENT in
            pull_request) base=$PR_BASE head=$PR_HEAD ;;
            merge_group) base=$MERGE_BASE head=$HEAD_SHA ;;
            *) head=$HEAD_SHA; base=$(git merge-base origin/main "$head") ;;
          esac
          if [ "$(git rev-parse "$base")" = "$(git rev-parse "$head")" ]; then
            echo "sensitive-check: no new commits"
            exit 0
          fi
          tools/sensitive-check.sh range "$base" "$head"

  # L1: format, clippy and the checks against sail's pins.
  lint:
    needs: changes
    if: >-
      needs.changes.outputs.engine == 'true' &&
      (github.event_name != 'push' || needs.changes.outputs.full == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version is rust-toolchain.toml's (sail's); keep them in step.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - name: fetch
        run: cargo fetch --locked
      # sail's own check, from the checkout of the sail commit Cargo.lock pins.
      - name: sail's [patch.crates-io], as of the pinned sail commit
        run: |
          manifest=$(cargo metadata --format-version 1 --locked --offline |
            python3 -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "sail"))')
          python3 "$(dirname "$(dirname "$manifest")")/tools/embed-patch-check.py"
      # Reports (never fails) shared packages our lock resolves otherwise
      # than sail's: a lock regenerated for a new crate can drift.
      - name: Cargo.lock against sail's
        run: tools/sail-lock-compare.py
      # tools/release-features-check.sh, which the release builds run: it
      # passes the shipped crates and refuses a test-only feature.
      - name: release feature check
        run: |
          tools/release-features-check.sh -p ppvpn-cli
          tools/release-features-check.sh -p ppvpn-client
          for features in "-p ppvpn-core --features fault-injection" "-p ppvpn-core --features testing" \
                          "-p ppvpn-core --features lab" "-p ppvpn-cli --features testing"; do
            if tools/release-features-check.sh $features; then
              echo "::error::the check let $features through"; exit 1
            fi
          done
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: scripts
        run: bash -n tools/*.sh test/netns/*.sh

  # L1 and L2 on Linux; on a main push, the cache. Clippy and the tests cover
  # the workspace's default members (crates/); the desktop client crate is
  # checked by the desktop jobs.
  test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Line numbers in a failing test's backtrace without full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - name: L1 (make test-unit)
        run: make test-unit
      # The Secret Service store against a real keyring, in a D-Bus session
      # of its own with an unlocked login keyring (no desktop session).
      - name: L2 (make test-integration)
        if: github.event_name != 'push'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring
          make test-integration

  # L3 on Linux: the TUN guard, the runtime's reload and failures, G7's
  # killed instance (make test-system PART=tun).
  tun:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # The test binary builds sail from source until this job's cache (saved
    # from main) has it.
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - name: L3 tun (make test-system PART=tun)
        run: make test-system PART=tun

  # L3 on Linux: dns-local and the host-IPv6 re-probe across network changes
  # on the Rust engine, strictly (make test-system PART=network-change).
  network-change:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - name: tcpdump
        run: command -v tcpdump || { sudo apt-get update -qq && sudo apt-get install -y -qq tcpdump; }
      - name: L3 network-change (make test-system PART=network-change)
        run: make test-system PART=network-change

  # Windows with the MSVC toolchain, natively: what the desktop links (the
  # Windows service and client are MSVC builds). L1 of the crates the desktop
  # links only: ppvpn-cli does not support Windows (it ships for Linux and
  # macOS).
  windows-msvc:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      # bindgen's libclang (btls-sys), from the runner's LLVM: still needed
      # with the prebuilt BoringSSL (NASM and CMake are not).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git checks text out with CRLF; fixtures compared byte
      # for byte (localdns/testdata) must stay as committed.
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-pc-windows-msvc
      - name: build
        run: cargo build -p ppvpn-core -p ppvpn-account --all-targets --locked --target x86_64-pc-windows-msvc
      # Tests that cannot pass on Windows, each skipped by name with why; a
      # new failure fails the job.
      - name: test
        run: |
          skip=(
          )
          args=()
          for test in "${skip[@]}"; do args+=(--skip "$test"); done
          cargo test -p ppvpn-core -p ppvpn-account --locked --target x86_64-pc-windows-msvc -- --exact "${args[@]}"

  # L3 on Windows: a failing instance leaves the system as it was while the
  # host lives on (runtime::windows_tests): our MSVC build of sail, with a
  # TUN, auto_route and strict_route (198.18.0.0/16 alone, the runner's own
  # traffic stays out), failed by a fault the test arms (the test build's
  # fault-injection feature, never a release's). The runner is
  # administrator; wintun.dll, sail's pinned one, goes beside the test. A job
  # of its own beside windows-msvc, so that neither waits for the other; its
  # cache is its own (other features, other artifacts).
  windows-failures:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Runs, the system compared before and after each: once per merge
      # queue entry, five by hand (twenty on the pull request that adds a
      # test here).
      RUNS: ${{ github.event_name == 'workflow_dispatch' && 5 || 1 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-pc-windows-msvc
      - name: build
        run: cargo test -p ppvpn-core --lib --features fault-injection --locked --target x86_64-pc-windows-msvc --no-run
      - name: the runtime's failures (Windows, administrator)
        shell: pwsh
        env:
          WINTUN_VERSION: 0.14.1
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:WINTUN_SHA256) { throw "wintun zip: not the pinned hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\wintun"
          $deps = "target\x86_64-pc-windows-msvc\debug\deps"
          New-Item -ItemType Directory -Force $deps | Out-Null
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" $deps
          foreach ($i in 1..[int]$env:RUNS) {
            Write-Output "::group::run $i"
            cargo test -p ppvpn-core --lib --features fault-injection --locked --target x86_64-pc-windows-msvc -- --ignored --test-threads 1 --nocapture runtime::windows_tests:: | Tee-Object -Variable out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # None skipped quietly: both tests ran.
            if (-not ($out -match "test result: ok\. 2 passed")) { throw "runtime::windows_tests: not both tests ran" }
            Write-Output "::endgroup::"
          }

  # L1 and L2 on macOS (arm64).
  macos:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.full == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: aarch64-apple-darwin
      - name: L1 (make test-unit)
        run: make test-unit
      # The Keychain store against the runner's login keychain. The step has
      # its own timeout: a keychain prompt would wait for a person.
      - name: L2 (make test-integration)
        timeout-minutes: 5
        run: make test-integration

  # Intel Macs: Desktop ships a macOS x64 package, which links btls's
  # prebuilt BoringSSL for x86_64-apple-darwin, the one target btls's own
  # CI does not use (its macOS runners are Apple Silicon). Built here on an
  # Apple Silicon runner and run under Rosetta when the runner has it. Not
  # a required check.
  macos-x86_64:
    needs: changes
    if: needs.changes.outputs.engine == 'true' && needs.changes.outputs.full == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: ${{ env.TARGET }}
      - name: build the tests
        run: cargo test --locked --target "$TARGET" -p ppvpn-core -p ppvpn-account --no-run
      # btls-sys linked the downloaded library, not one it compiled: its
      # build script points the linker at BORING_BSSL_PATH_<target>/lib, and
      # no BoringSSL build tree exists.
      - name: the prebuilt library is the one linked
        run: |
          prebuilt="$BORING_BSSL_PATH_x86_64_apple_darwin"
          test -n "$prebuilt" && test -f "$prebuilt/lib/libssl.a"
          out=$(ls target/$TARGET/debug/build/btls-sys-*/output)
          grep -H "rustc-link-search=native=$prebuilt/lib" $out
          if find target/$TARGET/debug/build -path '*btls-sys-*/out/build' -maxdepth 4 | grep -q .; then
            echo "::error::btls-sys compiled BoringSSL instead of linking the prebuilt one"; exit 1
          fi
          bin=$(ls -t target/$TARGET/debug/deps/ppvpn_core-* | grep -v '\.d$' | head -n 1)
          for f in "$prebuilt/lib/libssl.a" "$prebuilt/lib/libcrypto.a" "$bin"; do
            echo "$f: $(lipo -archs "$f")"
            lipo "$f" -verify_arch x86_64
          done
      - name: Rosetta
        id: rosetta
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Rosetta is not available on this runner: the x86_64 tests were built and linked, not run"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: test under Rosetta
        if: steps.rosetta.outputs.available == 'true'
        run: cargo test --locked --target "$TARGET" -p ppvpn-core -p ppvpn-account

  # ---- The desktop client (desktop/). None of these is a required check.

  # The privileged service (a workspace member, shipped with the "service"
  # profile; it hosts the TUN engine) and the scripts.
  desktop-rust:
    needs: changes
    if: >-
      (github.event_name != 'push' && needs.changes.outputs.desktop == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.full == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Test the privileged service
        working-directory: desktop/service
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Check scripts
        run: |
          bash -n desktop/scripts/*.sh desktop/scripts/ci/*.sh
          python3 -m unittest discover -s desktop/scripts/ci -p '*_test.py' -v

  # The shared layers every app depends on: the client crate as the apps link
  # it (with the Rust engine), the C# view models (App.Core) used by Windows
  # and Linux, and the Linux app's own unit tests (no GTK runtime needed).
  desktop-client:
    needs: changes
    if: >-
      (github.event_name != 'push' && needs.changes.outputs.desktop == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.full == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      UNIFFI_BINDGEN_CS_TAG: v0.11.0+v0.31.0
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-client
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Test the client crate
        working-directory: desktop/crates/ppvpn-client
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Cache uniffi-bindgen-cs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}
      # Either cache (this one or rust-cache, which keeps ~/.cargo/bin) may
      # have restored the binary: install only when it is missing or of
      # another version, and then over whatever is there.
      - name: Install uniffi-bindgen-cs
        run: |
          if ! uniffi-bindgen-cs --version 2>/dev/null | grep -qF "${UNIFFI_BINDGEN_CS_TAG#v}"; then
            cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG" uniffi-bindgen-cs --force
          fi
      - name: Generate C# bindings
        run: desktop/crates/ppvpn-client/scripts/build-dotnet.sh x86_64-unknown-linux-gnu
      - name: Test App.Core
        run: dotnet test desktop/apps/shared/PPVPN.App.Core.Tests
      - name: Test the Linux app
        run: dotnet test desktop/apps/linux/PPVPN.Linux.Tests

  # The macOS app's logic (desktop/apps/macos/AppLogic: no AppKit/SwiftUI),
  # tested on Linux against the Linux build of the client crate. Pinned to
  # the Swift the macOS app is developed with.
  desktop-swift:
    needs: changes
    if: >-
      (github.event_name != 'push' && needs.changes.outputs.desktop == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.full == 'true')
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 gcc libc6-dev libclang-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-swift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build the client crate and its Swift bindings
        run: desktop/apps/macos/scripts/build-swift-linux.sh
      - name: Test AppLogic
        run: swift test --package-path desktop/apps/macos/AppLogic

  # L3 for the desktop on Linux: enhanced mode end to end, as root on the
  # runner: the privileged service with the engine in process, the client
  # crate connecting and disconnecting through it (src/e2e_linux.rs, feature
  # linux-e2e), a mock backend and a local Shadowsocks node (test/fakenode).
  # Checks the TUN, the core's policy rules and routing table, traffic
  # through the node, and the cleanup after a disconnect and after kill -9
  # of the core (with and without the service). Inside run.sh's namespaces,
  # which also checks that the runner's own network state is unchanged. No
  # backend, no internet.
  desktop-linux-enhanced:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-linux-enhanced
          workspaces: |
            desktop/crates/ppvpn-client
            desktop/service
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build the service, the test client and the fake node
        run: |
          (cd desktop/service && cargo build --locked --bin ppvpn-service)
          (cd desktop/crates/ppvpn-client && cargo clippy --locked --features linux-e2e --all-targets -- -D warnings)
          client=$(cd desktop/crates/ppvpn-client && cargo test --locked --features linux-e2e --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and (.target.kind | index("lib"))) | .executable' | tail -n 1)
          test -x "$client"
          echo "CLIENT_TEST=$client" >> "$GITHUB_ENV"
          make test-tools
      - name: Install the packages' layout
        # Where the deb puts them: the service accepts only /usr/lib/ppvpn/ppvpn
        # as a client.
        run: |
          sudo install -D -o root -g root -m 0755 "$CLIENT_TEST" /usr/lib/ppvpn/ppvpn
          sudo install -D -o root -g root -m 0755 target/debug/ppvpn-service /usr/lib/ppvpn-service/ppvpn-service
      - name: Enhanced mode end to end
        run: |
          sudo NETNS_TIMEOUT=600 NETNS_ENV="PPVPN_E2E_FAKENODE=$PWD/build/test-tools/fakenode" \
            test/netns/run.sh --libtest /usr/lib/ppvpn/ppvpn e2e_linux::enhanced_mode_routes_and_cleanup
      - name: Service log
        if: always()
        run: sudo tail -n 200 /var/log/ppvpn/ppvpn-service.log || true

  # The client crate's tests on macOS and a Debug build of the app against
  # it (ad-hoc signed; without the staged core and service, which a Debug
  # build does not need).
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - name: Test the client crate
        working-directory: desktop/crates/ppvpn-client
        run: cargo test --locked
      - name: Build the Debug app against the client
        run: |
          brew install xcodegen
          desktop/apps/macos/scripts/bootstrap.sh
          xcodebuild -project desktop/apps/macos/PPVPN.xcodeproj -scheme PPVPN -configuration Debug \
            -derivedDataPath desktop/apps/macos/build -destination 'platform=macOS' build

  # The Windows app (desktop/apps/windows): the client crate's tests with
  # MSVC, its C# bindings, the shared view models, then warning-free builds
  # of the WinUI app and of the push agent (NativeAOT). No installer and no
  # signing here. The client links the Rust engine: BoringSSL comes
  # prebuilt, bindgen needs the runner's libclang (no NASM or CMake).
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # bindgen's libclang (btls-sys), from the runner's LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      UNIFFI_BINDGEN_CS_TAG: v0.11.0+v0.31.0
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      # The runner's git checks text out with CRLF; keep files as committed.
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test the client crate
        working-directory: desktop/crates/ppvpn-client
        run: cargo test --locked
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Cache uniffi-bindgen-cs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}
      # build-dotnet.ps1 refuses any other version of the generator.
      - name: Install uniffi-bindgen-cs
        shell: bash
        run: |
          if ! uniffi-bindgen-cs --version 2>/dev/null | grep -qF "${UNIFFI_BINDGEN_CS_TAG#v}"; then
            cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG" uniffi-bindgen-cs --force
          fi
      - name: Generate C# bindings
        shell: powershell
        run: desktop/crates/ppvpn-client/scripts/build-dotnet.ps1 -Release
      - name: Test App.Core
        shell: powershell
        run: |
          dotnet test desktop/apps/shared/PPVPN.App.Core.Tests
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed" }
      - name: Build the app
        shell: powershell
        run: |
          dotnet build desktop/apps/windows/PPVPN.Windows/PPVPN.Windows.csproj -c Release -p:Platform=x64 -warnaserror
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed" }
      - name: Build the push agent (NativeAOT)
        shell: powershell
        run: |
          dotnet publish desktop/apps/windows/PPVPN.PushAgent/PPVPN.PushAgent.csproj -c Release -r win-x64 -warnaserror -o "$env:RUNNER_TEMP\push-agent"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

  # The installers, without any secret (unsigned on Windows, ad-hoc signed on
  # macOS, no update signature), when a full run's change touches their
  # inputs: desktop-package.yml, which the release workflow calls with its
  # environment.
  desktop-package:
    needs: changes
    if: needs.changes.outputs.packaging == 'true' && needs.changes.outputs.full == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/desktop-package.yml
    with:
      channel: none
      version: ''
      build_number: ''
