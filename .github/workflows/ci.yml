name: ci
run-name: Windows actual desktop capability - ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-desktop-capability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-desktop-capability:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe actual desktop and independent fullscreen window
        shell: powershell
        run: tools/windows-ui-probe/run.ps1 -OutputDir "$env:RUNNER_TEMP/windows-desktop-capability"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-desktop-capability-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-desktop-capability
          if-no-files-found: error
