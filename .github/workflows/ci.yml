name: ci
run-name: Windows actual DXGI exclusive capability - ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-desktop-capability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-desktop-capability:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe actual desktop
        shell: powershell
        run: tools/windows-ui-probe/observe.ps1 -OutputDir "$env:RUNNER_TEMP/windows-desktop-capability/baseline"
      - name: Compile actual D3D11 DXGI capability window
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 /DUNICODE /D_UNICODE tools\windows-ui-probe\d3d-exclusive.cpp /Fo:"%RUNNER_TEMP%\windows-desktop-capability\d3d-exclusive.obj" /Fe:"%RUNNER_TEMP%\windows-desktop-capability\d3d-exclusive.exe"
      - name: Exercise exclusive fullscreen and restored maximized control
        shell: powershell
        run: tools/windows-ui-probe/run-d3d.ps1 -OutputDir "$env:RUNNER_TEMP/windows-desktop-capability"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-desktop-capability-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-desktop-capability
          if-no-files-found: error
