name: CI

# Tier 1: every pull request and push to main. Fast checks only: vet and the
# unit/integration tests under the tag sets the products build with. The
# race detector, govulncheck, Windows-native tests and all artifact builds run
# in release.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: GOOS=windows go vet -tags with_utls,with_gvisor,with_dhcp ./...
      - run: go test ./...
      - run: go test -tags with_utls ./internal/... ./probe/...
      # Desktop cores are built with gVisor for the TUN "mixed" stack.
      - run: go test -tags with_utls,with_gvisor,with_dhcp ./cmd/... ./internal/... ./localproxy/...
      # Lab builds (localdns_testsource) read dns-local's servers from a file;
      # the source must exist only there: tested with the tag, and absent from
      # a build with the release tags (release.yml also checks every release file).
      - run: go test -tags localdns_testsource ./internal/localdns/
      - name: Release builds carry no localdns test source
        run: |
          set -euo pipefail
          marker=ppvpn-localdns-testsource-enabled
          go build -tags "$(make -s print-desktop-tags)" -trimpath -o "$RUNNER_TEMP/core-release" ./cmd/ppvpn-core
          go build -tags "$(make -s print-desktop-tags),localdns_testsource" -trimpath -o "$RUNNER_TEMP/core-lab" ./cmd/ppvpn-core
          grep -qa "$marker" "$RUNNER_TEMP/core-lab" || { echo "lab build lacks the marker: the check below would prove nothing" >&2; exit 1; }
          if grep -qa "$marker" "$RUNNER_TEMP/core-release"; then echo "release build contains the localdns test source" >&2; exit 1; fi
