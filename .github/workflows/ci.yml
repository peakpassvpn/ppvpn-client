name: ci

# Every test of the repository, on every pull request (docs/testing.md):
#   L1 unit         no external dependency (make test-unit)
#   L2 integration  a real dependency outside the process, no privileges
#                   (make test-integration)
#   L3 system       a real TUN, routes, rules and DNS, privileged
#                   (make test-system), and the desktop end to end
# Ten jobs, all in parallel, all on every pull request. A job that does not
# depend on the platform is named for what it checks (it runs on ubuntu, as
# an implementation detail); a platform job is named for its OS and covers
# only that OS's own code. L1 and L2 run once (docs/testing.md, "Platform
# tests"):
#   lint         the sensitive check, format, clippy, sail's pins, the
#                release feature check
#   advisories   cargo-deny: RustSec advisories and dependency sources
#                (deny.toml)
#   unit         L1
#   integration  L2
#   desktop      the desktop layers: the service and the client, the
#                scripts, the C# and Swift bindings with their tests
#   linux        Linux's own: L3 in network namespaces (tun with G7,
#                network-change) and the desktop's enhanced mode end to end
#   macos        clippy (aarch64), the macOS-only tests
#   windows      clippy (MSVC), the Windows-only tests, G7 on Windows, the
#                C# bindings, App.Core
#   flutter      the Flutter prototype (#387) on Linux, macOS and Windows:
#                build and smoke test, the Linux deb and rpm, only when it
#                or what it builds from changed; on Windows also its installer,
#                installed and uninstalled
#   android      the Flutter app's Android target (#448): the bridge for
#                arm64 and x86_64, the APK, the app started on an emulator,
#                only when it or what it builds from changed
#   ios          the Flutter app's iOS target (#448): the bridge for Apple
#                silicon's simulator, the app, started on an iPhone
#                simulator, only when it or what it builds from changed
# A pull request that changes only docs/ or Markdown runs every job, and each
# skips its build and test steps (tools/ci-changes.sh `code`); lint still runs
# the sensitive check.
#
# Merges to main run release.yml, not this: it builds the installers and
# keeps the build caches this workflow restores. A pull request only reads
# caches, so the cache keys here (shared-key) are the ones release.yml saves
# (its cache-* jobs). The repository has 10 GB of cache: nothing here saves
# one, not even setup-go's; test/go.mod's modules come from release.yml's
# cache too (.github/actions/go-modules).
# By hand: gh workflow run ci.yml --ref <branch>.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: "windows: runs of the runtime's failure tests (twenty on the pull request that adds one)"
        type: number
        default: 5

permissions:
  contents: read

# A pull request's newer push cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line numbers in a failing test's backtrace without full debug info. Part
  # of the cache key: release.yml's cache jobs set the same.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The tree, then the commits the pull request adds (lines, file paths,
      # messages, authors), with the generic rules only: the local patterns
      # file never exists here. Findings print as path:line.
      - name: sensitive check, tree
        run: tools/sensitive-check.sh tree
      - name: sensitive check, added commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -n "$PR_BASE" ]; then base=$PR_BASE head=$PR_HEAD
          else head=$HEAD_SHA; base=$(git merge-base origin/main "$head"); fi
          if [ "$(git rev-parse "$base")" = "$(git rev-parse "$head")" ]; then
            echo "sensitive-check: no new commits"
            exit 0
          fi
          tools/sensitive-check.sh range "$base" "$head"
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      # The version is rust-toolchain.toml's (sail's); keep them in step.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.code == 'true'
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.code == 'true'
        with:
          shared-key: linux
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.code == 'true'
        with:
          targets: x86_64-unknown-linux-gnu
      - name: fetch
        if: steps.scope.outputs.code == 'true'
        run: cargo fetch --locked
      # sail's own check, from the checkout of the sail commit Cargo.lock pins.
      - name: sail's [patch.crates-io], as of the pinned sail commit
        if: steps.scope.outputs.code == 'true'
        run: |
          manifest=$(cargo metadata --format-version 1 --locked --offline |
            python3 -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "sail"))')
          python3 "$(dirname "$(dirname "$manifest")")/tools/embed-patch-check.py"
      # Reports (never fails) shared packages our lock resolves otherwise
      # than sail's: a lock regenerated for a new crate can drift.
      - name: Cargo.lock against sail's
        if: steps.scope.outputs.code == 'true'
        run: tools/sail-lock-compare.py
      # tools/release-features-check.sh, which the release builds run: it
      # passes the shipped crates and refuses a test-only feature.
      - name: release feature check
        if: steps.scope.outputs.code == 'true'
        run: |
          tools/release-features-check.sh -p ppvpn-cli
          tools/release-features-check.sh -p ppvpn-desktop
          for features in "-p ppvpn-core --features fault-injection" "-p ppvpn-core --features testing" \
                          "-p ppvpn-core --features lab" "-p ppvpn-cli --features testing"; do
            if tools/release-features-check.sh $features; then
              echo "::error::the check let $features through"; exit 1
            fi
          done
      - name: format
        if: steps.scope.outputs.code == 'true'
        run: cargo fmt --all --check
      # The workspace's default members (crates/); the desktop crates are
      # desktop's.
      - name: clippy
        if: steps.scope.outputs.code == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: scripts
        if: steps.scope.outputs.code == 'true'
        run: bash -n tools/*.sh test/netns/*.sh

  # cargo-deny against Cargo.lock (deny.toml): the RustSec advisories, then
  # where the dependencies come from. A new advisory can appear on any day:
  # it fails only a pull request that changes the dependencies (scope deps)
  # and is a warning on the others, so that it shows without blocking
  # unrelated work. The binary is cargo-deny's release, checked by hash.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      # cargo-deny reads the graph with cargo metadata: rust-toolchain.toml's.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - name: cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name=cargo-deny-$VERSION-x86_64-unknown-linux-musl
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: advisories
        continue-on-error: ${{ steps.scope.outputs.deps != 'true' }}
        run: cargo deny --all-features --locked check advisories
      - name: sources
        run: cargo deny --all-features --locked check sources

  # L1 on Linux.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.code == 'true'
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.code == 'true'
        with:
          shared-key: unit
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.code == 'true'
        with:
          targets: x86_64-unknown-linux-gnu
      - name: L1 (make test-unit)
        if: steps.scope.outputs.code == 'true'
        run: make test-unit

  # L2 on Linux, beside L1: the CLI's Secret Service store against a real
  # keyring, in a D-Bus session of its own with an unlocked login keyring
  # (no desktop session).
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.code == 'true'
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.code == 'true'
        with:
          shared-key: integration
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.code == 'true'
        with:
          targets: x86_64-unknown-linux-gnu
      - name: L2 (make test-integration)
        if: steps.scope.outputs.code == 'true'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring
          make test-integration

  # L3 on Linux, as root inside network namespaces of their own
  # (test/netns/run.sh, which also checks the runner's own network state is
  # unchanged afterwards). No backend, no internet.
  #   tun             the TUN guard, the runtime's reload and failures, G7's
  #                   killed instance
  #   network-change  dns-local and the host-IPv6 re-probe across network
  #                   changes on the Rust engine, strictly
  #   enhanced mode   the privileged service with the engine in process, the
  #                   client crate connecting and disconnecting through it
  #                   (src/e2e_linux.rs, feature linux-e2e), a mock backend
  #                   and a local Shadowsocks node (test/fakenode): the TUN,
  #                   the policy rules and routing table, traffic through the
  #                   node, the cleanup after a disconnect and after kill -9
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.code == 'true'
        with:
          go-version-file: test/go.mod
          cache: false
      # test/go.mod's modules from the cache, offline on a hit (#459).
      - uses: ./.github/actions/go-modules
        if: steps.scope.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.code == 'true'
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.code == 'true'
        with:
          shared-key: linux
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.code == 'true'
        with:
          targets: x86_64-unknown-linux-gnu
      - name: tcpdump
        if: steps.scope.outputs.code == 'true'
        run: command -v tcpdump || { sudo apt-get update -qq && sudo apt-get install -y -qq tcpdump; }
      - name: L3 tun (make test-system PART=tun)
        if: steps.scope.outputs.code == 'true'
        run: make test-system PART=tun
      - name: L3 network-change (make test-system PART=network-change)
        if: steps.scope.outputs.code == 'true'
        run: make test-system PART=network-change
      - name: Build the service, the test client and the fake node
        if: steps.scope.outputs.code == 'true'
        run: |
          (cd crates/service && cargo build --locked --bin ppvpn-service)
          (cd crates/desktop && cargo clippy --locked --features linux-e2e --all-targets -- -D warnings)
          client=$(cd crates/desktop && cargo test --locked --features linux-e2e --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and (.target.kind | index("lib"))) | .executable' | tail -n 1)
          test -x "$client"
          echo "CLIENT_TEST=$client" >> "$GITHUB_ENV"
          make test-tools
      - name: Install the packages' layout
        if: steps.scope.outputs.code == 'true'
        # Where the deb puts them: the service accepts only /usr/lib/ppvpn/ppvpn
        # as a client.
        run: |
          sudo install -D -o root -g root -m 0755 "$CLIENT_TEST" /usr/lib/ppvpn/ppvpn
          sudo install -D -o root -g root -m 0755 target/debug/ppvpn-service /usr/lib/ppvpn-service/ppvpn-service
      - name: L3 desktop enhanced mode end to end
        if: steps.scope.outputs.code == 'true'
        run: |
          sudo NETNS_TIMEOUT=600 NETNS_ENV="PPVPN_E2E_FAKENODE=$PWD/build/test-tools/fakenode" \
            test/netns/run.sh --libtest /usr/lib/ppvpn/ppvpn e2e_linux::enhanced_mode_routes_and_cleanup
      # Memory in the iOS extension's shape (#388): ne-mem in release (lab:
      # the variants' sail settings), the perf fake node and load generator,
      # tools/perf/ne_mem.py as root (sail opens the TUN; only 203.0.113.0/24
      # is routed into it). Only when the
      # harness or Cargo.lock (a sail upgrade) changed: scope memory.
      - name: Memory, the extension's shape
        if: steps.scope.outputs.memory == 'true'
        timeout-minutes: 40
        run: |
          cargo build --release --locked -p ppvpn-core-lab --bin ne-mem --features ppvpn-core/lab
          mkdir -p build/perf
          (cd test && CGO_ENABLED=0 go build -trimpath -o ../build/perf/fakenode ./perf/fakenode)
          (cd test && CGO_ENABLED=0 go build -trimpath -o ../build/perf/loadgen ./perf/loadgen)
          sudo --preserve-env=GITHUB_STEP_SUMMARY sh -c 'ulimit -n 16384 && exec python3 tools/perf/ne_mem.py \
            --ne-mem target/release/ne-mem --fakenode build/perf/fakenode --loadgen build/perf/loadgen \
            --workers 1 --variant cap --variant mobile --variant budget \
            --out ne-mem-linux.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.scope.outputs.memory == 'true'
        with:
          name: ne-mem-linux
          path: |
            ne-mem-linux.json
            ne-mem-*.log
          if-no-files-found: ignore
      # Where the heap goes (#388): ne-mem with dhat's allocator and line
      # tables, once with only the downloads (dhat's snapshot is at the
      # heap's peak), once with 500 connections, and once with the sessions
      # capped at 16 (do the DNS burst's upstream connections count?);
      # tools/perf/dhat_top.py sums each up into the step summary.
      - name: Memory profile (dhat)
        if: steps.scope.outputs.memory == 'true'
        timeout-minutes: 40
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          cargo build --release --locked -p ppvpn-core-lab --bin ne-mem --features ppvpn-core/lab,ppvpn-core-lab/dhat
          mkdir -p build/dhat
          for run in "downloads default --conns=" "conns500 default --conns=500" \
                     "dns-cap16 cap16 --conns= --no-default --variant cap16 --dns-rate 4000"; do
            set -- $run
            name=$1 variant=$2
            shift 2
            sudo sh -c "ulimit -n 16384 && exec python3 tools/perf/ne_mem.py \
              --ne-mem target/release/ne-mem --fakenode build/perf/fakenode --loadgen build/perf/loadgen \
              --workers 1 $* --dhat build/dhat/$name --out build/dhat/$name.json"
            sudo cp "ne-mem-$variant-w1.log" "build/dhat/$name.log"
            sudo chmod -R a+r build/dhat
            { echo "## dhat: $name (#388)"; echo; python3 tools/perf/dhat_top.py "build/dhat/$name-$variant-w1.json"
              echo; echo "Sessions refused (sail's log): $(grep -c 'refused' "build/dhat/$name.log" || true)"
              python3 -c "import json,sys; r=[r for r in json.load(open(sys.argv[1]))['rows'] if r['label']=='dns'][0]; \
                print(f\"DNS: {r['answered']} of {r['queries']} answered, AnyTLS sessions at most {r['node_sessions_peak']}\")" \
                "build/dhat/$name.json"; } \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.scope.outputs.memory == 'true'
        with:
          name: ne-mem-dhat-linux
          path: build/dhat/
          if-no-files-found: ignore
      - name: Service log
        if: always() && steps.scope.outputs.code == 'true'
        run: sudo tail -n 200 /var/log/ppvpn/ppvpn-service.log || true

  # The desktop on Linux, in one build of the client crate (CARGO_BUILD_TARGET
  # pins the target directory to the one triple the binding scripts use):
  #   - the privileged service (a workspace member, shipped with the
  #     "service" profile; it hosts the TUN engine): tests and clippy;
  #   - the client crate: tests and clippy;
  #   - the Flutter app's Rust (its bridge and the push agent): clippy, and
  #     the agent's tests;
  #   - the desktop scripts: bash -n and their Python tests;
  #   - C# bindings, then App.Core's and the Linux app's tests (.NET 8, no
  #     GTK runtime needed);
  #   - Swift bindings, then the macOS app's AppLogic tests (no AppKit), with
  #     the Swift the macOS app is developed with.
  desktop:
    name: desktop
    # Pinned to the image the Swift toolchain is built for (ubuntu24.04):
    # newer images ship libxml2 with a different soname and swift-test
    # cannot load libxml2.so.2.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      UNIFFI_BINDGEN_CS_TAG: v0.11.0+v0.31.0
      SWIFT_VERSION: 6.4.0
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.code == 'true'
        with:
          toolchain: 1.98.1
          components: clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.code == 'true'
        with:
          shared-key: desktop
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.code == 'true'
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Test the privileged service
        if: steps.scope.outputs.code == 'true'
        working-directory: crates/service
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test the client crate
        if: steps.scope.outputs.code == 'true'
        working-directory: crates/desktop
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Flutter bridge and push agent
        if: steps.scope.outputs.code == 'true'
        run: |
          cargo test --locked -p ppvpn-push-agent
          cargo clippy --locked -p ppvpn-flutter -p ppvpn-push-agent --all-targets -- -D warnings
      # The mobile tunnel host (#448) on Linux: its C functions, socket and
      # host with an engine that is never started. Its iOS build is the
      # tunnel job's.
      - name: Tunnel host
        if: steps.scope.outputs.code == 'true'
        run: |
          cargo test --locked -p ppvpn-tunnel-host
          cargo clippy --locked -p ppvpn-tunnel-host --all-targets -- -D warnings
      - name: Check scripts
        if: steps.scope.outputs.code == 'true'
        run: |
          bash -n tools/desktop/*.sh tools/desktop/ci/*.sh
          python3 -m unittest discover -s tools/desktop/ci -p '*_test.py' -v
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.scope.outputs.code == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Cache uniffi-bindgen-cs
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}
      # Either cache (this one or rust-cache, which keeps ~/.cargo/bin) may
      # have restored the binary: install only when it is missing or of
      # another version, and then over whatever is there. Not for the target
      # triple the job builds: a host tool.
      - name: Install uniffi-bindgen-cs
        if: steps.scope.outputs.code == 'true'
        run: |
          if ! uniffi-bindgen-cs --version 2>/dev/null | grep -qF "${UNIFFI_BINDGEN_CS_TAG#v}"; then
            env -u CARGO_BUILD_TARGET cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG" uniffi-bindgen-cs --force
          fi
      - name: Generate C# bindings
        if: steps.scope.outputs.code == 'true'
        run: crates/desktop/scripts/build-dotnet.sh x86_64-unknown-linux-gnu
      - name: Test App.Core
        if: steps.scope.outputs.code == 'true'
        run: dotnet test apps/dotnet-shared/PPVPN.App.Core.Tests
      - name: Test the Linux app
        if: steps.scope.outputs.code == 'true'
        run: dotnet test apps/linux/PPVPN.Linux.Tests
      # swift.org's toolchain for the runner's Ubuntu, its signature checked
      # against swift.org's keys. Not cached: about 1 GB of the repository's
      # 10 GB, for about a minute of download.
      - name: Install Swift
        if: steps.scope.outputs.code == 'true'
        run: |
          set -euo pipefail
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libedit2 libncurses-dev \
            libpython3-dev libsqlite3-0 libxml2-dev libz3-dev
          dir="$RUNNER_TEMP/swift"
          if [ ! -x "$dir/usr/bin/swift" ]; then
            name="swift-$SWIFT_VERSION-RELEASE-ubuntu24.04"
            url="https://download.swift.org/swift-$SWIFT_VERSION-release/ubuntu2404/swift-$SWIFT_VERSION-RELEASE/$name.tar.gz"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/swift.tar.gz" "$url"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/swift.tar.gz.sig" "$url.sig"
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            install -d -m 700 "$GNUPGHOME"
            curl -fsSL --retry 3 --compressed https://www.swift.org/keys/all-keys.asc | gpg --batch --import
            gpg --batch --verify "$RUNNER_TEMP/swift.tar.gz.sig" "$RUNNER_TEMP/swift.tar.gz"
            mkdir -p "$dir"
            tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$dir" --strip-components=1
          fi
          echo "$dir/usr/bin" >> "$GITHUB_PATH"
      - name: Build the Swift bindings
        if: steps.scope.outputs.code == 'true'
        run: apps/macos/scripts/build-swift-linux.sh
      - name: Test AppLogic
        if: steps.scope.outputs.code == 'true'
        run: swift test --package-path apps/macos/AppLogic

  # macOS, for what Linux cannot cover (L1 and L2 run once, on Linux):
  #   - clippy over the whole workspace for aarch64-apple-darwin, so that
  #     every cfg'd macOS path compiles. Not again for x86_64 (#459): no
  #     code of ours is cfg'd by architecture, and the build scripts need
  #     the Apple SDK (oslog's C includes <os/log.h>), so it cannot move to
  #     Linux either. Only btls-sys is checked for x86_64-apple-darwin, that
  #     it takes the prebuilt BoringSSL (Desktop ships an Intel package, the
  #     one target btls's own CI does not use); release.yml links it;
  #   - the macOS-only tests, by filter (docs/testing.md, "Platform tests").
  # Not the native app's build (#459): the Flutter app replaced it, and the
  # upgrade from it is tested with its last release (0.6.4).
  macos:
    name: macos
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.code == 'true'
        with:
          toolchain: 1.98.1
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.memory == 'true'
        with:
          go-version-file: test/go.mod
          cache: false
      # test/go.mod's modules from the cache, offline on a hit (#459).
      - uses: ./.github/actions/go-modules
        if: steps.scope.outputs.memory == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.code == 'true'
        with:
          shared-key: macos
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.code == 'true'
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - name: clippy
        if: steps.scope.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: btls-sys, x86_64
        if: steps.scope.outputs.code == 'true'
        run: cargo check --locked -p btls-sys --target x86_64-apple-darwin
      # btls-sys's build script points the linker at the downloaded library
      # (BORING_BSSL_PATH_<target>/lib), and no BoringSSL build tree exists.
      - name: x86_64, the prebuilt BoringSSL is the one linked
        if: steps.scope.outputs.code == 'true'
        run: |
          target=x86_64-apple-darwin
          prebuilt="$BORING_BSSL_PATH_x86_64_apple_darwin"
          test -n "$prebuilt" && test -f "$prebuilt/lib/libssl.a"
          out=$(ls target/$target/debug/build/btls-sys-*/output)
          grep -H "rustc-link-search=native=$prebuilt/lib" $out
          if find target/$target/debug/build -path '*btls-sys-*/out/build' -maxdepth 4 | grep -q .; then
            echo "::error::btls-sys compiled BoringSSL instead of linking the prebuilt one"; exit 1
          fi
          for f in "$prebuilt/lib/libssl.a" "$prebuilt/lib/libcrypto.a"; do
            echo "$f: $(lipo -archs "$f")"
            lipo "$f" -verify_arch x86_64
          done
      # The macOS-only tests, built by one cargo invocation and run from
      # their binaries (tools/test-binary.py), each with its own filters, in
      # its package's directory as cargo test would. One cargo test per
      # package resolved other features each time (tokio's, serde_json's,
      # log's), and each rebuilt sail: after a sail upgrade (no cache) the
      # first three took 27 minutes and the fourth did not end in 30. The
      # Keychain store against the runner's login keychain has its own
      # timeout: a keychain prompt would wait for a person.
      - name: macOS tests
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 50
        run: |
          mkdir -p build
          cargo test --locked --no-run --message-format=json \
            -p ppvpn-core -p ppvpn-cli -p ppvpn-desktop -p ppvpn-service \
            --lib --bin ppvpn-service --test keystore > build/macos-tests.json
          bin() { python3 tools/test-binary.py "$PWD/build/macos-tests.json" "$1"; }
          core=$(bin ppvpn_core) cli=$(bin ppvpn_cli) desktop=$(bin ppvpn_client) service=$(bin ppvpn-service)
          (cd crates/core && "$core" hostipv6::darwin localdns::source probe::icmp runtime::sail_tests)
          (cd crates/cli && "$cli" identity)
          (cd crates/desktop && "$desktop" detect service sysproxy)
          (cd crates/service && PPVPN_TEST_CODESIGN=1 "$service" macsign)
      - name: macOS tests, the Keychain
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 5
        run: |
          keystore=$(python3 tools/test-binary.py build/macos-tests.json keystore)
          cd crates/cli && PPVPN_TEST_KEYSTORE=1 "$keystore" --nocapture
      # Memory in the iOS extension's shape (#388): ne-mem in release (lab:
      # the variants' sail settings), the perf fake node and load generator,
      # tools/perf/ne_mem.py as root (sail opens the TUN; only 203.0.113.0/24
      # is routed into it). Only when the
      # harness or Cargo.lock (a sail upgrade) changed: scope memory.
      - name: Memory, the extension's shape
        if: steps.scope.outputs.memory == 'true'
        timeout-minutes: 40
        run: |
          cargo build --release --locked -p ppvpn-core-lab --bin ne-mem --features ppvpn-core/lab
          mkdir -p build/perf
          (cd test && CGO_ENABLED=0 go build -trimpath -o ../build/perf/fakenode ./perf/fakenode)
          (cd test && CGO_ENABLED=0 go build -trimpath -o ../build/perf/loadgen ./perf/loadgen)
          sudo --preserve-env=GITHUB_STEP_SUMMARY sh -c 'ulimit -n 16384 && exec python3 tools/perf/ne_mem.py \
            --ne-mem target/release/ne-mem --fakenode build/perf/fakenode --loadgen build/perf/loadgen \
            --workers 1 --variant cap --variant mobile --variant budget \
            --out ne-mem-macos.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.scope.outputs.memory == 'true'
        with:
          name: ne-mem-macos
          path: |
            ne-mem-macos.json
            ne-mem-*.log
          if-no-files-found: ignore

  # Windows (MSVC, what the desktop links), for what Linux cannot cover:
  #   - clippy over the crates the desktop links (ppvpn-cli ships for Linux
  #     and macOS only) and the Flutter app's Rust (its bridge and the push
  #     agent), so that every cfg'd Windows path compiles;
  #   - the Windows-only tests, by filter (docs/testing.md, "Platform
  #     tests"), then L3 on Windows (G7): a failing instance leaves the
  #     system as it was while the host lives on (runtime::windows_tests):
  #     our MSVC build of sail, with a TUN, auto_route and strict_route
  #     (198.18.0.0/16 alone, the runner's own traffic stays out), failed by
  #     a fault the test arms (the test build's fault-injection feature,
  #     never a release's). The runner is administrator; wintun.dll, sail's
  #     pinned one, goes beside the test;
  #   - the client's C# bindings and App.Core's tests. Not the native app's
  #     or its push agent's builds (#459): the Flutter app replaced them, and
  #     the upgrade from them is tested with their last release (0.6.4).
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      # bindgen's libclang (btls-sys), from the runner's LLVM: still needed
      # with the prebuilt BoringSSL (NASM and CMake are not).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Runs of the failure tests, the system compared before and after
      # each: one per pull request, `runs` by hand (5 unless told; twenty
      # on the pull request that adds a test there).
      RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || 1 }}
      UNIFFI_BINDGEN_CS_TAG: v0.11.0+v0.31.0
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git checks text out with CRLF; fixtures compared byte
      # for byte (localdns/testdata) must stay as committed.
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.code == 'true'
        with:
          toolchain: 1.98.1
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.code == 'true'
        with:
          shared-key: windows
          save-if: false
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.code == 'true'
        with:
          targets: x86_64-pc-windows-msvc
      - name: clippy
        if: steps.scope.outputs.code == 'true'
        run: |
          cargo clippy -p ppvpn-core -p ppvpn-account -p ppvpn-desktop -p ppvpn-engine-host -p ppvpn-service \
            -p ppvpn-flutter -p ppvpn-push-agent --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Windows tests
        if: steps.scope.outputs.code == 'true'
        run: |
          cargo test -p ppvpn-core --lib --locked --target x86_64-pc-windows-msvc -- hostipv6::windows localdns::source probe::icmp
          cargo test -p ppvpn-desktop --lib --locked --target x86_64-pc-windows-msvc -- detect service sysproxy
          cargo test -p ppvpn-push-agent --locked --target x86_64-pc-windows-msvc
      - name: L3, build the failure tests
        if: steps.scope.outputs.code == 'true'
        run: cargo test -p ppvpn-core --lib --features fault-injection --locked --target x86_64-pc-windows-msvc --no-run
      - name: L3, the runtime's failures (administrator)
        if: steps.scope.outputs.code == 'true'
        shell: pwsh
        env:
          WINTUN_VERSION: 0.14.1
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:WINTUN_SHA256) { throw "wintun zip: not the pinned hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\wintun"
          $deps = "target\x86_64-pc-windows-msvc\debug\deps"
          New-Item -ItemType Directory -Force $deps | Out-Null
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" $deps
          foreach ($i in 1..[int]$env:RUNS) {
            Write-Output "::group::run $i"
            cargo test -p ppvpn-core --lib --features fault-injection --locked --target x86_64-pc-windows-msvc -- --ignored --test-threads 1 --nocapture runtime::windows_tests:: | Tee-Object -Variable out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # None skipped quietly: all three tests ran.
            if (-not ($out -match "test result: ok\. 3 passed")) { throw "runtime::windows_tests: not all three tests ran" }
            Write-Output "::endgroup::"
          }

      # The C# bindings and App.Core: only when the desktop or what it
      # builds from changed. Debug bindings, as the engine's tests build.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.scope.outputs.desktop == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Cache uniffi-bindgen-cs
        if: steps.scope.outputs.desktop == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ runner.os }}
      # build-dotnet.ps1 refuses any other version of the generator.
      - name: Install uniffi-bindgen-cs
        if: steps.scope.outputs.desktop == 'true'
        run: |
          if ! uniffi-bindgen-cs --version 2>/dev/null | grep -qF "${UNIFFI_BINDGEN_CS_TAG#v}"; then
            cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG" uniffi-bindgen-cs --force
          fi
      - name: Generate C# bindings
        if: steps.scope.outputs.desktop == 'true'
        shell: powershell
        run: crates/desktop/scripts/build-dotnet.ps1
      - name: Test App.Core
        if: steps.scope.outputs.desktop == 'true'
        shell: powershell
        run: |
          dotnet test apps/dotnet-shared/PPVPN.App.Core.Tests
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed" }

  # The Flutter desktop prototype (#387), on the three desktop platforms:
  # apps/flutter/scripts/ci-build.sh (platform runner, bridge codegen,
  # analysis, the Rust library and the app in release), then smoke.sh (still
  # running after 20 s, a screenshot, resident memory, bundle sizes; Linux
  # in Xvfb without a GPU); on Windows also the installer, installed over
  # the native app and uninstalled. Only when the app or what it builds from
  # changed (tools/ci-changes.sh `flutter`). Its Rust cache (key flutter,
  # one per runner OS) is release.yml's cache-flutter-*: the codegen's cargo
  # expand, the release library and what the later steps build.
  flutter:
    name: flutter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      FRB_CODEGEN_VERSION: 2.13.0
    defaults:
      run:
        shell: bash
    steps:
      - name: LF checkout
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.flutter == 'true'
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.flutter == 'true'
        with:
          shared-key: flutter
          save-if: false
      # bindgen's libclang (btls-sys) on Windows, as in the windows job.
      - name: libclang
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'windows-latest'
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - id: target
        if: steps.scope.outputs.flutter == 'true'
        run: |
          echo "triple=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.flutter == 'true'
        with:
          targets: ${{ steps.target.outputs.triple }}
      - name: Linux build dependencies
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev xvfb imagemagick libgl1-mesa-dri mesa-vulkan-drivers \
            gsettings-desktop-schemas dconf-gsettings-backend dconf-service
      - uses: ./.github/actions/flutter-toolchain
        if: steps.scope.outputs.flutter == 'true'
        with:
          frb-codegen-version: ${{ env.FRB_CODEGEN_VERSION }}
      # flutter analyze on Linux only (#459): the Dart is the same on every
      # platform.
      - id: build
        name: Build
        if: steps.scope.outputs.flutter == 'true'
        env:
          PPVPN_SKIP_ANALYZE: ${{ matrix.os != 'ubuntu-latest' && '1' || '' }}
        run: apps/flutter/scripts/ci-build.sh
      # The Linux bundle, for the 24 h curve on the test machine (built here,
      # never there: apps/flutter/scripts/longcurve).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'ubuntu-latest'
        with:
          name: flutter-bundle-linux
          path: ${{ steps.build.outputs.bundle }}
          retention-days: 14
      # The signed-in flow end to end (#401 step 1): mock backend, fakenode,
      # the app's integration test. The fakenode is test/go.mod's.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.flutter == 'true'
        with:
          go-version-file: test/go.mod
          cache: false
      # test/go.mod's modules from the cache, offline on a hit (#459).
      - uses: ./.github/actions/go-modules
        if: steps.scope.outputs.flutter == 'true'
      - name: End to end, signed in
        if: steps.scope.outputs.flutter == 'true'
        timeout-minutes: 20
        run: |
          if [ "${{ matrix.os }}" = ubuntu-latest ]; then
            xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- apps/flutter/e2e/run.sh
          else
            apps/flutter/e2e/run.sh
          fi
      - name: Smoke test
        if: steps.scope.outputs.flutter == 'true'
        run: |
          if [ "${{ matrix.os }}" = ubuntu-latest ]; then
            xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- \
              apps/flutter/scripts/smoke.sh "${{ steps.build.outputs.bundle }}" "$RUNNER_TEMP/flutter-out"
          else
            apps/flutter/scripts/smoke.sh "${{ steps.build.outputs.bundle }}" "$RUNNER_TEMP/flutter-out"
          fi
          { echo '```'; cat "$RUNNER_TEMP/flutter-out/results.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The macOS packaging (#401 step 5, scripts/package-macos.sh), as the
      # native release's: the Swift push agent, its client framework, the
      # LaunchAgent and the service helpers in the bundle, inside-out
      # signing (ad-hoc here), the DMG, the .pkg and release-meta. The
      # runner's slice only (arm64), with the client and the helpers in
      # debug: the packaging is what is checked, and debug builds the
      # quickest. Then the shipped app as the .pkg holds it. Nothing uploaded.
      - name: Package (macOS)
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'macos-15'
        timeout-minutes: 45
        env:
          PPVPN_APPLE_TARGETS: aarch64-apple-darwin
        run: |
          triple=aarch64-apple-darwin
          command -v xcodegen >/dev/null || brew install xcodegen
          apps/macos/scripts/bootstrap.sh
          cargo build --locked -p ppvpn-service --bins --target "$triple"
          mkdir -p build/binaries
          for bin in ppvpn-service ppvpn-service-install ppvpn-service-uninstall; do
            install -m 755 "target/$triple/debug/$bin" "build/binaries/$bin-$triple"
          done
          # Sign with a throwaway self-signed identity, not ad hoc: the path
          # of package-app.sh without a Team ID (pinned designated
          # requirements). Releases sign with our Developer ID and notarize
          # (#471), which needs the release environment's secrets.
          key_dir="$RUNNER_TEMP/ci-signing"
          mkdir -p "$key_dir"
          printf '%s\n' '[req]' 'distinguished_name=dn' 'x509_extensions=ext' 'prompt=no' \
            '[dn]' 'CN=PPVPN CI Signing' \
            '[ext]' 'basicConstraints=critical,CA:false' 'keyUsage=critical,digitalSignature' \
            'extendedKeyUsage=critical,codeSigning' > "$key_dir/req.cnf"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config "$key_dir/req.cnf" \
            -keyout "$key_dir/key.pem" -out "$key_dir/cert.pem" 2>/dev/null
          /usr/bin/openssl pkcs12 -export -inkey "$key_dir/key.pem" -in "$key_dir/cert.pem" \
            -out "$key_dir/id.p12" -passout pass:ci
          keychain="$key_dir/ci.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$key_dir/id.p12" -k "$keychain" -P ci -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$keychain" >/dev/null
          keychains=("$keychain")
          while IFS= read -r line; do keychains+=("$(echo "$line" | tr -d ' "')"); done \
            < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          PPVPN_CODESIGN_IDENTITY="PPVPN CI Signing" \
            SKIP_BOOTSTRAP=1 apps/flutter/scripts/package-macos.sh "${{ steps.build.outputs.bundle }}" arm64
          ls -l dist/macos
          python3 - dist/macos/release-meta-macos-arm64.json <<'PY'
          import hashlib, json, os, sys
          meta = json.load(open(sys.argv[1]))
          keys = {"schema", "platform", "channel", "version", "build", "file", "length", "sha256",
                  "ed_signature", "install_file", "install_length", "install_sha256", "min_os",
                  "published_at"}
          assert set(meta) == keys, sorted(set(meta) ^ keys)
          assert meta["platform"] == "macos-arm64" and meta["min_os"] == "13.0", meta
          base = os.path.dirname(sys.argv[1])
          for file, length, sha in (("file", "length", "sha256"),
                                    ("install_file", "install_length", "install_sha256")):
              data = open(os.path.join(base, meta[file]), "rb").read()
              assert len(data) == meta[length] and hashlib.sha256(data).hexdigest() == meta[sha], file
          print(json.dumps(meta, indent=2))
          PY
          hdiutil verify dist/macos/PPVPN-*-macos-arm64.dmg
          pkg="$RUNNER_TEMP/flutter-pkg"
          pkgutil --expand-full dist/macos/PPVPN-*-macos-arm64.pkg "$pkg"
          grep -q 'identifier="com.peakpassvpn.ppvpn.desktop.pkg"' "$pkg/PackageInfo"
          cmp apps/macos/packaging/postinstall "$pkg/Scripts/postinstall"
          app="$pkg/Payload/PPVPN.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -qx 'Authority=PPVPN CI Signing'
          codesign -d --entitlements - --xml "$app" | grep -q 'com.apple.security.cs.disable-library-validation'
          ls -R "$app/Contents/Library" "$app/Contents/MacOS"
      # Enhanced mode end to end on Linux (#401 step 2): the release bundle
      # in the packages' layout (/usr/lib/ppvpn/ppvpn, the only client the
      # service accepts) with the service built in its shipping profile (LTO
      # off, as on Windows) and installed by its own helper, then stopped: e2e/linux_enhanced.sh runs
      # it inside test/netns/run.sh's namespace, with a mock backend, a saved
      # sign-in and test/fakenode, and checks the TUN, the rules and table,
      # traffic through the node and the cleanup after a disconnect. Removed
      # again afterwards: the native app's deb goes to /usr/lib/ppvpn next.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'ubuntu-latest'
        with:
          go-version-file: test/go.mod
          cache: false
      # test/go.mod's modules from the cache, offline on a hit (#459).
      - uses: ./.github/actions/go-modules
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'ubuntu-latest'
      - name: Enhanced mode end to end (Linux)
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        # The shipping profile without LTO, as on Windows (#459): the release
        # builds with it.
        env:
          CARGO_PROFILE_SERVICE_LTO: 'false'
          CARGO_PROFILE_SERVICE_CODEGEN_UNITS: '16'
        run: |
          cargo build --locked -p ppvpn-service --profile service --bins
          make test-tools
          sudo apps/flutter/scripts/install-linux-layout.sh "${{ steps.build.outputs.bundle }}" target/service
          trap 'sudo /usr/lib/ppvpn/ppvpn-service-uninstall || true; sudo rm -rf /usr/lib/ppvpn' EXIT
          sudo /usr/lib/ppvpn/ppvpn-service-install
          sudo systemctl disable --now ppvpn-service
          sudo NETNS_TIMEOUT=300 test/netns/run.sh --script apps/flutter/e2e/linux_enhanced.sh \
            "$PWD/build/test-tools/fakenode"
      # The native app's last release (0.6.4), which 0.6.x users upgrade
      # from: the deb's in-place upgrade below and the Windows installer's
      # stage A.
      - id: native
        name: Fetch the native app
        if: steps.scope.outputs.flutter == 'true' && matrix.os != 'macos-15'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/flutter/scripts/native.sh v0.6.4 "$RUNNER_TEMP/native"
      # The deb and rpm (#401 step 5, apps/flutter/scripts/package-linux.sh),
      # each installed alone in a fresh container by package-smoke.sh: the
      # layout, every library resolved from the package's dependencies, one
      # start on Xvfb, the removal; the deb then upgrades the native package
      # fetched above in place. Built on this runner, so the glibc floor is
      # only reported (the release builds on Ubuntu 22.04).
      - name: Linux packages
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        env:
          NFPM_VERSION: '2.47.0'
          PPVPN_GLIBC_FLOOR: ''
          PPVPN_DIST_DIR: ${{ runner.temp }}/flutter-pkg
          NATIVE_DEB: ${{ steps.native.outputs.installer }}
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          apps/flutter/scripts/package-linux.sh "${{ steps.build.outputs.bundle }}"
          cat "$PPVPN_DIST_DIR"/release-meta-linux-*.json
          native=()
          if [ -n "$NATIVE_DEB" ]; then
            native=(-v "$(dirname "$NATIVE_DEB"):/native:ro")
          fi
          smoke() {
            docker run --rm -v "$PWD:/src:ro" -v "$PPVPN_DIST_DIR:/pkg:ro" "${native[@]}" -w /src "$1" \
              bash apps/flutter/scripts/package-smoke.sh "${@:2}"
          }
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          smoke ubuntu:24.04 "/pkg/PPVPN-$version-linux-x64.deb" ${NATIVE_DEB:+"/native/$(basename "$NATIVE_DEB")"}
          smoke fedora:latest "/pkg/PPVPN-$version-linux-x64.rpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'ubuntu-latest'
        with:
          name: flutter-packages-linux
          path: ${{ runner.temp }}/flutter-pkg
          retention-days: 7
      # The Windows installer (#401 step 5): package-windows.ps1 packages
      # the release bundle with the native app's installer script
      # (apps/windows/installer/ppvpn.nsi), unsigned, as release.yml's
      # windows job will; the service in its shipping profile without LTO,
      # to keep the job short. smoke-installer.ps1 then installs it over the
      # native app 0.6.4 (fetched above), checks the
      # installation, has the app quit on the installer's quit event and
      # uninstalls it with /PURGE.
      - name: Ensure NSIS
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed" }
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          & $makensis /VERSION
      - name: Installer (Windows)
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'windows-latest'
        shell: powershell
        env:
          CARGO_PROFILE_SERVICE_LTO: 'false'
          CARGO_PROFILE_SERVICE_CODEGEN_UNITS: '16'
        run: apps/flutter/scripts/package-windows.ps1
      # With stage A of the acceptance (#401): the native 0.6.4 app's signed-in
      # state across the upgrade, a rollback and the upgrade again; the native
      # installer is required for it.
      - name: Installer smoke test (Windows)
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'windows-latest'
        timeout-minutes: 30
        run: |
          set -- -Installer "$(cygpath -w "$(ls dist/windows/*-setup.exe)")"
          native="${{ steps.native.outputs.installer }}"
          [ -n "$native" ] || { echo "::error::no native installer (Fetch the native app): stage A needs it"; exit 1; }
          set -- "$@" -Native "$(cygpath -w "$native")"
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/flutter/scripts/smoke-installer.ps1 "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.scope.outputs.flutter == 'true' && matrix.os == 'windows-latest'
        with:
          name: flutter-installer-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/windows/*-setup.exe
            dist/windows/release-meta-windows-x64.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.scope.outputs.flutter == 'true'
        with:
          name: flutter-${{ matrix.os }}
          path: ${{ runner.temp }}/flutter-out
          if-no-files-found: ignore

  android:
    # The Flutter app's Android target (#448 step 3): the bridge for arm64
    # and x86_64 (the NDK's clang), the APK, and the app started on an
    # emulator. No tunnel yet (#448 steps 2 and 3).
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FRB_CODEGEN_VERSION: 2.13.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.flutter == 'true'
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.flutter == 'true'
        with:
          shared-key: android
          save-if: false
      # The host's for the bridge codegen, which reads the crate.
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.flutter == 'true'
        with:
          targets: x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
      - uses: ./.github/actions/flutter-toolchain
        if: steps.scope.outputs.flutter == 'true'
        with:
          frb-codegen-version: ${{ env.FRB_CODEGEN_VERSION }}
      - id: build
        name: Build
        if: steps.scope.outputs.flutter == 'true'
        env:
          FLUTTER_TARGET: android
          PPVPN_SKIP_ANALYZE: '1'
        run: |
          # The runner's JDK 17 (for the emulator's step too) and newest NDK.
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          apps/flutter/scripts/ci-build.sh
          ls -l "${{ github.workspace }}/apps/flutter/build/app/outputs/flutter-apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.scope.outputs.flutter == 'true'
        with:
          name: flutter-apk-android
          path: ${{ steps.build.outputs.bundle }}
          if-no-files-found: error
          retention-days: 14
      # Hardware acceleration for the emulator.
      - name: KVM
        if: steps.scope.outputs.flutter == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The system image (checksummed) and the rest, installed by
      # .github/actions/android-sdk, which fails on an incomplete one instead
      # of booting without it.
      - uses: ./.github/actions/android-sdk
        if: steps.scope.outputs.flutter == 'true'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
      # A tablet: in landscape (1280 dp across, the desktop layout), then set
      # to a phone's screen in portrait (the phone layout, #448 step 5).
      - name: Smoke test (emulator)
        if: steps.scope.outputs.flutter == 'true'
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: apps/flutter/e2e/android_smoke.sh

  ios:
    # The Flutter app's iOS target (#448): the bridge as a static library
    # for Apple silicon's simulator (BoringSSL built from source: btls has
    # no iOS prebuilts), the app (debug, unsigned), and the app started on
    # an iPhone simulator. No packet tunnel yet (#448 step 2). Its Rust
    # cache (key ios) is release.yml's cache-ios: the codegen's cargo
    # expand, BoringSSL and the bridge for the simulator.
    name: ios
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FRB_CODEGEN_VERSION: 2.13.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.flutter == 'true'
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.flutter == 'true'
        with:
          shared-key: ios
          save-if: false
      # The host's for the bridge codegen, which reads the crate.
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.flutter == 'true'
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/flutter-toolchain
        if: steps.scope.outputs.flutter == 'true'
        with:
          frb-codegen-version: ${{ env.FRB_CODEGEN_VERSION }}
      - id: build
        name: Build
        if: steps.scope.outputs.flutter == 'true'
        env:
          FLUTTER_TARGET: ios
          IOS_SDK: simulator
          PPVPN_SKIP_ANALYZE: '1'
        run: apps/flutter/scripts/ci-build.sh
      - name: Smoke test (simulator)
        if: steps.scope.outputs.flutter == 'true'
        timeout-minutes: 30
        run: apps/flutter/e2e/ios_smoke.sh

  tunnel:
    # The mobile tunnel host for the iOS packet tunnel extension (#448):
    # crates/tunnel-host/scripts/build-xcframework.sh, the device slice only
    # (a network extension never runs in the simulator; the full
    # XCFramework is built for TestFlight in release.yml). ~25 min cold:
    # sail and BoringSSL from source, profile mobile. Only when the tunnel
    # host or what iOS alone compiles changed (tools/ci-changes.sh
    # `tunnel`): macOS runners are few. Uncached: the 10 GB cache budget
    # has no room for it yet.
    name: tunnel (ios)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.tunnel == 'true'
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios
      - name: Build the XCFramework
        if: steps.scope.outputs.tunnel == 'true'
        run: crates/tunnel-host/scripts/build-xcframework.sh "$RUNNER_TEMP/tunnel" ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.scope.outputs.tunnel == 'true'
        with:
          name: tunnel-ios
          path: |
            ${{ runner.temp }}/tunnel/PPVPNTunnel.xcframework
            ${{ runner.temp }}/tunnel/PPVPNTunnel.ldflags
          if-no-files-found: error
          retention-days: 14
