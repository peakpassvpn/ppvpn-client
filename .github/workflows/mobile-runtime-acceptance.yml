name: Frozen mobile runtime acceptance
on:
  push:
    branches: [codex/apple-single-core-build-matrix]
    paths: [.github/workflows/mobile-runtime-acceptance.yml]
  workflow_dispatch:
    inputs:
      reuse_runtime_pin_json:
        description: Optional exact completed native APK pin for an instrumented Android retry
        required: false
      acceptance_ref:
        description: Separate full commit for Android acceptance scripts only
        required: false
      build_number:
        description: Release counter for both the native libraries and runtime APK
        default: '344'
        required: true
      platform:
        description: Select the platform without rebuilding unrelated targets
        type: choice
        options: [both, android, ios]
        default: both
      api_origin:
        description: Explicit authorized HTTPS origin; empty uses repository configuration
        required: false
      source_ref:
        description: Exact product source commit
        required: true
permissions:
  contents: read
concurrency:
  group: frozen-mobile-runtime-${{ github.ref }}-${{ inputs.reuse_runtime_pin_json != '' && 'replay' || 'native' }}
  cancel-in-progress: false
jobs:
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'ios' && inputs.reuse_runtime_pin_json == ''
    # The Flutter app's Android target (#448 step 3): the bridge and the
    # tunnel host for arm64 and x86_64 (the NDK's clang), the APK (signed
    # with the debug key until the Play upload key exists: the artifact
    # installs on a phone as is), and on an emulator the app started and
    # its VPN brought up (TunnelService, the host serving tunnel.sock).
    # When the app or the tunnel host changed (tools/ci-changes.sh
    # `android`).
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FRB_CODEGEN_VERSION: 2.13.0
      PPVPN_BUILD_NUMBER: ${{ inputs.build_number || '344' }}
      # The backend the app is built for (#517): the GitHub variable, as
      # release.yml's; ci-build.sh fails without it.
      PPVPN_API_BASE_DEFAULT: ${{ inputs.api_origin || vars.PPVPN_API_BASE }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo android=true >> "$GITHUB_OUTPUT"
          echo flutter=true >> "$GITHUB_OUTPUT"
      # Room on the runner's disk: the bridge and the tunnel host for two
      # ABIs (sail and BoringSSL in each), Gradle's build and the emulator's
      # image filled it (run 41183704847, "No space left on device"). The
      # preinstalled toolchains this job never uses go first: .NET, Haskell,
      # Swift, PowerShell, CodeQL's bundle (not the Android SDK or Java).
      - name: Free disk space
        if: steps.scope.outputs.android == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.android == 'true'
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.android == 'true'
        # A restore that hangs ends as a cache miss (see env).
        timeout-minutes: 10
        continue-on-error: true
        with:
          prefix-key: v1-rust
          shared-key: flutter
          save-if: false
      # The host's for the bridge codegen, which reads the crate.
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.android == 'true'
        with:
          targets: x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
      - uses: ./.github/actions/flutter-toolchain
        if: steps.scope.outputs.android == 'true'
        with:
          frb-codegen-version: ${{ env.FRB_CODEGEN_VERSION }}
      - id: build
        name: Build
        if: steps.scope.outputs.android == 'true'
        env:
          FLUTTER_TARGET: android
          PPVPN_SKIP_ANALYZE: '1'
        run: |
          # The runner's JDK 17 (for the emulator's step too) and newest NDK.
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          apps/flutter/scripts/ci-build.sh
          ls -l "${{ github.workspace }}/apps/flutter/build/app/outputs/flutter-apk"
      - name: Native tunnel lifecycle
        if: steps.scope.outputs.android == 'true'
        run: apps/flutter/scripts/test-android-tunnel.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        if: steps.scope.outputs.android == 'true'
        with:
          name: flutter-apk-android
          path: ${{ steps.build.outputs.bundle }}
          if-no-files-found: error
          retention-days: 14
      # What the build left, beside what the emulator needs next.
      - name: Disk after the build
        if: always() && steps.scope.outputs.android == 'true'
        run: df -h /
      # The emulator needs about 7.4 GB for its userdata partition, after
      # the system image: with the build's 11 GB left it found 5.9 GB and
      # did not start (job 124572523884). Cargo's target directory is done
      # with by now (ci-build.sh copied the libraries into jniLibs, which the
      # smoke test's debug APK packs); Gradle's caches stay for that build.
      - name: Free the Rust build's disk
        if: steps.scope.outputs.android == 'true'
        run: |
          du -sh target 2>/dev/null || true
          rm -rf target
          df -h /
      # Hardware acceleration for the emulator.
      - name: KVM
        if: steps.scope.outputs.android == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The system image (checksummed) and the rest, installed by
      # .github/actions/android-sdk, which fails on an incomplete one instead
      # of booting without it.
      - uses: ./.github/actions/android-sdk
        if: steps.scope.outputs.android == 'true'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.android == 'true'
        with:
          go-version-file: test/go.mod
          cache: false
      - uses: ./.github/actions/go-modules
        if: steps.scope.outputs.android == 'true'
      # Forwarding requires the fresh emulator before smoke installs the app.
      # A tablet: in landscape (1280 dp across, the desktop layout), then set
      # to a phone's screen in portrait (the phone layout, #448 step 5).
      - name: Real forwarding and smoke tests (emulator)
        if: steps.scope.outputs.android == 'true'
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            ANDROID_SERIAL=emulator-5554 apps/flutter/e2e/android_forwarding.sh
            apps/flutter/e2e/android_smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.scope.outputs.android == 'true'
        timeout-minutes: 10
        with:
          name: android-real-forwarding
          path: apps/flutter/build/android-forwarding
          if-no-files-found: ignore
          retention-days: 14
      # A failed smoke test's evidence: each leg's flutter test report (JSON
      # events) and TunnelService's log lines.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.scope.outputs.android == 'true'
        timeout-minutes: 10
        with:
          name: android-smoke
          path: apps/flutter/build/smoke-*
          if-no-files-found: ignore
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'android' && inputs.reuse_runtime_pin_json == ''
    # The Flutter app's iOS target (#448): the bridge as a static library
    # for Apple silicon's simulator (BoringSSL built from source: btls has
    # no iOS prebuilts), the app (debug, unsigned), and the app started on
    # an iPhone simulator. No packet tunnel yet (#448 step 2). Its Rust
    # cache is the macOS jobs' (key macos, release.yml's cache-macos): with
    # the codegen's cargo expand, BoringSSL and the bridge for the simulator.
    name: ios
    runs-on: macos-15
    timeout-minutes: 150
    env:
      FRB_CODEGEN_VERSION: 2.13.0
      PPVPN_BUILD_NUMBER: ${{ inputs.build_number || '344' }}
      # The backend the app is built for (#517): the GitHub variable, as
      # release.yml's; ci-build.sh fails without it.
      PPVPN_API_BASE_DEFAULT: ${{ inputs.api_origin || vars.PPVPN_API_BASE }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo android=true >> "$GITHUB_OUTPUT"
          echo flutter=true >> "$GITHUB_OUTPUT"
      - name: Public packet provider lifecycle
        if: steps.scope.outputs.flutter == 'true'
        run: python3 apps/flutter/checks/ios_packet_test.py
      - name: Xcode 26
        if: steps.scope.outputs.flutter == 'true'
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)
          [[ -d "$xcode" ]] || { echo "error: no Xcode 26 on the image" >&2; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.scope.outputs.flutter == 'true'
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.flutter == 'true'
        # A restore that hangs ends as a cache miss (see env).
        timeout-minutes: 10
        continue-on-error: true
        with:
          prefix-key: v1-rust
          shared-key: macos
          save-if: false
      # The host's for the bridge codegen, which reads the crate.
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.scope.outputs.flutter == 'true'
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/flutter-toolchain
        if: steps.scope.outputs.flutter == 'true'
        with:
          frb-codegen-version: ${{ env.FRB_CODEGEN_VERSION }}
      - id: build
        name: Build
        if: steps.scope.outputs.flutter == 'true'
        env:
          FLUTTER_TARGET: ios
          IOS_SDK: simulator
          PPVPN_SKIP_ANALYZE: '1'
        run: apps/flutter/scripts/ci-build.sh
      - name: Smoke test (simulator)
        if: steps.scope.outputs.flutter == 'true'
        timeout-minutes: 30
        run: apps/flutter/e2e/ios_smoke.sh


  android_native_reuse:
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'ios' && inputs.reuse_runtime_pin_json != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_REF: ${{ inputs.source_ref }}
      ACCEPTANCE_REF: ${{ inputs.acceptance_ref || github.sha }}
      RUNTIME_PIN_JSON: ${{ inputs.reuse_runtime_pin_json }}
      PPVPN_API_BASE_DEFAULT: ${{ inputs.api_origin || vars.PPVPN_API_BASE }}
      PPVPN_BUILD_NUMBER: ${{ inputs.build_number || '344' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Freeze product and independent test source
        run: |
          set -euo pipefail
          python3 - <<'PY_PIN'
          import json,os,re
          from pathlib import Path
          pin=json.loads(os.environ['RUNTIME_PIN_JSON'])
          assert all(re.fullmatch('[0-9a-f]{40}',os.environ[k]) for k in ('PRODUCT_REF','ACCEPTANCE_REF'))
          assert pin['product_source']==os.environ['PRODUCT_REF']
          assert pin['manifest']['versionCode']==int(os.environ['PPVPN_BUILD_NUMBER'])
          Path(os.environ['RUNNER_TEMP'],'runtime-pin.json').write_text(json.dumps(pin))
          PY_PIN
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/frozen-product"
          git -C "$RUNNER_TEMP/frozen-product" checkout --detach "$PRODUCT_REF"
          [[ -z "$(git -C "$RUNNER_TEMP/frozen-product" status --porcelain)" ]]
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        timeout-minutes: 10
        continue-on-error: true
        with:
          prefix-key: v1-rust
          shared-key: flutter
          save-if: false
      # Host expansion for Dart code generation only; no Android target is built.
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/flutter-toolchain
        with:
          frb-codegen-version: 2.13.0
      - name: Generate the frozen Android runner and verify reused native libraries
        env:
          FLUTTER_TARGET: android
          PPVPN_SKIP_ANALYZE: '1'
          PPVPN_ANDROID_RUNNER_PREPARE_ONLY: '1'
        run: |
          set -euo pipefail
          unset PPVPN_API_BASE PPVPN_FLUTTER_HOME PPVPN_FLUTTER_SAMPLE PPVPN_FLUTTER_SYNTHETIC_TRAFFIC
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          PPVPN_PREPARE_APP_ROOT="$RUNNER_TEMP/frozen-product/apps/flutter" bash apps/flutter/scripts/ci-build.sh
          python3 tools/android/reuse_runtime_apk.py --pin "$RUNNER_TEMP/runtime-pin.json"             --product-root "$RUNNER_TEMP/frozen-product" --origin "$PPVPN_API_BASE_DEFAULT"             --work "$RUNNER_TEMP/verified-native-apk" --output "$RUNNER_TEMP/runtime-reuse.json"
          # Overlay only test/fixture sources, never production Dart/Rust/JNI.
          git archive "$ACCEPTANCE_REF" apps/flutter/e2e/android_forwarding.sh apps/flutter/e2e/android_forwarding apps/flutter/integration_test/android_forwarding_test.dart test/androidnode |
            tar -x -C "$RUNNER_TEMP/frozen-product"
          python3 - <<'PY_SOURCE'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'frozen-product'
          for name in ['test/go.mod','test/go.sum']:
              assert subprocess.check_output(['git','show',os.environ['ACCEPTANCE_REF']+':'+name])==(root/name).read_bytes()
          data={'product_source':os.environ['PRODUCT_REF'],'acceptance_source':os.environ['ACCEPTANCE_REF'],
                'controller_source':os.environ['GITHUB_SHA'],'native_artifact_pin':json.loads(os.environ['RUNTIME_PIN_JSON']),
                'scope':'Native binary identity unchanged; separate instrumented test build and acceptance scripts. No final unified-pin claim unless the original native artifact used that pin.'}
          Path(os.environ['RUNNER_TEMP'],'retry-sources.json').write_text(json.dumps(data,indent=2)+'\n')
          PY_SOURCE
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: test/go.mod
          cache: false
      - uses: ./.github/actions/go-modules
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/android-sdk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
      - name: Strict three-cycle forwarding and revoke on fresh emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ANDROID_SERIAL=emulator-5554 $RUNNER_TEMP/frozen-product/apps/flutter/e2e/android_forwarding.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-native-reuse-forwarding
          path: |
            ${{ runner.temp }}/runtime-reuse.json
            ${{ runner.temp }}/retry-sources.json
            ${{ runner.temp }}/frozen-product/apps/flutter/build/android-forwarding/*.json
            ${{ runner.temp }}/frozen-product/apps/flutter/build/android-forwarding/*.jsonl
            ${{ runner.temp }}/frozen-product/apps/flutter/build/android-forwarding/*.txt
            ${{ runner.temp }}/frozen-product/apps/flutter/build/android-forwarding/*.log
            ${{ runner.temp }}/frozen-product/apps/flutter/build/android-forwarding/evidence
            ${{ runner.temp }}/frozen-product/apps/flutter/build/android-forwarding/rival/rival.apk
          if-no-files-found: warn
          retention-days: 7
