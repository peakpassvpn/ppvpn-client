name: desktop-pages

# The update site, deployed to GitHub Pages: the stable channel's pointer
# and Sparkle feeds (desktop/…) and its apt and dnf repositories (linux/…).
# The whole site is rebuilt from the GitHub Releases on every deployment (a
# Pages deployment replaces the site), so the releases are its only source
# and running this again by hand restores it.
#
# Only the stable channel is deployed. The directory core/ is reserved for
# the core's own pages: when it has any, they must be built here too,
# because the repository has one Pages site.
#
# Called by desktop-release.yml after a stable release is published; by
# hand to rebuild the site as it is.
#
# A rehearsal of the release deploys nothing: the site is built from the
# rehearsal's own files, which are in no release, and kept three days as
# the artifact site-rehearsal for inspection.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      rehearsal:
        description: >-
          Build the site from the calling run's release files instead of the
          published releases, and upload it as a workflow artifact instead
          of deploying it.
        type: boolean
        default: false
      tag:
        description: The release's tag name (rehearsal only)
        type: string
        required: false
      approved:
        description: The calling run already went through the release approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-pages
  cancel-in-progress: false

jobs:
  # A run by hand signs the repositories with the release key, so it goes
  # through the same approval as a release. A call from the release
  # workflow was approved there.
  approve:
    if: ${{ !inputs.approved }}
    runs-on: ubuntu-latest
    environment: desktop-release-approval
    steps:
      - run: echo "approved"

  site:
    if: ${{ !cancelled() && (needs.approve.result == 'success' || (inputs.approved && needs.approve.result == 'skipped')) }}
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The package repositories' signing key signs the apt and dnf indexes.
    environment: desktop-release-stable
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_BASE: ${{ vars.DESKTOP_SITE_BASE }}
      DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download
      # Releases whose deb stays installable from the apt repository.
      KEEP: '5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            desktop/scripts/ci
            desktop/apps/linux/packaging
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg gpgv jq
      # Stable releases are the tags desktop-vX.Y.Z that are not prereleases.
      # "Newest" is the highest version, not the latest published: a release
      # published again later must not move the channel back.
      - name: The stable releases, newest first
        if: ${{ !inputs.rehearsal }}
        run: |
          set -eu
          if [ -z "$SITE_BASE" ]; then
            echo "the variable DESKTOP_SITE_BASE (the update site's https address) is not set" >&2
            exit 1
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isDraft or .isPrerelease | not) | .tagName' \
            | grep -E '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t v -k 2 -V -r | head -n "$KEEP" > tags || true
          if [ ! -s tags ]; then
            echo "no stable desktop release: nothing to deploy" >&2
            exit 1
          fi
          cat tags
      - name: Download their Linux packages, and the newest release's metadata
        if: ${{ !inputs.rehearsal }}
        run: |
          set -eu
          while read -r tag; do
            mkdir -p "linux-releases/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "linux-releases/$tag" \
              --pattern 'release-meta-linux-x64-*.json' --pattern '*.deb' --pattern '*.rpm'
          done < tags
          newest=$(head -n 1 tags)
          mkdir newest
          gh release download "$newest" --repo "$GITHUB_REPOSITORY" --dir newest --pattern 'release-meta-*.json'
          echo "NEWEST=$newest" >> "$GITHUB_ENV"
      # A rehearsal's files come from the calling run, laid out as the one
      # release there is.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.rehearsal }}
        with:
          name: release-files
          path: rehearsal-release
      - name: The rehearsal's release
        if: ${{ inputs.rehearsal }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -z "$SITE_BASE" ]; then
            echo "the variable DESKTOP_SITE_BASE (the update site's https address) is not set" >&2
            exit 1
          fi
          printf '%s' "$TAG" | grep -Eq '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a stable tag name: $TAG" >&2; exit 1; }
          echo "$TAG" > tags
          mkdir -p "linux-releases/$TAG" newest "sums/$TAG"
          cp rehearsal-release/release-meta-linux-x64-*.json rehearsal-release/*.deb rehearsal-release/*.rpm "linux-releases/$TAG/"
          cp rehearsal-release/release-meta-*.json newest/
          cp rehearsal-release/SHA256SUMS "sums/$TAG/SHA256SUMS"
          echo "NEWEST=$TAG" >> "$GITHUB_ENV"
      # The site redistributes only what the release workflow produced: every
      # downloaded file must be in its release's SHA256SUMS with that hash,
      # and carry build provenance signed by desktop-release.yml in this
      # repository. One failure and nothing is deployed.
      # (A rehearsal has no provenance: its files are checked against its
      # SHA256SUMS only.)
      - name: Verify the downloads
        env:
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -eu
          verify() {   # tag, directory
            sums="sums/$1/SHA256SUMS"
            mkdir -p "sums/$1"
            [ -f "$sums" ] || gh release download "$1" --repo "$GITHUB_REPOSITORY" --dir "sums/$1" --pattern SHA256SUMS
            for file in "$2"/*; do
              name=$(basename "$file")
              listed=$(awk -v name="$name" '$2 == name || $2 == "*" name { print $1 }' "$sums")
              [ -n "$listed" ] || { echo "$1: $name is not in SHA256SUMS" >&2; exit 1; }
              [ "$listed" = "$(sha256sum "$file" | cut -d' ' -f1)" ] || { echo "$1: $name does not have its SHA256SUMS hash" >&2; exit 1; }
              if [ "$REHEARSAL" != true ]; then
                gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/desktop-release.yml" >/dev/null \
                  || { echo "$1: $name has no provenance from desktop-release.yml" >&2; exit 1; }
              fi
              echo "verified $1/$name"
            done
            if [ "$REHEARSAL" != true ]; then
              gh attestation verify "$sums" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/desktop-release.yml" >/dev/null \
                || { echo "$1: SHA256SUMS has no provenance from desktop-release.yml" >&2; exit 1; }
            fi
          }
          while read -r tag; do verify "$tag" "linux-releases/$tag"; done < tags
          verify "$NEWEST" newest
      - name: Pointer and feeds
        run: |
          set -eu
          python3 desktop/scripts/ci/update_site.py build --assets newest --tag "$NEWEST" --channel stable \
            --download-base "$DOWNLOAD_BASE" --site-base "$SITE_BASE" --out site
          python3 desktop/scripts/ci/update_site.py check site/desktop/channels/stable.json --channel stable
      - name: apt and dnf repositories
        env:
          PKG_GPG_PRIVATE_KEY: ${{ secrets.PPVPN_PKG_GPG_PRIVATE_KEY }}
          PKG_GPG_PASSPHRASE: ${{ secrets.PPVPN_PKG_GPG_PASSPHRASE }}
        run: |
          set -eu
          # The key must be the one whose public half the packages ship.
          PKG_GPG_FINGERPRINT=$(gpg --show-keys --with-colons desktop/apps/linux/packaging/ppvpn.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          [ -n "$PKG_GPG_FINGERPRINT" ] || { echo "no fingerprint in packaging/ppvpn.asc" >&2; exit 1; }
          export PKG_GPG_FINGERPRINT
          desktop/scripts/ci/build-linux-repo.sh --channel stable --releases linux-releases \
            --download-base "$DOWNLOAD_BASE" --site-base "$SITE_BASE" --out site --keep "$KEEP"
      - name: The site
        run: |
          set -eu
          # One version in the pointer, the feeds and the Linux update check.
          version=$(jq -er .version site/desktop/channels/stable.json)
          [ "$(jq -er .version site/linux/stable/latest.json)" = "$version" ] \
            || { echo "latest.json and the channel pointer name different versions" >&2; exit 1; }
          find site -type f | sort
          du -sh site
          # Pages refuses a site over 1 GB.
          [ "$(du -sm site | cut -f1)" -lt 900 ] || { echo "the site is close to the Pages limit of 1 GB" >&2; exit 1; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !inputs.rehearsal }}
        with:
          path: site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.rehearsal }}
        with:
          name: site-rehearsal
          path: site
          if-no-files-found: error
          retention-days: 3
      - name: Rehearsal summary
        if: ${{ inputs.rehearsal }}
        run: |
          echo "The site was built and not deployed. It is the artifact site-rehearsal of this run." >>"$GITHUB_STEP_SUMMARY"

  deploy:
    if: ${{ !cancelled() && !inputs.rehearsal && needs.site.result == 'success' }}
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
