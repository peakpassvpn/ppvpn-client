name: prebuilt BoringSSL
description: >-
  BoringSSL as btls publishes it for the btls-sys that Cargo.lock pins
  (checked against the release's SHA256SUMS and build attestation), instead
  of compiling it; btls's script at a fixed commit. Exports the per-target
  BORING_BSSL_* variables to the job's environment, so several targets can
  be set up in one job. Installs gh first where the job has none (the swift
  container); gh verifies the attestation.
inputs:
  targets:
    description: Rust target triples, separated by spaces
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        if ! command -v gh >/dev/null; then
          # Ubuntu's own gh predates `gh attestation`: GitHub's apt repository.
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          install -d -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh
        fi
        script="$RUNNER_TEMP/prebuilt-boringssl.sh"
        if ! curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 -o "$script" \
          https://raw.githubusercontent.com/peakpassvpn/btls/16f0e320995602930eb11edc2be8d56b7145713f/scripts/prebuilt-boringssl.sh; then
          # Same pinned file through GitHub's API when the raw CDN is unavailable.
          gh api 'repos/peakpassvpn/btls/contents/scripts/prebuilt-boringssl.sh?ref=16f0e320995602930eb11edc2be8d56b7145713f' > "$script.json"
          python3 -c 'import base64,json,pathlib,sys; j=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert j["encoding"]=="base64" and j["sha"]=="258aaa484798298cf4e59ca0b4757c79cc302786"; pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(j["content"]))' "$script.json" "$script"
        fi
        # Verify both download paths before executing; keep artifact attestation below.
        python3 -c 'import hashlib,pathlib,sys; assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()=="dc6af85368d3cc6bf40c2b7ea9e025264b99adb4b3aa81cb39c8e36441802bda", "Pinned BoringSSL script checksum mismatch"' "$script"
        echo 'Pinned BoringSSL script SHA256 verified' >&2
        # Preserve the pinned script and all its checksum/attestation checks.
        # Only its exact release-download curl calls get an official API fallback.
        BTLS_FALLBACK_COMMIT=$(awk '/^name = "btls-sys"$/ { found=1; next } found && /^source = / { sub(/.*#/, ""); sub(/".*/, ""); print; exit }' Cargo.lock)
        [[ "$BTLS_FALLBACK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
        export BTLS_FALLBACK_COMMIT
        curl() {
          local result=0
          [[ "$#" != 6 || "$6" != https://github.com/peakpassvpn/btls/releases/download/* ]] || echo "BoringSSL release download: $6" >&2
          command curl "$@" || result=$?
          [[ "$result" != 0 ]] || return 0
          local base="https://github.com/peakpassvpn/btls/releases/download/bssl-$BTLS_FALLBACK_COMMIT"
          if [[ "$#" == 6 && "$1" == -fsSL && "$2" == --retry && "$3" == 3 && "$4" == -o &&
                ( "$6" == "$base/boringssl-$BTLS_FALLBACK_TARGET.tar.gz" || "$6" == "$base/SHA256SUMS" ) ]]; then
            local tag="bssl-$BTLS_FALLBACK_COMMIT" asset="${6##*/}" output="$5"
            [[ "${output##*/}" == "$asset" ]] || return "$result"
            echo "BoringSSL release CDN failed; downloading $tag/$asset through GitHub API" >&2
            gh release download "$tag" --repo peakpassvpn/btls --pattern "$asset" --output "$5" --clobber
          else
            return "$result"
          fi
        }
        export -f curl
        for target in $TARGETS; do
          [[ "$target" =~ ^[a-z0-9_-]+$ ]]
          export BTLS_FALLBACK_TARGET="$target"
          bash "$script" Cargo.lock "$target" | sed -E "s/^export //; s/'//g" | tee -a "$GITHUB_ENV"
        done
